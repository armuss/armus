<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mesajlar | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: #f4f4f2;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
      font-weight: 700;
    }

    .nav-greeting {
      font-size: 13px;
      color: #c7c7c7;
      margin-right: 4px;
    }

    .nav-greeting small {
      color: #8f8f8f;
    }

    /* GATE */

    .gate {
      display: none;
      padding: 100px 0;
      text-align: center;
    }

    .gate h1 {
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .gate p {
      color: #99999c;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .gate-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* PAGE */

    main.container {
      padding: 30px 0 40px;
      display: none;
    }

    h1 {
      font-size: clamp(24px, 4vw, 30px);
      letter-spacing: -1px;
      margin-bottom: 22px;
    }

    .chat-shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      border: 1px solid var(--armus-border);
      border-radius: 20px;
      background: var(--armus-panel);
      overflow: hidden;
      height: 65vh;
      min-height: 480px;
    }

    /* CONVERSATION LIST */

    .convo-list {
      border-right: 1px solid var(--armus-border-soft);
      overflow-y: auto;
    }

    .convo-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--armus-border-soft);
    }

    .convo-item:hover,
    .convo-item.active {
      background: var(--armus-panel-2);
    }

    .convo-avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .convo-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .convo-info {
      min-width: 0;
      flex: 1;
    }

    .convo-name {
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .convo-preview {
      color: #8e8e91;
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--armus-gold-2);
      flex-shrink: 0;
    }

    .convo-empty {
      padding: 30px 18px;
      color: #77777b;
      font-size: 13px;
      text-align: center;
    }

    /* THREAD */

    .thread {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .thread-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--armus-border-soft);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thread-header a {
      color: var(--armus-gold-text);
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }

    .thread-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thread-placeholder {
      margin: auto;
      color: #77777b;
      font-size: 13px;
      text-align: center;
      max-width: 260px;
    }

    .msg-row {
      display: flex;
    }

    .msg-row.mine {
      justify-content: flex-end;
    }

    .msg-row {
      align-items: flex-end;
      gap: 6px;
    }

    .msg-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border-soft);
    }

    .msg-attachment img,
    .msg-attachment video {
      max-width: 220px;
      max-height: 220px;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
    }

    .msg-attachment audio {
      width: 220px;
      margin-bottom: 4px;
    }

    .msg-edit-btn {
      border: none;
      background: transparent;
      color: #77777b;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .msg-edit-btn:hover {
      color: var(--armus-gold-text);
    }

    .edit-form-wrap {
      display: flex;
      gap: 8px;
      margin: 4px 0 10px;
      max-width: 70%;
    }

    .edit-form-wrap textarea {
      flex: 1;
      min-height: 40px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-gold-2);
      border-radius: 10px;
      padding: 8px 10px;
      color: white;
      font-family: inherit;
      font-size: 12.5px;
      resize: vertical;
    }

    .edit-form-wrap button {
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .msg-edited-tag {
      font-size: 9.5px;
      opacity: .6;
      margin-left: 4px;
    }

    .msg-row.mine .msg-bubble {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
    }

    .msg-time {
      display: block;
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.65;
    }

    .chat-warning {
      display: none;
      margin: 0 14px 12px;
      padding: 10px 14px;
      border: 1px solid #c0392b;
      background: rgba(192, 57, 43, .12);
      color: #ff9d91;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.6;
    }

    .thread-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .thread-input textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 100px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 14px;
      color: white;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
    }

    .thread-input button[type="submit"] {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .icon-btn {
      border: 1px solid var(--armus-border);
      background: var(--armus-panel-2);
      color: #eee;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }

    .icon-btn.recording {
      background: #c0392b;
      border-color: #c0392b;
      color: white;
    }

    .recording-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 14px 10px;
      font-size: 12px;
      color: #ff9d91;
    }

    .recording-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      animation: armus-pulse 1s infinite;
    }

    @keyframes armus-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }

    .recording-indicator button {
      border: none;
      background: transparent;
      color: #ff9d91;
      text-decoration: underline;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      .chat-shell {
        grid-template-columns: 1fr;
        height: auto;
      }

      .convo-list {
        border-right: none;
        border-bottom: 1px solid var(--armus-border-soft);
        max-height: 220px;
      }

      .thread {
        height: 60vh;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <span class="logo">ARMUS</span>
      <div class="nav-buttons" id="navAuthButtons"></div>
    </div>
  </nav>

  <div class="container">
    <div class="gate" id="gate">
      <h1>Mesajlarını görmek için giriş yap</h1>
      <p>Öğretmenlerinle veya öğrencilerinle yazışabilmek için önce bir hesabın olması gerekiyor.</p>
      <div class="gate-actions">
        <a class="btn" href="login.html?next=mesajlar.html">Giriş Yap</a>
        <a class="btn btn-light" href="register.html?next=mesajlar.html">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <main class="container" id="pageRoot">

    <h1>Mesajlar</h1>

    <div class="chat-shell">
      <div class="convo-list" id="convoList"></div>

      <div class="thread">
        <div class="thread-header" id="threadHeader" style="display: none;"></div>
        <div class="thread-body" id="threadBody">
          <div class="thread-placeholder">Yazışmalarını görmek için soldan bir kişi seç.</div>
        </div>
        <div class="chat-warning" id="chatWarning"></div>
        <div class="recording-indicator" id="recordingIndicator">
          <span class="recording-dot"></span>
          <span id="recordingTimer">0:00</span>
          <button type="button" id="cancelRecordingBtn">İptal</button>
        </div>
        <form class="thread-input" id="threadForm" style="display: none;">
          <input type="file" id="attachInput" accept="image/*,video/*" hidden>
          <button type="button" class="icon-btn" id="attachBtn" title="Fotoğraf/video gönder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.8"></circle><polyline points="21 15 15 9 5 19"></polyline></svg>
          </button>
          <button type="button" class="icon-btn" id="micBtn" title="Sesli mesaj gönder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg>
          </button>
          <textarea id="messageInput" placeholder="Bir mesaj yaz..."></textarea>
          <button type="submit">Gönder</button>
        </form>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="site-settings.js"></script>
  <script src="auth.js"></script>
  <script src="messages.js"></script>
  <script>

    const gate = document.getElementById("gate");
    const pageRoot = document.getElementById("pageRoot");

    let currentSession = null;
    let currentChannel = null;
    let activeConversationId = null;
    let activeConversationHasBooking = false;

    function showChatWarning(message) {
      const box = document.getElementById("chatWarning");
      box.textContent = message;
      box.style.display = "block";
    }

    function hideChatWarning() {
      document.getElementById("chatWarning").style.display = "none";
    }

    function initials(name) {
      return name.split(" ").map(p => p[0]).filter(Boolean).slice(0, 2).join("").toUpperCase();
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function renderConvoList(conversations, activeId) {

      const list = document.getElementById("convoList");

      if (conversations.length === 0) {
        list.innerHTML = '<div class="convo-empty">Henüz bir yazışman yok. Bir öğretmenin profilinden "Mesaj Gönder" ile başlayabilirsin.</div>';
        return;
      }

      list.innerHTML = "";

      conversations.forEach(c => {

        const item = document.createElement("div");
        item.className = "convo-item" + (c.id === activeId ? " active" : "");
        const avatarInner = c.otherPhoto
          ? `<img src="${c.otherPhoto}" alt="">`
          : initials(c.otherName);

        item.innerHTML = `
          <div class="convo-avatar">${avatarInner}</div>
          <div class="convo-info">
            <div class="convo-name">${c.otherName}${c.unreadCount > 0 ? '<span class="unread-dot"></span>' : ""}</div>
            <div class="convo-preview">${c.lastMessage ? (c.lastMessage.body || attachmentPreviewLabel(c.lastMessage.attachment_type)) : "Henüz mesaj yok"}</div>
          </div>
        `;

        item.addEventListener("click", () => openConversation(c.id, c.otherName, c.otherPhoto, c.otherId));
        list.appendChild(item);
      });
    }

    async function openConversation(conversationId, otherName, otherPhoto, otherId) {

      activeConversationId = conversationId;
      hideChatWarning();

      const header = document.getElementById("threadHeader");
      header.style.display = "flex";
      const avatarInner = otherPhoto ? `<img src="${otherPhoto}" alt="" style="width:28px;height:28px;border-radius:8px;object-fit:cover;">` : "";
      header.innerHTML = `${avatarInner}<span>${otherName}</span>`;

      document.getElementById("threadForm").style.display = "flex";

      activeConversationHasBooking = await armusHasBookingWithOtherParty(otherId);

      await loadThread(conversationId);

      if (currentChannel) armusSupabase.removeChannel(currentChannel);
      currentChannel = armusSubscribeToMessages(
        conversationId,
        message => {
          appendMessage(message);
          if (message.sender_id !== currentSession.id) {
            armusMarkMessagesRead(conversationId, currentSession.id);
          }
        },
        message => updateMessageInPlace(message)
      );

      await armusMarkMessagesRead(conversationId, currentSession.id);
      await refreshConvoList(conversationId);
    }

    let messagesById = {};

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function attachmentPreviewLabel(type) {
      if (type === "image") return "📷 Fotoğraf";
      if (type === "video") return "🎥 Video";
      if (type === "audio") return "🎤 Sesli mesaj";
      return "Mesaj";
    }

    const EDIT_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

    const EDIT_WINDOW_MS = 2 * 60 * 1000;

    function canEditMessage(message) {
      return message.sender_id === currentSession.id
        && Boolean(message.body)
        && (Date.now() - new Date(message.created_at).getTime()) < EDIT_WINDOW_MS;
    }

    function buildBubbleContent(message) {

      let html = "";

      if (message.attachment_type === "image") {
        html += `<div class="msg-attachment"><a href="${message.attachment_url}" target="_blank" rel="noopener"><img src="${message.attachment_url}" alt=""></a></div>`;
      } else if (message.attachment_type === "video") {
        html += `<div class="msg-attachment"><video src="${message.attachment_url}" controls></video></div>`;
      } else if (message.attachment_type === "audio") {
        html += `<div class="msg-attachment"><audio src="${message.attachment_url}" controls></audio></div>`;
      }

      if (message.body) html += escapeHtml(message.body);

      html += `<span class="msg-time">${formatTime(message.created_at)}${message.edited_at ? '<span class="msg-edited-tag">(düzenlendi)</span>' : ""}</span>`;
      return html;
    }

    function openEditForm(message, row) {

      const existing = row.nextElementSibling;
      if (existing && existing.classList.contains("edit-form-wrap")) {
        existing.remove();
        return;
      }

      const wrap = document.createElement("div");
      wrap.className = "edit-form-wrap";
      wrap.innerHTML = `
        <textarea>${escapeHtml(message.body)}</textarea>
        <button type="button">Kaydet</button>
      `;
      row.insertAdjacentElement("afterend", wrap);
      wrap.querySelector("textarea").focus();

      wrap.querySelector("button").addEventListener("click", async () => {

        const newText = wrap.querySelector("textarea").value.trim();
        if (!newText) return;

        const result = await armusEditMessage(message.id, newText);
        wrap.remove();

        if (result === "expired") {
          showChatWarning("Bu mesajı düzenleme süresi doldu (gönderildikten sonraki 2 dakika içinde düzenlenebilir).");
        } else if (result === "denied" || result === false) {
          showChatWarning("Mesaj düzenlenemedi.");
        } else {
          updateMessageInPlace(result);
        }
      });
    }

    function appendMessage(message) {

      messagesById[message.id] = message;

      const body = document.getElementById("threadBody");
      const placeholder = body.querySelector(".thread-placeholder");
      if (placeholder) placeholder.remove();

      const isMine = message.sender_id === currentSession.id;

      const row = document.createElement("div");
      row.className = "msg-row" + (isMine ? " mine" : "");
      row.dataset.msgId = message.id;
      row.innerHTML = `
        <div class="msg-bubble">
          ${buildBubbleContent(message)}
        </div>
        ${canEditMessage(message) ? `<button type="button" class="msg-edit-btn" title="Düzenle">${EDIT_ICON_SVG}</button>` : ""}
      `;

      if (canEditMessage(message)) {
        row.querySelector(".msg-edit-btn").addEventListener("click", () => openEditForm(message, row));
      }

      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    // Applies an edited/updated message (from a successful edit, or a
    // realtime UPDATE event) to an already-rendered row in place,
    // instead of re-appending it as a new bubble.
    function updateMessageInPlace(message) {

      messagesById[message.id] = message;

      const row = document.querySelector(`.msg-row[data-msg-id="${message.id}"]`);
      if (!row) return;

      const isMine = message.sender_id === currentSession.id;
      row.innerHTML = `
        <div class="msg-bubble">
          ${buildBubbleContent(message)}
        </div>
        ${canEditMessage(message) ? `<button type="button" class="msg-edit-btn" title="Düzenle">${EDIT_ICON_SVG}</button>` : ""}
      `;

      if (canEditMessage(message)) {
        row.querySelector(".msg-edit-btn").addEventListener("click", () => openEditForm(message, row));
      }
    }

    async function loadThread(conversationId) {

      const body = document.getElementById("threadBody");
      body.innerHTML = "";
      messagesById = {};

      const messages = await armusGetMessages(conversationId);

      if (messages.length === 0) {
        body.innerHTML = '<div class="thread-placeholder">Henüz mesaj yok, ilk mesajı sen gönder.</div>';
        return;
      }

      messages.forEach(appendMessage);
    }

    async function refreshConvoList(activeId) {
      const conversations = await armusGetConversations();
      renderConvoList(conversations, activeId);
      return conversations;
    }

    document.getElementById("threadForm").addEventListener("submit", async event => {

      event.preventDefault();
      if (!activeConversationId) return;

      // recording a voice message? "Gönder" stops it and sends it,
      // instead of trying to submit the (empty) text box
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      const input = document.getElementById("messageInput");
      const body = input.value.trim();
      if (!body) return;

      if (!activeConversationHasBooking && armusMessageViolatesContactPolicy(body)) {
        showChatWarning(
          "Bu mesaj gönderilemedi: telefon numarası, e-posta veya WhatsApp/Instagram gibi platform dışı iletişim bilgisi paylaşımı, resmi bir ders rezervasyonu olana kadar yasak. Lütfen yazışmaya ARMUS üzerinden devam et."
        );
        return;
      }

      hideChatWarning();
      input.value = "";

      const result = await armusSendMessage(activeConversationId, body);

      if (result === "blocked") {
        input.value = body;
        showChatWarning(
          "Bu mesaj gönderilemedi: telefon numarası, e-posta veya platform dışı iletişim bilgisi paylaşımı, resmi bir ders rezervasyonu olana kadar yasak."
        );
      }
    });

    // ---- photo/video attachments ----

    document.getElementById("attachBtn").addEventListener("click", () => {
      if (!activeConversationId) return;
      document.getElementById("attachInput").click();
    });

    document.getElementById("attachInput").addEventListener("change", async event => {

      const file = event.target.files[0];
      event.target.value = "";
      if (!file || !activeConversationId) return;

      const maxBytes = file.type.startsWith("video/") ? 25 * 1024 * 1024 : 8 * 1024 * 1024;
      if (file.size > maxBytes) {
        showChatWarning(`Dosya çok büyük (maks ${Math.round(maxBytes / 1024 / 1024)}MB).`);
        return;
      }

      hideChatWarning();
      const uploaded = await armusUploadChatAttachment(file, activeConversationId);

      if (!uploaded) {
        showChatWarning("Dosya gönderilemedi. Lütfen tekrar dene.");
        return;
      }

      await armusSendMessage(activeConversationId, "", { attachmentUrl: uploaded.url, attachmentType: uploaded.type });
    });

    // ---- voice messages ----

    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingCancelled = false;
    let recordingTimerInterval = null;

    document.getElementById("micBtn").addEventListener("click", async () => {

      if (!activeConversationId) return;

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        showChatWarning("Mikrofon erişimi alınamadı. Tarayıcı izinlerini kontrol et.");
        return;
      }

      hideChatWarning();
      recordedChunks = [];
      recordingCancelled = false;
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) recordedChunks.push(event.data);
      };

      mediaRecorder.onstop = async () => {

        stream.getTracks().forEach(track => track.stop());
        clearInterval(recordingTimerInterval);
        document.getElementById("recordingIndicator").style.display = "none";
        document.getElementById("micBtn").classList.remove("recording");

        const wasCancelled = recordingCancelled;
        recordingCancelled = false;
        if (wasCancelled || recordedChunks.length === 0) return;

        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        if (blob.size > 15 * 1024 * 1024) {
          showChatWarning("Ses kaydı çok büyük, daha kısa bir kayıt dene.");
          return;
        }

        const file = new File([blob], "voice-message.webm", { type: "audio/webm" });
        const uploaded = await armusUploadChatAttachment(file, activeConversationId);

        if (!uploaded) {
          showChatWarning("Ses mesajı gönderilemedi. Lütfen tekrar dene.");
          return;
        }

        await armusSendMessage(activeConversationId, "", { attachmentUrl: uploaded.url, attachmentType: uploaded.type });
      };

      mediaRecorder.start();
      document.getElementById("micBtn").classList.add("recording");
      const indicator = document.getElementById("recordingIndicator");
      indicator.style.display = "flex";

      const recordingStartedAt = Date.now();
      const MAX_RECORDING_SECONDS = 120;

      recordingTimerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - recordingStartedAt) / 1000);
        document.getElementById("recordingTimer").textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
        if (secs >= MAX_RECORDING_SECONDS) mediaRecorder.stop();
      }, 300);
    });

    document.getElementById("cancelRecordingBtn").addEventListener("click", () => {
      if (!mediaRecorder) return;
      recordingCancelled = true;
      mediaRecorder.stop();
    });

    (async function() {

      currentSession = await armusGetSession();

      if (!currentSession) {
        gate.style.display = "block";
        return;
      }

      pageRoot.style.display = "block";

      const params = new URLSearchParams(window.location.search);
      const teacherParam = params.get("teacher");

      const conversations = await refreshConvoList(null);

      if (teacherParam) {
        const convo = await armusGetOrCreateConversation(teacherParam);
        if (convo) {
          const fresh = await refreshConvoList(convo.id);
          const match = fresh.find(c => c.id === convo.id);
          if (match) await openConversation(match.id, match.otherName, match.otherPhoto, match.otherId);
        }
      } else if (conversations.length > 0) {
        await openConversation(conversations[0].id, conversations[0].otherName, conversations[0].otherPhoto, conversations[0].otherId);
      }

    })();

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
