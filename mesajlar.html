<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <script>if("scrollRestoration" in history){history.scrollRestoration="manual";}</script>
  <script>(function(){try{if(sessionStorage.getItem("armusLogoPlayed")){document.documentElement.classList.add("armus-logo-static");}else{sessionStorage.setItem("armusLogoPlayed","1");}}catch(e){}})();</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mesajlar | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css?v=8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--armus-bg);
    }

    .nav-inner {
      width: min(940px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-find-tutor {
      font-size: 14px;
      font-weight: 600;
      color: var(--armus-muted);
      text-decoration: none;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
      flex-shrink: 0;
      transition: 0.2s;
    }

    .nav-find-tutor:hover {
      color: var(--armus-ink);
      border-bottom-color: var(--armus-gold-2);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* .btn/.btn-light/.nav-greeting: canonical shared definition now
       lives in theme.css (every page loads it) instead of being
       redefined here. */

    .nav-utility {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .lang-toggle {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: var(--armus-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 12.5px Inter, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--armus-border);
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .help-btn:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn svg {
      width: 17px;
      height: 17px;
    }

    /* GATE */

    .gate {
      display: none;
      padding: 100px 0;
      text-align: center;
    }

    .gate h1 {
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .gate p {
      color: var(--armus-muted);
      font-size: 14px;
      margin-bottom: 26px;
    }

    .gate-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* PAGE */

    main.container {
      padding: 30px 0 40px;
      display: none;
    }

    h1 {
      font-size: clamp(24px, 4vw, 30px);
      letter-spacing: -1px;
      margin-bottom: 22px;
    }

    .chat-shell {
      display: grid;
      grid-template-columns: 300px 1fr 260px;
      border: 1px solid var(--armus-border);
      border-radius: 20px;
      background: var(--armus-panel);
      overflow: hidden;
      height: 65vh;
      min-height: 480px;
    }

    /* CONTEXT PANEL - who you're talking to: their role/specialty (when
       they're a teacher - armusFindMarketplaceTeacher returns null for a
       student, so this whole section just stays empty when a teacher
       account is the one viewing this page), your next lesson together
       if any, and a quick way back to booking. */

    .convo-context {
      border-left: 1px solid var(--armus-border-soft);
      background: var(--armus-panel-2);
      padding: 26px 18px;
      text-align: center;
      overflow-y: auto;
      min-height: 0;
    }

    .context-placeholder {
      color: var(--armus-faint);
      font-size: 12.5px;
      margin-top: 40px;
    }

    .context-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      overflow: hidden;
    }

    .context-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .context-name {
      font-size: 15px;
      font-weight: 800;
    }

    .context-profile-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .context-role {
      font-size: 11.5px;
      color: var(--armus-muted);
      margin: 2px 0 18px;
    }

    .context-card {
      background: var(--armus-panel);
      border: 1px solid var(--armus-border-soft);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      margin-bottom: 10px;
    }

    .context-card strong {
      display: block;
      font-size: 11.5px;
      margin-bottom: 2px;
    }

    .context-card span {
      font-size: 11px;
      color: var(--armus-muted);
    }

    .context-btn {
      display: block;
      width: 100%;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 12px;
      margin-top: 6px;
      text-decoration: none;
      box-sizing: border-box;
    }

    /* CONVERSATION LIST */

    .convo-list {
      border-right: 1px solid var(--armus-border-soft);
      overflow-y: auto;
      min-height: 0;
    }

    .convo-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--armus-border-soft);
    }

    .convo-item:hover,
    .convo-item.active {
      background: var(--armus-panel-2);
    }

    .convo-avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .convo-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .convo-info {
      min-width: 0;
      flex: 1;
    }

    .convo-name {
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .convo-preview {
      color: var(--armus-muted);
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--armus-gold-2);
      flex-shrink: 0;
    }

    .convo-empty {
      padding: 30px 18px;
      color: var(--armus-faint);
      font-size: 13px;
      text-align: center;
    }

    /* THREAD */

    .thread {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .thread-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--armus-border-soft);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thread-header a {
      color: var(--armus-gold-text);
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }

    .thread-header a.thread-header-profile-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      margin-left: 0;
      text-decoration: none;
    }

    .thread-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thread-placeholder {
      margin: auto;
      color: var(--armus-faint);
      font-size: 13px;
      text-align: center;
      max-width: 260px;
    }

    .msg-row {
      display: flex;
    }

    .msg-row.mine {
      justify-content: flex-end;
    }

    .msg-row {
      align-items: flex-end;
      gap: 6px;
    }

    .msg-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 20px 20px 20px 4px;
      font-size: 13.5px;
      line-height: 1.5;
      background: var(--armus-panel-2);
    }

    .msg-attachment img,
    .msg-attachment video {
      max-width: 220px;
      max-height: 220px;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
    }

    /* custom voice-message player - replaces the browser's native
       <audio controls> element, which renders wildly differently (and
       always plainly) across browsers and never matches the bubble. */
    .voice-player {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 220px;
      max-width: 100%;
    }

    .voice-play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      flex-shrink: 0;
      background: var(--armus-gold-gradient);
      color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .voice-play-btn svg {
      width: 15px;
      height: 15px;
    }

    .voice-play-btn .icon-play {
      margin-left: 2px;
    }

    .voice-wave {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 22px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .voice-wave span {
      width: 3px;
      border-radius: 2px;
      background: var(--armus-faint);
      flex-shrink: 0;
      transition: background-color .1s linear;
    }

    .voice-wave span.played {
      background: var(--armus-ink);
    }

    .msg-row.mine .voice-wave span {
      background: rgba(255, 255, 255, .3);
    }

    .msg-row.mine .voice-wave span.played {
      background: #fff;
    }

    .voice-duration {
      font-size: 11px;
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .msg-row.mine .voice-duration {
      color: rgba(255, 255, 255, .7);
    }

    .msg-edit-btn {
      border: none;
      background: transparent;
      color: var(--armus-muted);
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .msg-edit-btn:hover {
      color: var(--armus-gold-text);
    }

    .edit-form-wrap {
      display: flex;
      gap: 8px;
      margin: 4px 0 10px;
      max-width: 70%;
    }

    .edit-form-wrap textarea {
      flex: 1;
      min-height: 40px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-gold-2);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 12.5px;
      resize: vertical;
    }

    .edit-form-wrap button {
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .msg-edited-tag {
      font-size: 9.5px;
      opacity: .6;
      margin-left: 4px;
    }

    .msg-row.mine .msg-bubble {
      background: var(--armus-ink);
      color: #fff;
      border-radius: 20px 20px 4px 20px;
    }

    .msg-time {
      display: block;
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.65;
    }

    .chat-warning {
      display: none;
      margin: 0 14px 12px;
      padding: 10px 14px;
      border: 1px solid #c0392b;
      background: rgba(192, 57, 43, .12);
      color: #b3261e;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.6;
    }

    .thread-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .thread-input textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 100px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
    }

    .thread-input button[type="submit"] {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .icon-btn {
      border: 1px solid var(--armus-border);
      background: var(--armus-panel-2);
      color: var(--armus-ink);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }

    /* RECORDING BAR - replaces the whole input row while recording a
       voice message (instead of showing a thin status line above it,
       with the mic/attach/textarea/send row still sitting there
       underneath, doing nothing). */

    .recording-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
    }

    .recording-cancel {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--armus-panel-2);
      color: #b3261e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .recording-cancel svg {
      width: 17px;
      height: 17px;
    }

    .recording-mid {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--armus-panel-2);
      border-radius: 999px;
      padding: 8px 16px;
    }

    .recording-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      flex-shrink: 0;
      animation: armus-pulse 1s infinite;
    }

    @keyframes armus-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }

    .recording-wave {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 20px;
      flex: 1;
      min-width: 0;
    }

    .recording-wave span {
      width: 2.5px;
      border-radius: 2px;
      background: #c23b2e;
      animation: armus-wave-bounce .8s ease-in-out infinite;
    }

    @keyframes armus-wave-bounce {
      0%, 100% { transform: scaleY(.35); }
      50% { transform: scaleY(1); }
    }

    #recordingTimer {
      font-size: 12px;
      font-weight: 700;
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .recording-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .recording-send svg {
      width: 18px;
      height: 18px;
    }

    @media (max-width: 1000px) {
      /* a 768px tablet still fit all 3 columns (300px list + 1fr thread +
         260px context), leaving the thread barely wide enough for its own
         composer - the textarea shrank to a few px and the send button
         sat mostly hidden under the context panel. Drop the context panel
         here, before the full single-column phone layout kicks in below,
         so the list+thread 2-column view still gets real room on a tablet
         instead of jumping straight to the stacked mobile layout. */
      .chat-shell {
        grid-template-columns: 300px 1fr;
      }

      .convo-context {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .chat-shell {
        grid-template-columns: 1fr;
        height: auto;
      }

      .convo-list {
        border-right: none;
        border-bottom: 1px solid var(--armus-border-soft);
        max-height: 220px;
      }

      .thread {
        height: 60vh;
      }

      .convo-context {
        display: none;
      }

      .nav-utility {
        gap: 6px;
      }

      .help-btn {
        display: none;
      }


      .nav-greeting {
        display: none;
      }

      .nav-buttons {
        gap: 6px;
      }

      .nav-buttons .btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <span class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></span>
      <a href="teachers" class="nav-find-tutor" data-i18n="nav.findTutor">Öğretmen Bul</a>
      <div class="nav-utility">
        <button type="button" class="lang-toggle" data-lang-toggle title="Dili değiştir / Change language">EN</button>
        <a class="help-btn" href="sss" title="Yardım Merkezi" aria-label="Yardım Merkezi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </a>
      </div>
      <div class="nav-buttons" id="navAuthButtons"></div>
    </div>
  </nav>

  <div class="container">
    <div class="gate" id="gate">
      <h1 data-i18n="messages.gateTitle">Mesajlarını görmek için giriş yap</h1>
      <p data-i18n="messages.gateText">Öğretmenlerinle veya öğrencilerinle yazışabilmek için önce bir hesabın olması gerekiyor.</p>
      <div class="gate-actions">
        <a class="btn" href="login?next=mesajlar" data-i18n="nav.login">Giriş Yap</a>
        <a class="btn btn-light" href="register?next=mesajlar" data-i18n="nav.register">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <main class="container" id="pageRoot">

    <h1 data-i18n="messages.title">Mesajlar</h1>

    <div class="chat-shell">
      <div class="convo-list" id="convoList"></div>

      <div class="thread">
        <div class="thread-header" id="threadHeader" style="display: none;"></div>
        <div class="thread-body" id="threadBody">
          <div class="thread-placeholder" data-i18n="messages.threadPlaceholder">Yazışmalarını görmek için soldan bir kişi seç.</div>
        </div>
        <div class="chat-warning" id="chatWarning"></div>
        <div class="recording-bar" id="recordingIndicator" style="display: none;">
          <button type="button" id="cancelRecordingBtn" class="recording-cancel" title="İptal" data-i18n-title="class.cancel" aria-label="İptal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
          </button>
          <div class="recording-mid">
            <span class="recording-dot"></span>
            <div class="recording-wave" id="recordingWave"></div>
            <span id="recordingTimer">0:00</span>
          </div>
          <button type="button" id="sendRecordingBtn" class="recording-send" title="Gönder" data-i18n-title="contact.submit" aria-label="Gönder">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"></path></svg>
          </button>
        </div>
        <form class="thread-input" id="threadForm" style="display: none;">
          <input type="file" id="attachInput" accept="image/*,video/*" hidden>
          <button type="button" class="icon-btn" id="attachBtn" title="Fotoğraf/video gönder" data-i18n-title="messages.attachTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.8"></circle><polyline points="21 15 15 9 5 19"></polyline></svg>
          </button>
          <button type="button" class="icon-btn" id="micBtn" title="Sesli mesaj gönder" data-i18n-title="messages.micTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg>
          </button>
          <textarea id="messageInput" placeholder="Bir mesaj yaz..." data-i18n-placeholder="messages.inputPlaceholder"></textarea>
          <button type="submit" data-i18n="contact.submit">Gönder</button>
        </form>
      </div>

      <div class="convo-context" id="convoContext">
        <div class="context-placeholder" data-i18n="messages.contextPlaceholder">Bir sohbet seçtiğinde burada görünür.</div>
      </div>
    </div>

  </main>

  <script src="i18n.js?v=16"></script>
  <script src="teachers-data.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=4"></script>
  <script src="site-settings.js?v=4"></script>
  <script src="auth.js?v=11"></script>
  <script src="bookings.js?v=7"></script>
  <script src="reviews.js?v=5"></script>
  <script src="marketplace.js?v=6"></script>
  <script src="messages.js?v=4"></script>
  <script>

    const gate = document.getElementById("gate");
    const pageRoot = document.getElementById("pageRoot");

    let currentSession = null;
    let currentChannel = null;
    let activeConversationId = null;
    let activeConversationHasBooking = false;

    // currentSession used to be fetched once at page load and reused for
    // the rest of the visit - if the user signed out (or their account
    // changed) in another tab while this page stayed open, every send/
    // read here kept acting as that stale session until a request
    // finally got rejected server-side. Reloading on a real sign-out is
    // the simplest correct fix: it re-runs the init flow below, which
    // re-fetches the session and shows the login gate if there's none.
    armusSupabase.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") window.location.reload();
    });

    // The other participant in any conversation here is a teacher exactly
    // when the logged-in user is a student (conversations are always
    // student<->teacher) - so their full name never shows, only "Ahmet Y.",
    // the same as everywhere else a teacher's identity would otherwise be
    // exposed to a student.
    function otherPartyDisplayName(name) {
      return currentSession && currentSession.role === "student" ? armusShortDisplayName(name) : armusCapitalizeName(name);
    }

    function showChatWarning(message) {
      const box = document.getElementById("chatWarning");
      box.textContent = message;
      box.style.display = "block";
    }

    function hideChatWarning() {
      document.getElementById("chatWarning").style.display = "none";
    }

    function initials(name) {
      return escapeHtml(name.split(" ").map(p => p[0]).filter(Boolean).slice(0, 2).join("").toUpperCase());
    }

    function formatTime(iso) {
      const d = new Date(iso);
      const locale = (typeof armusGetLang === "function" && armusGetLang() === "en") ? "en-US" : "tr-TR";
      return d.toLocaleString(locale, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function renderConvoList(conversations, activeId) {

      const list = document.getElementById("convoList");

      if (conversations.length === 0) {
        list.innerHTML = `<div class="convo-empty">${armusT("messages.emptyConvoList", 'Henüz bir yazışman yok. Bir öğretmenin profilinden "Mesaj Gönder" ile başlayabilirsin.')}</div>`;
        return;
      }

      list.innerHTML = "";

      conversations.forEach(c => {

        const item = document.createElement("div");
        item.className = "convo-item" + (c.id === activeId ? " active" : "");
        const avatarInner = armusSafeUrl(c.otherPhoto)
          ? `<img src="${armusSafeUrl(c.otherPhoto)}" alt="">`
          : initials(c.otherName);

        item.innerHTML = `
          <div class="convo-avatar">${avatarInner}</div>
          <div class="convo-info">
            <div class="convo-name">${escapeHtml(otherPartyDisplayName(c.otherName))}${c.unreadCount > 0 ? '<span class="unread-dot"></span>' : ""}</div>
            <div class="convo-preview">${c.lastMessage ? escapeHtml(c.lastMessage.body || attachmentPreviewLabel(c.lastMessage.attachment_type)) : armusT("messages.noMessageYet", "Henüz mesaj yok")}</div>
          </div>
        `;

        item.addEventListener("click", () => openConversation(c.id, c.otherName, c.otherPhoto, c.otherId));
        list.appendChild(item);
      });
    }

    // The booking (confirmed, not past) soonest due between the signed-in
    // user and otherId, in whichever direction applies to their role -
    // armusGetBookingsForStudent/Teacher only ever return the caller's
    // own bookings, so this is already scoped to just the two of them.
    async function findUpcomingLessonWith(otherId) {

      if (!currentSession) return null;

      const isTeacher = currentSession.role === "teacher";
      const bookings = isTeacher
        ? await armusGetBookingsForTeacher(currentSession.id)
        : await armusGetBookingsForStudent(currentSession.id);

      const matchKey = isTeacher ? "studentId" : "teacherId";
      const upcoming = bookings
        .filter(b => b[matchKey] === otherId && b.status !== "cancelled" && !armusIsBookingPast(b))
        .sort((a, b) =>
          armusZonedTimeToUtc(a.date, a.time, a.teacherTimezone) - armusZonedTimeToUtc(b.date, b.time, b.teacherTimezone)
        );

      return upcoming[0] || null;
    }

    // Who you're talking to, in the third column: their teaching
    // specialty and a "book again" shortcut when the other party is a
    // teacher (armusFindMarketplaceTeacher returns null for a student,
    // so a teacher account viewing their own inbox just gets the
    // avatar/name/upcoming-lesson part), plus your next lesson together
    // if either role has one booked.
    async function renderConvoContext(conversationId, otherId, otherName, otherPhoto) {

      const panel = document.getElementById("convoContext");
      if (!panel) return;

      const avatarInner = armusSafeUrl(otherPhoto)
        ? `<img src="${armusSafeUrl(otherPhoto)}" alt="">`
        : initials(otherName);

      panel.innerHTML = `
        <div class="context-avatar" id="contextAvatar">${avatarInner}</div>
        <div class="context-name" id="contextName">${escapeHtml(otherPartyDisplayName(otherName))}</div>
        <div id="contextExtra"></div>
      `;

      const [teacher, upcoming] = await Promise.all([
        armusFindMarketplaceTeacher(otherId, currentSession.id).catch(() => null),
        findUpcomingLessonWith(otherId).catch(() => null),
      ]);

      if (activeConversationId !== conversationId) return;

      // Only a confirmed teacher gets a profile to link to - the same
      // gate the booking button and role line below already use (see the
      // comment above this function).
      if (teacher) {
        const profileHref = `teacher?teacher=${encodeURIComponent(otherId)}`;
        const avatarEl = document.getElementById("contextAvatar");
        const nameEl = document.getElementById("contextName");
        if (avatarEl && nameEl) {
          const link = document.createElement("a");
          link.href = profileHref;
          link.className = "context-profile-link";
          avatarEl.before(link);
          link.appendChild(avatarEl);
          link.appendChild(nameEl);
        }
        const header = document.getElementById("threadHeader");
        if (header && !header.querySelector(".thread-header-profile-link")) {
          const headerLink = document.createElement("a");
          headerLink.href = profileHref;
          headerLink.className = "thread-header-profile-link";
          while (header.firstChild) headerLink.appendChild(header.firstChild);
          header.appendChild(headerLink);
        }
      }

      const extra = document.getElementById("contextExtra");
      if (!extra) return;

      let html = "";

      if (teacher && teacher.role) {
        html += `<div class="context-role">${escapeHtml(teacher.role)}</div>`;
      }

      if (upcoming) {
        const when = armusFormatLessonWhen(upcoming);
        html += `
          <div class="context-card">
            <strong>${armusT("messages.contextUpcoming", "Yaklaşan Ders")}</strong>
            <span>${when.dateLabel}, ${when.timeRange}</span>
          </div>
        `;
      }

      if (teacher) {
        html += `
          <div class="context-card">
            <strong>${armusT("messages.contextTotalLessons", "Toplam Ders")}</strong>
            <span>${escapeHtml(teacher.completedLessons)} ${armusT("teacherProfile.lessonsWord", "ders")}${teacher.rating ? ` · ★${teacher.rating}` : ""}</span>
          </div>
          <a class="context-btn" href="booking?teacher=${encodeURIComponent(otherId)}&type=trial">${armusT("messages.contextBookBtn", "Ders Rezervasyonu Yap")}</a>
        `;
      }

      extra.innerHTML = html;
    }

    async function openConversation(conversationId, otherName, otherPhoto, otherId) {

      activeConversationId = conversationId;
      hideChatWarning();

      const header = document.getElementById("threadHeader");
      header.style.display = "flex";
      const avatarInner = armusSafeUrl(otherPhoto) ? `<img src="${armusSafeUrl(otherPhoto)}" alt="" style="width:28px;height:28px;border-radius:8px;object-fit:cover;">` : "";
      header.innerHTML = `${avatarInner}<span>${escapeHtml(otherPartyDisplayName(otherName))}</span>`;

      document.getElementById("threadForm").style.display = "flex";

      renderConvoContext(conversationId, otherId, otherName, otherPhoto);

      // Everything below this point awaits at least once, so a second
      // openConversation() call (the user clicking another conversation
      // before this one finishes loading) can resolve its own awaits out
      // of order and clobber this call's UI/state with a different
      // conversation's data. activeConversationId still being this call's
      // conversationId after each await means no newer call has taken
      // over - bail out the moment that stops being true instead of
      // continuing to act on a conversation the user has since left.
      const hasBooking = await armusHasBookingWithOtherParty(otherId);
      if (activeConversationId !== conversationId) return;
      activeConversationHasBooking = hasBooking;

      await loadThread(conversationId);
      if (activeConversationId !== conversationId) return;

      if (currentChannel) armusSupabase.removeChannel(currentChannel);
      currentChannel = armusSubscribeToMessages(
        conversationId,
        message => {
          appendMessage(message);
          if (message.sender_id !== currentSession.id) {
            armusMarkMessagesRead(conversationId, currentSession.id);
          }
        },
        message => updateMessageInPlace(message)
      );

      await armusMarkMessagesRead(conversationId, currentSession.id);
      if (activeConversationId !== conversationId) return;
      await refreshConvoList(conversationId);
    }

    let messagesById = {};

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function attachmentPreviewLabel(type) {
      if (type === "image") return armusT("messages.photo", "📷 Fotoğraf");
      if (type === "video") return armusT("messages.video", "🎥 Video");
      if (type === "audio") return armusT("messages.voiceMessage", "🎤 Sesli mesaj");
      return armusT("messages.message", "Mesaj");
    }

    const EDIT_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

    // ---- voice message player: a decorative waveform (no real per-sample
    // analysis of the audio, just a pleasant-looking bar pattern seeded by
    // the message id so it's stable across re-renders) plus a real Audio
    // object wired up after the bubble lands in the DOM. Replaces the
    // browser's native <audio controls>, which looks different (and
    // always plain) in every browser and never matches the bubble.
    function buildVoiceWaveBars(seed) {
      let h = 0;
      for (let i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) >>> 0;
      let bars = "";
      for (let i = 0; i < 20; i++) {
        h = (h * 1103515245 + 12345) >>> 0;
        const height = 4 + Math.round(((h >>> 8) / 0x1000000) * 18);
        bars += `<span style="height:${height}px"></span>`;
      }
      return bars;
    }

    function formatDuration(totalSeconds) {
      const s = Math.max(0, Math.round(totalSeconds || 0));
      const m = Math.floor(s / 60);
      const sec = String(s % 60).padStart(2, "0");
      return `${m}:${sec}`;
    }

    // only one voice message plays at a time - starting another pauses
    // whichever one was already playing.
    let activeVoicePlayer = null;

    function stopActiveVoicePlayer() {
      if (!activeVoicePlayer) return;
      activeVoicePlayer.audio.pause();
      activeVoicePlayer.iconPlay.style.display = "";
      activeVoicePlayer.iconPause.style.display = "none";
      activeVoicePlayer = null;
    }

    function wireVoicePlayers(scope) {
      scope.querySelectorAll(".voice-player").forEach(playerEl => {
        if (playerEl.dataset.wired) return;
        playerEl.dataset.wired = "1";

        const src = playerEl.dataset.audioSrc;
        const btn = playerEl.querySelector(".voice-play-btn");
        const iconPlay = btn.querySelector(".icon-play");
        const iconPause = btn.querySelector(".icon-pause");
        const wave = playerEl.querySelector(".voice-wave");
        const bars = Array.from(wave.children);
        const durationEl = playerEl.querySelector(".voice-duration");

        let audio = null;

        function ensureAudio() {
          if (audio) return audio;
          audio = new Audio(src);
          audio.addEventListener("loadedmetadata", () => {
            if (isFinite(audio.duration)) {
              durationEl.textContent = formatDuration(audio.duration);
              return;
            }
            // webm blobs recorded via MediaRecorder often report an
            // Infinity duration until forced to compute it by seeking
            // past the end - "durationchange" then fires with the real
            // value, after which the seek is undone.
            audio.currentTime = 1e10;
            audio.addEventListener("durationchange", function onDurationChange() {
              if (!isFinite(audio.duration)) return;
              durationEl.textContent = formatDuration(audio.duration);
              audio.currentTime = 0;
              audio.removeEventListener("durationchange", onDurationChange);
            });
          });
          audio.addEventListener("timeupdate", () => {
            const frac = audio.duration ? audio.currentTime / audio.duration : 0;
            const playedCount = Math.round(frac * bars.length);
            bars.forEach((bar, i) => bar.classList.toggle("played", i < playedCount));
          });
          audio.addEventListener("ended", () => {
            iconPlay.style.display = "";
            iconPause.style.display = "none";
            bars.forEach(bar => bar.classList.remove("played"));
            activeVoicePlayer = null;
          });
          return audio;
        }

        function play() {
          ensureAudio();
          if (activeVoicePlayer && activeVoicePlayer.audio !== audio) stopActiveVoicePlayer();
          audio.play();
          iconPlay.style.display = "none";
          iconPause.style.display = "";
          activeVoicePlayer = { audio, iconPlay, iconPause };
        }

        function pause() {
          if (audio) audio.pause();
          iconPlay.style.display = "";
          iconPause.style.display = "none";
          if (activeVoicePlayer && activeVoicePlayer.audio === audio) activeVoicePlayer = null;
        }

        btn.addEventListener("click", () => {
          if (audio && !audio.paused) pause();
          else play();
        });

        wave.addEventListener("click", event => {
          ensureAudio();
          const rect = wave.getBoundingClientRect();
          const frac = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
          if (isFinite(audio.duration)) audio.currentTime = frac * audio.duration;
          if (audio.paused) play();
        });
      });
    }

    const EDIT_WINDOW_MS = 2 * 60 * 1000;

    function canEditMessage(message) {
      return message.sender_id === currentSession.id
        && Boolean(message.body)
        && (Date.now() - new Date(message.created_at).getTime()) < EDIT_WINDOW_MS;
    }

    function buildBubbleContent(message) {

      let html = "";

      const attachmentUrl = armusSafeUrl(message.attachment_url);
      if (attachmentUrl && message.attachment_type === "image") {
        html += `<div class="msg-attachment"><a href="${attachmentUrl}" target="_blank" rel="noopener"><img src="${attachmentUrl}" alt=""></a></div>`;
      } else if (attachmentUrl && message.attachment_type === "video") {
        html += `<div class="msg-attachment"><video src="${attachmentUrl}" controls></video></div>`;
      } else if (attachmentUrl && message.attachment_type === "audio") {
        html += `
          <div class="voice-player" data-audio-src="${attachmentUrl}">
            <button type="button" class="voice-play-btn" aria-label="${armusT("messages.playVoice", "Sesli mesajı oynat")}">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
            </button>
            <div class="voice-wave">${buildVoiceWaveBars(message.id)}</div>
            <span class="voice-duration">0:00</span>
          </div>
        `;
      }

      if (message.body) html += escapeHtml(message.body);

      html += `<span class="msg-time">${formatTime(message.created_at)}${message.edited_at ? `<span class="msg-edited-tag">${armusT("messages.edited", "(düzenlendi)")}</span>` : ""}</span>`;
      return html;
    }

    function openEditForm(message, row) {

      const existing = row.nextElementSibling;
      if (existing && existing.classList.contains("edit-form-wrap")) {
        existing.remove();
        return;
      }

      const wrap = document.createElement("div");
      wrap.className = "edit-form-wrap";
      wrap.innerHTML = `
        <textarea>${escapeHtml(message.body)}</textarea>
        <button type="button">${armusT("messages.save", "Kaydet")}</button>
      `;
      row.insertAdjacentElement("afterend", wrap);
      wrap.querySelector("textarea").focus();

      wrap.querySelector("button").addEventListener("click", async () => {

        const newText = wrap.querySelector("textarea").value.trim();
        if (!newText) return;

        const result = await armusEditMessage(message.id, newText);
        wrap.remove();

        if (result === "expired") {
          showChatWarning(armusT("messages.editExpired", "Bu mesajı düzenleme süresi doldu (gönderildikten sonraki 2 dakika içinde düzenlenebilir)."));
        } else if (result === "denied" || result === false) {
          showChatWarning(armusT("messages.editDenied", "Mesaj düzenlenemedi."));
        } else {
          updateMessageInPlace(result);
        }
      });
    }

    function appendMessage(message) {

      // sending a message now appends it optimistically instead of
      // waiting on its realtime echo (see armusSendMessage callers
      // below) - that echo still arrives and calls this again with the
      // same id, so skip it rather than rendering the bubble twice.
      if (document.querySelector(`.msg-row[data-msg-id="${message.id}"]`)) return;

      messagesById[message.id] = message;

      const body = document.getElementById("threadBody");
      const placeholder = body.querySelector(".thread-placeholder");
      if (placeholder) placeholder.remove();

      const isMine = message.sender_id === currentSession.id;

      const row = document.createElement("div");
      row.className = "msg-row" + (isMine ? " mine" : "");
      row.dataset.msgId = message.id;
      row.innerHTML = `
        <div class="msg-bubble">
          ${buildBubbleContent(message)}
        </div>
        ${canEditMessage(message) ? `<button type="button" class="msg-edit-btn" title="${armusT("messages.editTitle", "Düzenle")}">${EDIT_ICON_SVG}</button>` : ""}
      `;

      if (canEditMessage(message)) {
        row.querySelector(".msg-edit-btn").addEventListener("click", () => openEditForm(message, row));
      }

      wireVoicePlayers(row);

      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    // Applies an edited/updated message (from a successful edit, or a
    // realtime UPDATE event) to an already-rendered row in place,
    // instead of re-appending it as a new bubble.
    function updateMessageInPlace(message) {

      messagesById[message.id] = message;

      const row = document.querySelector(`.msg-row[data-msg-id="${message.id}"]`);
      if (!row) return;

      const isMine = message.sender_id === currentSession.id;
      row.innerHTML = `
        <div class="msg-bubble">
          ${buildBubbleContent(message)}
        </div>
        ${canEditMessage(message) ? `<button type="button" class="msg-edit-btn" title="${armusT("messages.editTitle", "Düzenle")}">${EDIT_ICON_SVG}</button>` : ""}
      `;

      if (canEditMessage(message)) {
        row.querySelector(".msg-edit-btn").addEventListener("click", () => openEditForm(message, row));
      }

      wireVoicePlayers(row);
    }

    async function loadThread(conversationId) {

      const body = document.getElementById("threadBody");
      body.innerHTML = "";
      messagesById = {};

      const messages = await armusGetMessages(conversationId);

      if (messages.length === 0) {
        body.innerHTML = `<div class="thread-placeholder">${armusT("messages.emptyThread", "Henüz mesaj yok, ilk mesajı sen gönder.")}</div>`;
        return;
      }

      messages.forEach(appendMessage);
    }

    async function refreshConvoList(activeId) {
      const conversations = await armusGetConversations();
      renderConvoList(conversations, activeId);
      return conversations;
    }

    document.getElementById("threadForm").addEventListener("submit", async event => {

      event.preventDefault();
      if (!activeConversationId) return;

      // recording a voice message? "Gönder" stops it and sends it,
      // instead of trying to submit the (empty) text box
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      const input = document.getElementById("messageInput");
      const body = input.value.trim();
      if (!body) return;

      if (!activeConversationHasBooking && armusMessageViolatesContactPolicy(body)) {
        showChatWarning(armusT(
          "messages.contactPolicyBlocked",
          "Bu mesaj gönderilemedi: telefon numarası, e-posta veya WhatsApp/Instagram gibi platform dışı iletişim bilgisi paylaşımı, resmi bir ders rezervasyonu olana kadar yasak. Lütfen yazışmaya ARMUS üzerinden devam et."
        ));
        return;
      }

      hideChatWarning();
      input.value = "";

      const result = await armusSendMessage(activeConversationId, body);

      if (result === "blocked") {
        input.value = body;
        showChatWarning(armusT(
          "messages.contactPolicyBlockedShort",
          "Bu mesaj gönderilemedi: telefon numarası, e-posta veya platform dışı iletişim bilgisi paylaşımı, resmi bir ders rezervasyonu olana kadar yasak."
        ));
      } else if (!result) {
        input.value = body;
        showChatWarning(armusT("messages.sendFailed", "Mesaj gönderilemedi. Lütfen tekrar dene."));
      } else {
        // appended right away instead of waiting on this same message
        // arriving back over the realtime channel - that echo still
        // comes and calls appendMessage again, but with the same id, so
        // the dedupe guard there skips it instead of a double bubble.
        appendMessage(result);
      }
    });

    // ---- photo/video attachments ----

    document.getElementById("attachBtn").addEventListener("click", () => {
      if (!activeConversationId) return;
      document.getElementById("attachInput").click();
    });

    document.getElementById("attachInput").addEventListener("change", async event => {

      const file = event.target.files[0];
      event.target.value = "";
      if (!file || !activeConversationId) return;

      // checked here, before ever attempting the upload, so an
      // unsupported format (e.g. an iPhone photo reported as image/heic)
      // gets a specific message instead of the same generic "couldn't
      // send" text a real network/storage failure would show
      if (!armusAttachmentTypeForFile(file)) {
        showChatWarning(armusT("messages.fileTypeUnsupported", "Bu dosya türü desteklenmiyor. JPEG, PNG, GIF, WEBP, MP4 ya da WEBM dene."));
        return;
      }

      const maxBytes = file.type.startsWith("video/") ? 25 * 1024 * 1024 : 8 * 1024 * 1024;
      if (file.size > maxBytes) {
        showChatWarning(armusT("messages.fileTooBig", "Dosya çok büyük (maks {mb}MB).").replace("{mb}", Math.round(maxBytes / 1024 / 1024)));
        return;
      }

      hideChatWarning();

      // captured now, not re-read after the upload awaits below - the
      // user could switch to a different conversation while a large
      // video is still uploading, and the attachment belongs with the
      // conversation it was picked for, not whichever one happens to be
      // open once the upload finishes.
      const conversationId = activeConversationId;
      const uploaded = await armusUploadChatAttachment(file, conversationId);

      if (!uploaded) {
        showChatWarning(armusT("messages.fileFailed", "Dosya gönderilemedi. Lütfen tekrar dene."));
        return;
      }

      const result = await armusSendMessage(conversationId, "", { attachmentUrl: uploaded.url, attachmentType: uploaded.type });
      if (!result || result === "blocked") {
        showChatWarning(armusT("messages.fileFailed", "Dosya gönderilemedi. Lütfen tekrar dene."));
        return;
      }
      if (activeConversationId === conversationId) appendMessage(result);
    });

    // ---- voice messages ----

    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingCancelled = false;
    let recordingTimerInterval = null;
    let micRequestInFlight = false;

    // purely decorative - a staggered CSS animation per bar, not a real
    // live audio-level readout, same reasoning as the sent voice
    // message's own waveform (see buildVoiceWaveBars above).
    function buildRecordingWaveBars() {
      const wave = document.getElementById("recordingWave");
      let bars = "";
      for (let i = 0; i < 18; i++) {
        bars += `<span style="height:${6 + (i % 5) * 3}px; animation-delay:${(i % 6) * 0.1}s;"></span>`;
      }
      wave.innerHTML = bars;
    }

    document.getElementById("micBtn").addEventListener("click", async () => {

      if (!activeConversationId) return;

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      // guards the window between this click and getUserMedia()
      // resolving - mediaRecorder is still null here, so without this a
      // second click before the (often human-perceptible, especially on
      // a first-ever permission prompt) permission dialog resolves would
      // start a SECOND independent recording, silently overwriting the
      // shared mediaRecorder/recordingTimerInterval variables above and
      // orphaning the first one (its interval never cleared, its audio
      // never uploaded, its mic stream never explicitly released).
      if (micRequestInFlight) return;
      micRequestInFlight = true;

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        micRequestInFlight = false;
        showChatWarning(armusT("messages.micDenied", "Mikrofon erişimi alınamadı. Tarayıcı izinlerini kontrol et."));
        return;
      }
      micRequestInFlight = false;

      hideChatWarning();
      recordedChunks = [];
      recordingCancelled = false;
      mediaRecorder = new MediaRecorder(stream);

      // captured now, at the moment recording STARTS, not re-read from
      // the shared activeConversationId once onstop runs - a recording
      // can run for up to two minutes, long enough for the user to open
      // a different conversation before it finishes, and the voice
      // message belongs with the conversation it was recorded for.
      const conversationIdAtStart = activeConversationId;

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) recordedChunks.push(event.data);
      };

      mediaRecorder.onstop = async () => {

        stream.getTracks().forEach(track => track.stop());
        clearInterval(recordingTimerInterval);
        document.getElementById("recordingIndicator").style.display = "none";
        document.getElementById("threadForm").style.display = "flex";

        const wasCancelled = recordingCancelled;
        recordingCancelled = false;
        if (wasCancelled) return;

        if (recordedChunks.length === 0) {
          showChatWarning(armusT("messages.recordingTooShort", "Kayıt çok kısaydı, tekrar dene."));
          return;
        }

        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        if (blob.size > 15 * 1024 * 1024) {
          showChatWarning(armusT("messages.recordingTooBig", "Ses kaydı çok büyük, daha kısa bir kayıt dene."));
          return;
        }

        const file = new File([blob], "voice-message.webm", { type: "audio/webm" });
        const uploaded = await armusUploadChatAttachment(file, conversationIdAtStart);

        if (!uploaded) {
          showChatWarning(armusT("messages.voiceFailed", "Ses mesajı gönderilemedi. Lütfen tekrar dene."));
          return;
        }

        const result = await armusSendMessage(conversationIdAtStart, "", { attachmentUrl: uploaded.url, attachmentType: uploaded.type });
        if (!result || result === "blocked") {
          showChatWarning(armusT("messages.voiceFailed", "Ses mesajı gönderilemedi. Lütfen tekrar dene."));
          return;
        }

        // appended right away instead of waiting on this same message
        // arriving back over the realtime channel - see appendMessage's
        // dedupe guard for why that echo is safe to just ignore.
        if (activeConversationId === conversationIdAtStart) appendMessage(result);
      };

      mediaRecorder.start();
      document.getElementById("threadForm").style.display = "none";
      buildRecordingWaveBars();
      const indicator = document.getElementById("recordingIndicator");
      indicator.style.display = "flex";

      const recordingStartedAt = Date.now();
      const MAX_RECORDING_SECONDS = 120;

      recordingTimerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - recordingStartedAt) / 1000);
        document.getElementById("recordingTimer").textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
        if (secs >= MAX_RECORDING_SECONDS) mediaRecorder.stop();
      }, 300);
    });

    document.getElementById("cancelRecordingBtn").addEventListener("click", () => {
      if (!mediaRecorder) return;
      recordingCancelled = true;
      mediaRecorder.stop();
    });

    document.getElementById("sendRecordingBtn").addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    });

    (async function() {

      // caught so a slow/blocked Supabase SDK still reaches the static
      // login gate below instead of leaving pageRoot's default state on screen
      currentSession = await armusGetSession().catch(() => null);

      if (!currentSession) {
        gate.style.display = "block";
        return;
      }

      pageRoot.style.display = "block";

      const params = new URLSearchParams(window.location.search);
      const teacherParam = params.get("teacher");

      const conversations = await refreshConvoList(null);

      if (teacherParam) {
        const convo = await armusGetOrCreateConversation(teacherParam);
        if (convo) {
          const fresh = await refreshConvoList(convo.id);
          const match = fresh.find(c => c.id === convo.id);
          if (match) await openConversation(match.id, match.otherName, match.otherPhoto, match.otherId);
        }
      } else if (conversations.length > 0) {
        await openConversation(conversations[0].id, conversations[0].otherName, conversations[0].otherPhoto, conversations[0].otherId);
      }

    })();

    // Re-render already-drawn text (convo list previews, message
    // timestamps/edited tags, empty states) when the language toggle
    // changes - armusApplyTranslations() alone can't reach it, since none
    // of this is built from static data-i18n elements.
    document.addEventListener("armus:langchange", async () => {
      if (!currentSession) return;
      await refreshConvoList(activeConversationId);
      if (activeConversationId) await loadThread(activeConversationId);
    });

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
