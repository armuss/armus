<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mesajlar | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: #f4f4f2;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
      font-weight: 700;
    }

    .nav-greeting {
      font-size: 13px;
      color: #c7c7c7;
      margin-right: 4px;
    }

    .nav-greeting small {
      color: #8f8f8f;
    }

    /* GATE */

    .gate {
      display: none;
      padding: 100px 0;
      text-align: center;
    }

    .gate h1 {
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .gate p {
      color: #99999c;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .gate-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* PAGE */

    main.container {
      padding: 30px 0 40px;
      display: none;
    }

    h1 {
      font-size: clamp(24px, 4vw, 30px);
      letter-spacing: -1px;
      margin-bottom: 22px;
    }

    .chat-shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      border: 1px solid var(--armus-border);
      border-radius: 20px;
      background: var(--armus-panel);
      overflow: hidden;
      height: 65vh;
      min-height: 480px;
    }

    /* CONVERSATION LIST */

    .convo-list {
      border-right: 1px solid var(--armus-border-soft);
      overflow-y: auto;
    }

    .convo-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--armus-border-soft);
    }

    .convo-item:hover,
    .convo-item.active {
      background: var(--armus-panel-2);
    }

    .convo-avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .convo-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .convo-info {
      min-width: 0;
      flex: 1;
    }

    .convo-name {
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .convo-preview {
      color: #8e8e91;
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--armus-gold-2);
      flex-shrink: 0;
    }

    .convo-empty {
      padding: 30px 18px;
      color: #77777b;
      font-size: 13px;
      text-align: center;
    }

    /* THREAD */

    .thread {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .thread-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--armus-border-soft);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thread-header a {
      color: var(--armus-gold-text);
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }

    .thread-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thread-placeholder {
      margin: auto;
      color: #77777b;
      font-size: 13px;
      text-align: center;
      max-width: 260px;
    }

    .msg-row {
      display: flex;
    }

    .msg-row.mine {
      justify-content: flex-end;
    }

    .msg-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border-soft);
    }

    .msg-row.mine .msg-bubble {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
    }

    .msg-time {
      display: block;
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.65;
    }

    .thread-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .thread-input textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 100px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 14px;
      color: white;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
    }

    .thread-input button {
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      .chat-shell {
        grid-template-columns: 1fr;
        height: auto;
      }

      .convo-list {
        border-right: none;
        border-bottom: 1px solid var(--armus-border-soft);
        max-height: 220px;
      }

      .thread {
        height: 60vh;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">ARMUS</a>
      <div class="nav-buttons" id="navAuthButtons"></div>
    </div>
  </nav>

  <div class="container">
    <div class="gate" id="gate">
      <h1>Mesajlarını görmek için giriş yap</h1>
      <p>Öğretmenlerinle veya öğrencilerinle yazışabilmek için önce bir hesabın olması gerekiyor.</p>
      <div class="gate-actions">
        <a class="btn" href="login.html?next=mesajlar.html">Giriş Yap</a>
        <a class="btn btn-light" href="register.html?next=mesajlar.html">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <main class="container" id="pageRoot">

    <h1>Mesajlar</h1>

    <div class="chat-shell">
      <div class="convo-list" id="convoList"></div>

      <div class="thread">
        <div class="thread-header" id="threadHeader" style="display: none;"></div>
        <div class="thread-body" id="threadBody">
          <div class="thread-placeholder">Yazışmalarını görmek için soldan bir kişi seç.</div>
        </div>
        <form class="thread-input" id="threadForm" style="display: none;">
          <textarea id="messageInput" placeholder="Bir mesaj yaz..." required></textarea>
          <button type="submit">Gönder</button>
        </form>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="site-settings.js"></script>
  <script src="auth.js"></script>
  <script src="messages.js"></script>
  <script>

    const gate = document.getElementById("gate");
    const pageRoot = document.getElementById("pageRoot");

    let currentSession = null;
    let currentChannel = null;
    let activeConversationId = null;

    function initials(name) {
      return name.split(" ").map(p => p[0]).filter(Boolean).slice(0, 2).join("").toUpperCase();
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function renderConvoList(conversations, activeId) {

      const list = document.getElementById("convoList");

      if (conversations.length === 0) {
        list.innerHTML = '<div class="convo-empty">Henüz bir yazışman yok. Bir öğretmenin profilinden "Mesaj Gönder" ile başlayabilirsin.</div>';
        return;
      }

      list.innerHTML = "";

      conversations.forEach(c => {

        const item = document.createElement("div");
        item.className = "convo-item" + (c.id === activeId ? " active" : "");
        const avatarInner = c.otherPhoto
          ? `<img src="${c.otherPhoto}" alt="">`
          : initials(c.otherName);

        item.innerHTML = `
          <div class="convo-avatar">${avatarInner}</div>
          <div class="convo-info">
            <div class="convo-name">${c.otherName}${c.unreadCount > 0 ? '<span class="unread-dot"></span>' : ""}</div>
            <div class="convo-preview">${c.lastMessage ? c.lastMessage.body : "Henüz mesaj yok"}</div>
          </div>
        `;

        item.addEventListener("click", () => openConversation(c.id, c.otherName, c.otherPhoto));
        list.appendChild(item);
      });
    }

    async function openConversation(conversationId, otherName, otherPhoto) {

      activeConversationId = conversationId;

      const header = document.getElementById("threadHeader");
      header.style.display = "flex";
      const avatarInner = otherPhoto ? `<img src="${otherPhoto}" alt="" style="width:28px;height:28px;border-radius:8px;object-fit:cover;">` : "";
      header.innerHTML = `${avatarInner}<span>${otherName}</span>`;

      document.getElementById("threadForm").style.display = "flex";

      await loadThread(conversationId);

      if (currentChannel) armusSupabase.removeChannel(currentChannel);
      currentChannel = armusSubscribeToMessages(conversationId, message => {
        appendMessage(message);
        if (message.sender_id !== currentSession.id) {
          armusMarkMessagesRead(conversationId, currentSession.id);
        }
      });

      await armusMarkMessagesRead(conversationId, currentSession.id);
      await refreshConvoList(conversationId);
    }

    function appendMessage(message) {

      const body = document.getElementById("threadBody");
      const placeholder = body.querySelector(".thread-placeholder");
      if (placeholder) placeholder.remove();

      const isMine = message.sender_id === currentSession.id;
      const row = document.createElement("div");
      row.className = "msg-row" + (isMine ? " mine" : "");
      row.innerHTML = `
        <div class="msg-bubble">
          ${message.body}
          <span class="msg-time">${formatTime(message.created_at)}</span>
        </div>
      `;
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    async function loadThread(conversationId) {

      const body = document.getElementById("threadBody");
      body.innerHTML = "";

      const messages = await armusGetMessages(conversationId);

      if (messages.length === 0) {
        body.innerHTML = '<div class="thread-placeholder">Henüz mesaj yok, ilk mesajı sen gönder.</div>';
        return;
      }

      messages.forEach(appendMessage);
    }

    async function refreshConvoList(activeId) {
      const conversations = await armusGetConversations();
      renderConvoList(conversations, activeId);
      return conversations;
    }

    document.getElementById("threadForm").addEventListener("submit", async event => {

      event.preventDefault();
      if (!activeConversationId) return;

      const input = document.getElementById("messageInput");
      const body = input.value.trim();
      if (!body) return;

      input.value = "";
      await armusSendMessage(activeConversationId, body);
    });

    (async function() {

      currentSession = await armusGetSession();

      if (!currentSession) {
        gate.style.display = "block";
        return;
      }

      pageRoot.style.display = "block";

      const params = new URLSearchParams(window.location.search);
      const teacherParam = params.get("teacher");

      const conversations = await refreshConvoList(null);

      if (teacherParam) {
        const convo = await armusGetOrCreateConversation(teacherParam);
        if (convo) {
          const fresh = await refreshConvoList(convo.id);
          const match = fresh.find(c => c.id === convo.id);
          if (match) await openConversation(match.id, match.otherName, match.otherPhoto);
        }
      } else if (conversations.length > 0) {
        await openConversation(conversations[0].id, conversations[0].otherName, conversations[0].otherPhoto);
      }

    })();

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
