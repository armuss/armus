<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Girişi | ARMUS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, "Segoe UI", Inter, sans-serif;
      background: #0b0c0f;
      color: #e8e8ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: min(360px, 100%);
      background: #16171c;
      border: 1px solid #24252b;
      border-radius: 16px;
      padding: 32px;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #8f95ff;
      background: rgba(143, 149, 255, 0.12);
      border: 1px solid rgba(143, 149, 255, 0.3);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 22px;
      letter-spacing: -0.3px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #9a9aa2;
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      background: #0f1014;
      border: 1px solid #2a2b32;
      border-radius: 10px;
      padding: 12px 13px;
      color: #e8e8ea;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #8f95ff;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #8f95ff;
      color: #10111a;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }

    .error {
      display: none;
      background: rgba(220, 90, 90, 0.1);
      border: 1px solid rgba(220, 90, 90, 0.35);
      color: #f0b5b5;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="tag">ARMUS ADMIN</div>
    <h1>Yönetim paneline giriş</h1>

    <div class="error" id="formError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-posta</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Giriş Yap</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("formError");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async event => {

      event.preventDefault();
      errorBox.style.display = "none";

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      const { error } = await armusSignIn({ email, password });

      if (error) {
        showError("E-posta veya şifre hatalı.");
        return;
      }

      const session = await armusGetSession();

      if (!session || !session.is_admin) {
        await armusSignOut();
        showError("Bu hesabın admin yetkisi yok.");
        return;
      }

      window.location.href = "admin.html";
    });

  </script>

</body>
</html>
