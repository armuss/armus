<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kayıt Ol | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(440px, calc(100% - 40px));
      margin: auto;
    }

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(440px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .back {
      color: var(--armus-muted);
      font-size: 13px;
    }

    .back:hover {
      color: var(--armus-ink);
    }

    main.container {
      padding: 55px 0 90px;
    }

    .eyebrow {
      color: var(--armus-muted);
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      letter-spacing: -1.2px;
      text-align: center;
      margin-bottom: 30px;
    }

    /* ROLE TOGGLE */

    .role-note {
      color: var(--armus-gold-text);
      font-size: 13px;
      font-weight: 600;
      margin: -6px 0 22px;
    }

    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 14px;
      padding: 6px;
      margin-bottom: 26px;
    }

    .role-option {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--armus-muted);
      cursor: pointer;
      transition: .15s;
    }

    .role-option.active {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
    }

    /* FORM */

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--armus-muted);
      margin-bottom: 7px;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--armus-gold-2);
    }

    .form-error {
      display: none;
      background: rgba(220, 90, 90, .1);
      border: 1px solid rgba(220, 90, 90, .35);
      color: #b3261e;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .form-success {
      display: none;
      background: rgba(143, 214, 174, .1);
      border: 1px solid rgba(143, 214, 174, .35);
      color: #1f7a4d;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .switch-note {
      text-align: center;
      color: var(--armus-muted);
      font-size: 13px;
      margin-top: 22px;
    }

    .switch-note a {
      color: var(--armus-gold-text);
      font-weight: 600;
    }

    .small-note {
      text-align: center;
      color: var(--armus-faint);
      font-size: 10px;
      margin-top: 20px;
    }

    .verify-note {
      text-align: center;
      color: var(--armus-muted);
      font-size: 13px;
      margin: -16px 0 26px;
      line-height: 1.6;
    }

    #verifyCode {
      text-align: center;
      font-size: 22px;
      letter-spacing: 8px;
      font-weight: 700;
    }

    #resendCodeLink.disabled {
      pointer-events: none;
      color: var(--armus-faint);
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">ARMUS</a>
      <a href="index.html" class="back">← Ana sayfa</a>
    </div>
  </nav>

  <main class="container">

    <div id="registerStep">

    <div class="eyebrow">ARMUS'A KATIL</div>
    <h1>Hesap oluştur</h1>

    <p class="role-note" id="roleNote"></p>

    <div class="role-toggle" id="roleToggle" style="display:none">
      <div class="role-option active" data-role="student">Öğrenci olarak</div>
      <div class="role-option" data-role="teacher">Öğretmen olarak</div>
    </div>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <form id="registerForm" novalidate>

      <div class="field">
        <label for="name">Ad Soyad</label>
        <input type="text" id="name" autocomplete="name" placeholder="Adın Soyadın">
      </div>

      <div class="field">
        <label for="email">E-posta</label>
        <input type="email" id="email" autocomplete="email" placeholder="ornek@eposta.com">
      </div>

      <div class="field">
        <label for="city">Şehir <small style="color:var(--armus-muted);font-weight:400;">(opsiyonel)</small></label>
        <select id="city">
          <option value="">Seçmek istemiyorum</option>
          <option>Adana</option><option>Adıyaman</option><option>Afyonkarahisar</option><option>Ağrı</option>
          <option>Aksaray</option><option>Amasya</option><option>Ankara</option><option>Antalya</option>
          <option>Ardahan</option><option>Artvin</option><option>Aydın</option><option>Balıkesir</option>
          <option>Bartın</option><option>Batman</option><option>Bayburt</option><option>Bilecik</option>
          <option>Bingöl</option><option>Bitlis</option><option>Bolu</option><option>Burdur</option>
          <option>Bursa</option><option>Çanakkale</option><option>Çankırı</option><option>Çorum</option>
          <option>Denizli</option><option>Diyarbakır</option><option>Düzce</option><option>Edirne</option>
          <option>Elazığ</option><option>Erzincan</option><option>Erzurum</option><option>Eskişehir</option>
          <option>Gaziantep</option><option>Giresun</option><option>Gümüşhane</option><option>Hakkâri</option>
          <option>Hatay</option><option>Iğdır</option><option>Isparta</option><option>İstanbul</option>
          <option>İzmir</option><option>Kahramanmaraş</option><option>Karabük</option><option>Karaman</option>
          <option>Kars</option><option>Kastamonu</option><option>Kayseri</option><option>Kırıkkale</option>
          <option>Kırklareli</option><option>Kırşehir</option><option>Kilis</option><option>Kocaeli</option>
          <option>Konya</option><option>Kütahya</option><option>Malatya</option><option>Manisa</option>
          <option>Mardin</option><option>Mersin</option><option>Muğla</option><option>Muş</option>
          <option>Nevşehir</option><option>Niğde</option><option>Ordu</option><option>Osmaniye</option>
          <option>Rize</option><option>Sakarya</option><option>Samsun</option><option>Siirt</option>
          <option>Sinop</option><option>Sivas</option><option>Şanlıurfa</option><option>Şırnak</option>
          <option>Tekirdağ</option><option>Tokat</option><option>Trabzon</option><option>Tunceli</option>
          <option>Uşak</option><option>Van</option><option>Yalova</option><option>Yozgat</option>
          <option>Zonguldak</option><option>Yurt dışı</option>
        </select>
      </div>

      <div class="field">
        <label for="password">Şifre</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="En az 6 karakter">
      </div>

      <div class="field">
        <label for="password2">Şifre (tekrar)</label>
        <input type="password" id="password2" autocomplete="new-password" placeholder="Şifreni tekrar yaz">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Hesap Oluştur</button>

    </form>

    <div class="switch-note">
      Zaten hesabın var mı? <a href="login.html" id="switchToLogin">Giriş yap</a>
    </div>

    <div class="small-note">
      Bu bir prototip; hesaplar sadece bu tarayıcıda saklanır.
    </div>

    </div>

    <!-- VERIFY -->
    <div id="verifyStep" style="display: none;">

      <div class="eyebrow">SON ADIM</div>
      <h1>E-postanı doğrula</h1>
      <p class="verify-note" id="verifyNote"></p>

      <div class="form-error" id="verifyError"></div>

      <form id="verifyForm" novalidate>
        <div class="field">
          <label for="verifyCode">Doğrulama kodu</label>
          <input type="text" id="verifyCode" inputmode="numeric" maxlength="6" placeholder="6 haneli kod" autocomplete="one-time-code">
        </div>
        <button type="submit" class="submit-btn" id="verifySubmitBtn">Doğrula</button>
      </form>

      <div class="switch-note">
        Kod gelmedi mi? <a href="#" id="resendCodeLink">Kodu tekrar gönder</a>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>

  <script src="supabase-config.js"></script>
  <script src="site-settings.js"></script>

  <script src="auth.js"></script>
  <script>

    const searchParams = new URLSearchParams(window.location.search);
    const requestedRole = searchParams.get("role");
    const nextParam = searchParams.get("next");

    // Role is decided by how the visitor got here (the general "Kayıt Ol"
    // link vs. an "Öğretmen Ol" link with ?role=teacher) - not a toggle on
    // this page, so there's no accidental student/teacher mix-up.
    const selectedRole = requestedRole === "teacher" ? "teacher" : "student";
    document.getElementById("roleNote").textContent = selectedRole === "teacher"
      ? "Öğretmen olarak kayıt oluyorsun."
      : "Öğrenci olarak kayıt oluyorsun.";

    if (nextParam) {
      document.getElementById("switchToLogin").href =
        `login.html?next=${encodeURIComponent(nextParam)}`;
    }

    const form = document.getElementById("registerForm");
    const errorBox = document.getElementById("formError");
    const successBox = document.getElementById("formSuccess");
    const submitBtn = document.getElementById("submitBtn");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async event => {

      event.preventDefault();
      errorBox.style.display = "none";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const city = document.getElementById("city").value;
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!name) {
        showError("Lütfen adını soyadını yaz.");
        return;
      }

      if (!emailPattern.test(email)) {
        showError("Geçerli bir e-posta adresi gir.");
        return;
      }

      if (password.length < 6) {
        showError("Şifre en az 6 karakter olmalı.");
        return;
      }

      if (password !== password2) {
        showError("Şifreler birbiriyle eşleşmiyor.");
        return;
      }

      submitBtn.disabled = true;
      const { data, error } = await armusSignUp({ name, email, password, role: selectedRole, city });
      submitBtn.disabled = false;

      if (error) {
        showError(
          error.message.includes("already registered") || error.message.includes("already been registered")
            ? "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene."
            : "Hesap oluşturulamadı: " + error.message
        );
        return;
      }

      // Supabase projects that have "Confirm email" turned on don't return
      // a session here - the account exists but isn't logged in yet until
      // the confirmation link is clicked. Redirecting as if logged in
      // would just bounce them back out, so show a clear next step instead.
      if (!data || !data.session) {
        form.style.display = "none";
        successBox.innerHTML = "Hesabın oluşturuldu! <strong>" + email + "</strong> adresine gönderdiğimiz onay bağlantısına tıklayıp giriş yapabilirsin.";
        successBox.style.display = "block";
        return;
      }

      startVerification(email);
    });

    // ---- email verification (6-digit code via send-verification-email /
    // verify-email-code Edge Functions) ----

    const verifyStep = document.getElementById("verifyStep");
    const verifyNote = document.getElementById("verifyNote");
    const verifyError = document.getElementById("verifyError");
    const verifyForm = document.getElementById("verifyForm");
    const verifySubmitBtn = document.getElementById("verifySubmitBtn");
    const resendCodeLink = document.getElementById("resendCodeLink");

    function proceedAfterVerification() {
      if (selectedRole === "teacher") {
        window.location.href = "apply-teacher.html";
      } else {
        window.location.href = nextParam || "student-dashboard.html";
      }
    }

    function startResendCooldown() {
      let secondsLeft = 45;
      resendCodeLink.classList.add("disabled");
      const original = "Kodu tekrar gönder";
      const tick = () => {
        if (secondsLeft <= 0) {
          resendCodeLink.textContent = original;
          resendCodeLink.classList.remove("disabled");
          return;
        }
        resendCodeLink.textContent = `Kodu tekrar gönder (${secondsLeft})`;
        secondsLeft -= 1;
        setTimeout(tick, 1000);
      };
      tick();
    }

    async function startVerification(email) {

      document.getElementById("registerStep").style.display = "none";
      verifyNote.textContent = `${email} adresine 6 haneli bir kod gönderdik. Kodu aşağıya gir.`;
      verifyStep.style.display = "block";

      const { error } = await armusSupabase.functions.invoke("send-verification-email");
      if (error) {
        verifyError.textContent = "Kod gönderilemedi. 'Kodu tekrar gönder' ile tekrar dene.";
        verifyError.style.display = "block";
      } else {
        startResendCooldown();
      }
    }

    verifyForm.addEventListener("submit", async event => {

      event.preventDefault();
      verifyError.style.display = "none";

      const code = document.getElementById("verifyCode").value.trim();
      if (!code) return;

      verifySubmitBtn.disabled = true;
      const { data, error } = await armusSupabase.functions.invoke("verify-email-code", { body: { code } });
      verifySubmitBtn.disabled = false;

      if (error || !data || !data.ok) {
        verifyError.textContent = (data && data.error) || "Kod doğrulanamadı. Tekrar dene.";
        verifyError.style.display = "block";
        return;
      }

      proceedAfterVerification();
    });

    resendCodeLink.addEventListener("click", async event => {

      event.preventDefault();
      if (resendCodeLink.classList.contains("disabled")) return;

      verifyError.style.display = "none";
      startResendCooldown();

      const { error, data } = await armusSupabase.functions.invoke("send-verification-email");
      if (error || (data && data.error)) {
        verifyError.textContent = (data && data.error) || "Kod gönderilemedi.";
        verifyError.style.display = "block";
      }
    });

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
