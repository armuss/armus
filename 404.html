<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sayfa Bulunamadı | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(440px, calc(100% - 40px));
      margin: auto;
    }

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-inner {
      width: min(440px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .back {
      color: var(--armus-muted);
      font-size: 13px;
    }

    .back:hover {
      color: var(--armus-ink);
    }

    main.container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 0;
    }

    .code {
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 96px;
      letter-spacing: -3px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }

    h1 {
      font-size: 22px;
      letter-spacing: -0.6px;
      margin: 18px 0 10px;
    }

    p {
      color: var(--armus-muted);
      font-size: 14px;
      margin-bottom: 30px;
      max-width: 360px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-dark {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
    }

    .btn-light {
      border: 1px solid var(--armus-border);
      color: var(--armus-ink);
    }

    .nav-utility {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-toggle {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: var(--armus-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 12.5px Inter, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--armus-border);
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .help-btn:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn svg {
      width: 17px;
      height: 17px;
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
      <div class="nav-utility">
        <button type="button" class="lang-toggle" data-lang-toggle title="Dili değiştir / Change language">EN</button>
        <a class="help-btn" href="sss.html" title="Yardım Merkezi" aria-label="Yardım Merkezi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="code">404</div>
    <h1 data-i18n="notFound.title">Bu sayfayı bulamadık</h1>
    <p data-i18n="notFound.text">Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya dönüp oradan devam edebilirsin.</p>
    <div class="actions">
      <a class="btn btn-dark" href="index.html" data-i18n="notFound.home">Ana Sayfaya Dön</a>
      <a class="btn btn-light" href="teachers.html" data-i18n="notFound.teachers">Öğretmenleri Gör</a>
    </div>
  </main>

  <script src="i18n.js"></script>
</body>
</html>
