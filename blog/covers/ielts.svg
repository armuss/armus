<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee06d"/>
      <stop offset="55%" stop-color="#f6c649"/>
      <stop offset="100%" stop-color="#dfac2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="#0b0b0b"/>
  <!-- the four skills: listening, reading, writing, speaking -->
  <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- headphones -->
    <g transform="translate(250 250)">
      <path d="M-58 22 v-20 a58 58 0 0 1 116 0 v20"/>
      <rect x="-70" y="14" width="30" height="50" rx="10"/>
      <rect x="40" y="14" width="30" height="50" rx="10"/>
    </g>
    <!-- open book -->
    <g transform="translate(480 250)">
      <path d="M0 -40 C -30 -58 -60 -58 -80 -50 V 50 C -60 42 -30 42 0 60 C 30 42 60 42 80 50 V -50 C 60 -58 30 -58 0 -40 Z"/>
      <path d="M0 -40 V 60"/>
    </g>
    <!-- pen -->
    <g transform="translate(720 250) rotate(40)">
      <rect x="-18" y="-80" width="36" height="130" rx="8"/>
      <path d="M-18 50 L0 86 L18 50"/>
    </g>
    <!-- speech bubble -->
    <g transform="translate(950 245)">
      <path d="M-72 -50 h144 a16 16 0 0 1 16 16 v70 a16 16 0 0 1 -16 16 h-84 l-34 30 v-30 h-26 a16 16 0 0 1 -16 -16 v-70 a16 16 0 0 1 16 -16 z"/>
    </g>
  </g>
  <g fill="#f4f4f2" opacity="0.5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle">
    <text x="250" y="385">LISTENING</text>
    <text x="480" y="385">READING</text>
    <text x="720" y="385">WRITING</text>
    <text x="950" y="385">SPEAKING</text>
  </g>
</svg>
