<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>ARMUS - Depolama Testi</title>
<meta name="robots" content="noindex" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 20px; }
  .box { background: #f4f4f4; border-radius: 8px; padding: 16px; margin: 16px 0; white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 13px; }
  .ok { color: #0a7d2f; font-weight: bold; }
  .bad { color: #c00; font-weight: bold; }
  button { font-size: 15px; padding: 10px 18px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<h1>ARMUS - Depolama Testi (geçici teşhis sayfası)</h1>
<p>Bu sayfa sadece sorunu bulmak için var, siteye bağlı değil. Önce normal siteden giriş yap, sonra bu sayfayı aç.</p>

<div id="sessionBox" class="box">Kontrol ediliyor...</div>

<button id="testBtn" disabled>Yükleme Testi Yap</button>

<div id="resultBox" class="box" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
  function decodeJwt(token) {
    try {
      const payload = token.split(".")[1];
      const json = atob(payload.replace(/-/g, "+").replace(/_/g, "/"));
      return JSON.parse(json);
    } catch (e) {
      return null;
    }
  }

  (async () => {
    const sessionBox = document.getElementById("sessionBox");
    const testBtn = document.getElementById("testBtn");

    const { data, error } = await armusSupabase.auth.getSession();

    if (error || !data.session) {
      sessionBox.innerHTML = '<span class="bad">Giriş yapılmamış.</span>\nÖnce normal siteden (login.html) giriş yap, sonra bu sayfayı yeniden aç.';
      return;
    }

    const session = data.session;
    const claims = decodeJwt(session.access_token);

    sessionBox.innerHTML =
      '<span class="ok">Giriş yapılmış.</span>\n' +
      "user id: " + session.user.id + "\n" +
      "email: " + session.user.email + "\n" +
      "JWT role claim: " + (claims ? claims.role : "(okunamadı)") + "\n" +
      "JWT exp: " + (claims ? new Date(claims.exp * 1000).toLocaleString() : "(okunamadı)") + "\n" +
      "şimdi: " + new Date().toLocaleString();

    testBtn.disabled = false;

    async function runOneTest(upsert) {
      const path = session.user.id + "/debug-test-" + Date.now() + "-" + (upsert ? "upsert" : "plain") + ".txt";
      const blob = new Blob(["armus storage test"], { type: "text/plain" });

      const { error: uploadError } = await armusSupabase
        .storage.from("teacher-uploads")
        .upload(path, blob, { upsert, contentType: "text/plain" });

      const label = "upsert: " + upsert;

      if (uploadError) {
        return (
          '<span class="bad">BAŞARISIZ</span> (' + label + ")\n" +
          "path: " + path + "\n" +
          "error.message: " + uploadError.message + "\n" +
          "error (tam JSON):\n" + JSON.stringify(uploadError, Object.getOwnPropertyNames(uploadError), 2)
        );
      }

      const pub = armusSupabase.storage.from("teacher-uploads").getPublicUrl(path);
      return (
        '<span class="ok">BAŞARILI</span> (' + label + ")\n" +
        "path: " + path + "\n" +
        "public url: " + pub.data.publicUrl
      );
    }

    testBtn.addEventListener("click", async () => {
      testBtn.disabled = true;
      testBtn.textContent = "Test ediliyor...";
      const resultBox = document.getElementById("resultBox");
      resultBox.style.display = "block";
      resultBox.textContent = "Yükleniyor...";

      const [withUpsert, withoutUpsert] = await Promise.all([
        runOneTest(true),
        runOneTest(false),
      ]);

      resultBox.innerHTML = withUpsert + "\n\n----------\n\n" + withoutUpsert;

      testBtn.disabled = false;
      testBtn.textContent = "Yükleme Testi Yap";
    });
  })();
</script>

</body>
</html>
