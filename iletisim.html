<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>İletişim | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      line-height: 1.7;
    }

    a {
      color: var(--armus-gold-text);
      text-decoration: underline;
    }

    .container {
      width: min(720px, calc(100% - 40px));
      margin: auto;
    }

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(720px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }

    .back {
      color: var(--armus-muted);
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      color: var(--armus-ink);
    }

    main.container {
      padding: 50px 0 100px;
    }

    .eyebrow {
      color: var(--armus-muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 36px);
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .intro {
      color: var(--armus-muted);
      font-size: 14.5px;
      margin-bottom: 40px;
      max-width: 520px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 40px;
    }

    .contact-card {
      padding: 20px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 16px;
    }

    .contact-card .label {
      color: var(--armus-muted);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .contact-card .value {
      font-size: 15px;
      font-weight: 700;
    }

    .contact-card .value a {
      color: var(--armus-gold-text);
      text-decoration: none;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
    }

    label {
      font-size: 13px;
      color: var(--armus-muted);
      margin-bottom: -4px;
    }

    input, textarea {
      width: 100%;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13.5px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .submit-btn {
      align-self: flex-start;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      margin-top: 6px;
    }

    .form-error {
      display: none;
      background: rgba(220, 90, 90, .1);
      border: 1px solid rgba(220, 90, 90, .35);
      color: #b3261e;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12.5px;
      margin-top: 4px;
    }

    .sent-msg {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-silver-border);
      border-radius: 12px;
      color: var(--armus-ink);
      font-size: 13.5px;
      max-width: 480px;
    }

    @media (max-width: 560px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }
  
    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-utility {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-toggle {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: var(--armus-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 12.5px Inter, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--armus-border);
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .help-btn:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn svg {
      width: 17px;
      height: 17px;
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
      <div class="nav-right">
        <div class="nav-utility">
          <button type="button" class="lang-toggle" data-lang-toggle title="Dili değiştir / Change language">EN</button>
          <a class="help-btn" href="sss.html" title="Yardım Merkezi" aria-label="Yardım Merkezi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          </a>
        </div>
        <a href="index.html" class="back" data-i18n="nav.backHome">← Ana sayfa</a>
      </div>
    </div>
  </nav>

  <main class="container">

    <div class="eyebrow" data-i18n="contact.eyebrow">İLETİŞİM</div>
    <h1 data-i18n="contact.title">Bize ulaş</h1>
    <p class="intro" data-i18n="contact.intro">
      Sorun, önerin veya bir şikayetin mi var? Aşağıdaki bilgilerden veya
      formdan bize ulaşabilirsin, en kısa sürede dönüş yaparız.
    </p>

    <div class="contact-grid">
      <div class="contact-card">
        <div class="label" data-i18n="contact.emailLabel">E-posta</div>
        <div class="value"><a href="mailto:armus.support@gmail.com">armus.support@gmail.com</a></div>
      </div>
      <div class="contact-card">
        <div class="label" data-i18n="contact.hoursLabel">Destek saatleri</div>
        <div class="value" data-i18n="contact.hoursValue">Hafta içi 09:00 – 18:00</div>
      </div>
    </div>

    <form id="contactForm">
      <label for="name" data-i18n="contact.nameLabel">Ad Soyad</label>
      <input type="text" id="name" required>

      <label for="email" data-i18n="contact.emailFieldLabel">E-posta</label>
      <input type="email" id="email" required>

      <label for="message" data-i18n="contact.messageLabel">Mesajın</label>
      <textarea id="message" required></textarea>

      <button type="submit" class="submit-btn" id="contactSubmitBtn" data-i18n="contact.submit">Gönder</button>
      <div class="form-error" id="contactError"></div>
    </form>

    <div class="sent-msg" id="sentMsg" data-i18n="contact.sentMsg">
      Mesajın alındı, teşekkürler! En kısa sürede sana dönüş yapacağız.
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>

  <script>
    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("contactSubmitBtn");
      const errorBox = document.getElementById("contactError");
      errorBox.style.display = "none";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      btn.disabled = true;
      const originalLabel = btn.textContent;
      btn.textContent = "Gönderiliyor...";

      let data, error;
      try {
        ({ data, error } = await armusSupabase.functions.invoke("send-contact-email", {
          body: { name, email, message },
        }));
      } catch (err) {
        error = err;
      }

      btn.disabled = false;
      btn.textContent = originalLabel;

      if (error || !data || !data.ok) {
        errorBox.textContent = (data && data.error) || "Mesajın gönderilemedi. Lütfen tekrar dene.";
        errorBox.style.display = "block";
        return;
      }

      document.getElementById("sentMsg").style.display = "block";
      e.target.reset();
    });
  </script>

  <script src="i18n.js"></script>
</body>
</html>
