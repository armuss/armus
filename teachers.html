<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Öğretmenler | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css?v=4">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
    }

    /* NAVBAR */

    .navbar {
      padding-top: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-inner {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
      height: 68px;
      border: 1px solid var(--armus-border-soft);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 8px 30px rgba(35, 26, 10, 0.06);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      padding: 0 12px 0 18px;
    }
    /* .nav-links gets the auto margin (not justify-content:space-between
       on the row) so it self-centers while nav-utility/nav-buttons stay
       clustered flush against the right edge - matches index.html's nav. */
    .nav-links {
      margin: auto;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      color: var(--armus-muted);
      font-size: 14px;
    }

    .nav-links a:hover {
      color: var(--armus-ink);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: var(--armus-ink);
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-greeting {
      font-size: 13px;
      color: var(--armus-muted);
      margin-right: 4px;
    }

    .nav-greeting small {
      color: var(--armus-faint);
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
    }

    .nav-utility {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 14px;
    }

    .lang-toggle {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: var(--armus-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 12.5px Inter, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--armus-border);
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .help-btn:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn svg {
      width: 17px;
      height: 17px;
    }

    /* PAGE HEAD */

    .page-head {
      padding: 34px 0 22px;
    }

    .page-head h1 {
      font-size: clamp(24px, 3vw, 30px);
      letter-spacing: -1px;
    }

    .page-head p {
      margin-top: 8px;
      color: var(--armus-muted);
      font-size: 13.5px;
    }

    .loading-note {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 4px !important;
      color: var(--armus-muted) !important;
      font-size: 12px !important;
    }

    .loading-note.visible {
      display: flex;
    }

    .loading-note::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--armus-gold-text);
      animation: armus-pulse 1s ease-in-out infinite;
    }

    @keyframes armus-pulse {
      0%, 100% { opacity: .3; }
      50% { opacity: 1; }
    }

    /* SEARCH */

    /* TOP FILTER ROW 1 - Preply-style labeled boxes */

    .filter-box-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 12px;
      position: relative;
      z-index: 6;
    }

    .filter-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 14px;
      padding: 11px 16px;
      min-width: 0;
    }

    button.filter-box {
      width: 100%;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
    }

    button.filter-box:hover {
      border-color: var(--armus-silver-1);
    }

    .filter-box-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .filter-box-label {
      font-size: 11px;
      color: var(--armus-muted);
    }

    .filter-box-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--armus-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-box .chev {
      font-size: 10px;
      color: var(--armus-faint);
      flex-shrink: 0;
    }

    @media (max-width: 820px) {
      .filter-box-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .filter-box-row {
        grid-template-columns: 1fr;
      }
    }

    /* TOP FILTER ROW 2 - Preply-style dropdown pills + search, ARMUS theme */

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      position: relative;
      z-index: 5;
    }

    .filter-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 999px;
      padding: 9px 16px;
      flex: 1;
      min-width: 180px;
    }

    .filter-search .search-icon {
      font-size: 13px;
      opacity: .6;
      flex-shrink: 0;
    }

    .filter-search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
    }

    .filter-search input::placeholder {
      color: var(--armus-faint);
    }

    .filter-dropdown {
      position: relative;
    }

    .filter-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 999px;
      padding: 9px 15px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }

    .filter-pill:hover {
      border-color: var(--armus-silver-1);
    }

    .filter-pill.active-filter {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .filter-box.active-filter {
      border-color: var(--armus-gold-2);
    }

    .filter-box.active-filter .filter-box-value {
      color: var(--armus-gold-text);
    }

    .filter-pill .chev {
      font-size: 9px;
      opacity: 0.7;
    }

    .filter-panel {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 20;
      min-width: 220px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(35, 26, 10, .16);
    }

    .filter-dropdown.open .filter-panel {
      display: block;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 9px 0;
      font-size: 13px;
      color: var(--armus-ink);
      cursor: pointer;
    }

    .filter-option input {
      accent-color: var(--armus-gold-2);
    }

    .filter-price-value {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--armus-ink);
      margin-bottom: 16px;
    }

    .price-slider-wrap {
      position: relative;
      height: 26px;
    }

    .price-slider-wrap input[type="range"] {
      position: absolute;
      left: 0;
      top: 10px;
      width: 100%;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
    }

    .price-slider-wrap input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: var(--armus-border);
      border-radius: 2px;
    }

    .price-slider-wrap input[type="range"]::-moz-range-track {
      height: 4px;
      background: var(--armus-border);
      border-radius: 2px;
    }

    .price-slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      pointer-events: auto;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--armus-gold-gradient);
      cursor: pointer;
      margin-top: -6px;
    }

    .price-slider-wrap input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
      width: 15px;
      height: 15px;
      border: none;
      border-radius: 50%;
      background: var(--armus-gold-2);
      cursor: pointer;
    }

    .fav-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12.5px;
      color: var(--armus-ink);
      cursor: pointer;
    }

    .fav-toggle input {
      accent-color: var(--armus-gold-2);
    }

    .sort-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--armus-muted);
    }

    .sort-wrap select {
      background: var(--armus-panel);
      color: var(--armus-ink);
      border: 1px solid var(--armus-border);
      border-radius: 999px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
    }

    /* RESULTS */

    .results-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .results-count {
      color: var(--armus-muted);
      font-size: 13px;
    }

    /* OVERLAPPING TEACHER-CARD STACK
       first pass at a "nested cards that pull forward on hover" layout,
       replacing the old wide list row - kept as its own experiment so
       it's easy to revert to the list row if it doesn't work out. */

    .teachers {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 90px 0 70px;
    }

    .teacher-card {
      position: relative;
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(35, 26, 10, 0.1);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease;
    }

    /* the overlap only kicks in once a full page of cards is guaranteed
       to fit on one row - below that, wrapped rows would each carry the
       same negative margin on their own leading card (only the true
       first-child in the DOM gets it removed), cutting that card off at
       the page edge. 960px covers TEACHERS_PER_PAGE=5 cards at 220px
       wide with a 42px overlap (932px) plus some breathing room - if
       TEACHERS_PER_PAGE changes, this threshold should move with it. */
    @media (min-width: 960px) {
      .teachers {
        gap: 0;
        flex-wrap: nowrap;
      }

      .teacher-card {
        margin-left: -42px;
      }

      .teacher-card:first-child {
        margin-left: 0;
      }
    }

    .teacher-card:hover {
      transform: translateY(-16px) scale(1.06);
      box-shadow: 0 30px 65px rgba(35, 26, 10, 0.22);
      z-index: 20;
    }

    .avatar {
      position: relative;
      height: 205px;
      flex-shrink: 0;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: grid;
      place-items: end center;
      padding-bottom: 18px;
      font-weight: 800;
      font-size: 40px;
      overflow: hidden;
    }

    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .rating {
      position: absolute;
      right: 12px;
      top: 12px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-silver-border-strong);
      border-radius: 9px;
      padding: 5px 8px;
      font-size: 10px;
      color: var(--armus-gold-text);
    }

    .fav-btn {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 2;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--armus-silver-border-strong);
      border-radius: 50%;
      color: var(--armus-muted);
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
    }

    .fav-btn.active {
      color: var(--armus-gold-text);
    }

    .card-mid {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .teacher-name {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tags {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      font-size: 14px;
      font-weight: 700;
      color: var(--armus-ink);
    }

    .card-side {
      margin-top: 15px;
    }

    .price {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .price span {
      color: var(--armus-muted);
      font-size: 11px;
      font-weight: 400;
    }

    .trial {
      display: block;
      width: 100%;
      text-align: center;
      background: #0a0a0a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .teacher-card:hover .trial {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
    }

    /* PAGINATION */

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-bottom: 60px;
    }

    .page-arrow,
    .page-num {
      display: grid;
      place-items: center;
      min-width: 38px;
      height: 38px;
      padding: 0 6px;
      border-radius: 12px;
      border: 1px solid var(--armus-border);
      background: var(--armus-panel);
      color: var(--armus-ink);
      font: 600 13px Inter, sans-serif;
      cursor: pointer;
    }

    .page-arrow:hover,
    .page-num:hover {
      border-color: var(--armus-gold-2);
    }

    .page-num.active {
      background: var(--armus-gold-gradient);
      border-color: transparent;
      color: var(--armus-on-gold);
      cursor: default;
    }

    .page-arrow:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .page-ellipsis {
      color: var(--armus-faint);
      padding: 0 4px;
    }

    .empty {
      display: none;
      padding: 50px;
      text-align: center;
      color: var(--armus-muted);
      border: 1px dashed var(--armus-border);
      border-radius: 20px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .nav-links {
        display: none;
      }

      .sort-wrap {
        margin-left: 0;
        width: 100%;
      }

      .sort-wrap select {
        flex: 1;
      }
    }

    @media (max-width: 560px) {
      .nav-greeting {
        display: none;
      }

      .nav-buttons {
        gap: 6px;
      }

      .nav-buttons .btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .nav-utility {
        gap: 6px;
        margin-right: 8px;
      }

      .help-btn {
        display: none;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="nav-inner">

      <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>

      <nav class="nav-links">
        <a href="teachers.html" data-i18n="nav.teachers">Öğretmenler</a>
        <a href="index.html#how" data-i18n="nav.how">Nasıl Çalışır?</a>
        <a href="hakkimizda.html" data-i18n="nav.about">Hakkımızda</a>
      </nav>

      <div class="nav-utility">
        <button type="button" class="lang-toggle" data-lang-toggle title="Dili değiştir / Change language">EN</button>
        <a class="help-btn" href="sss.html" title="Yardım Merkezi" aria-label="Yardım Merkezi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </a>
      </div>

      <div class="nav-buttons" id="navAuthButtons">
        <a class="btn" href="login.html" data-i18n="nav.login">Giriş Yap</a>
        <a class="btn btn-light" href="register.html" data-i18n="nav.register">Kayıt Ol</a>
      </div>

    </div>
  </header>


  <main class="container">

    <div class="page-head">
      <h1 data-i18n="teachersPage.heading">Sana uygun İngilizce öğretmenini bul.</h1>
      <p id="resultsCount" data-i18n="teachersPage.resultsCountInitial">6 öğretmen bulundu</p>
      <p id="loadingNote" class="loading-note" data-i18n="teachersPage.loadingMore">Diğer öğretmenler yükleniyor…</p>
    </div>

    <div class="filter-box-row">

      <div class="filter-box filter-box-static">
        <span class="filter-box-text">
          <span class="filter-box-label" data-i18n="teachersPage.whatToLearn">Ne öğrenmek istiyorum</span>
          <span class="filter-box-value" data-i18n="teachersPage.english">İngilizce</span>
        </span>
      </div>

      <div class="filter-dropdown" data-dropdown="price">
        <button type="button" class="filter-trigger filter-box">
          <span class="filter-box-text">
            <span class="filter-box-label" data-i18n="teachersPage.lessonPrice">Ders ücreti</span>
            <span class="filter-box-value" id="priceRangeLabel"></span>
          </span>
          <span class="chev">▾</span>
        </button>
        <div class="filter-panel">
          <div class="filter-price-value" id="priceRangeValue"></div>
          <div class="price-slider-wrap">
            <input type="range" id="priceMin" min="0" max="1000" step="50" value="0">
            <input type="range" id="priceMax" min="0" max="1000" step="50" value="1000">
          </div>
        </div>
      </div>

      <div class="filter-dropdown" data-dropdown="level">
        <button type="button" class="filter-trigger filter-box">
          <span class="filter-box-text">
            <span class="filter-box-label" data-i18n="teachersPage.level">Seviye</span>
            <span class="filter-box-value" id="levelBoxValue" data-i18n="teachersPage.all">Tümü</span>
          </span>
          <span class="chev">▾</span>
        </button>
        <div class="filter-panel">
          <label class="filter-option"><input type="checkbox" value="Başlangıç" class="level-filter"> <span data-i18n="teachersPage.levelBeginner">Başlangıç</span></label>
          <label class="filter-option"><input type="checkbox" value="Orta" class="level-filter"> <span data-i18n="teachersPage.levelIntermediate">Orta</span></label>
          <label class="filter-option"><input type="checkbox" value="İleri" class="level-filter"> <span data-i18n="teachersPage.levelAdvanced">İleri</span></label>
        </div>
      </div>

      <div class="filter-dropdown" data-dropdown="lang">
        <button type="button" class="filter-trigger filter-box">
          <span class="filter-box-text">
            <span class="filter-box-label" data-i18n="teachersPage.languages">Diller</span>
            <span class="filter-box-value" id="langBoxValue" data-i18n="teachersPage.all">Tümü</span>
          </span>
          <span class="chev">▾</span>
        </button>
        <div class="filter-panel">
          <label class="filter-option"><input type="checkbox" value="İngilizce" class="lang-filter"> <span data-i18n="teachersPage.langEnglish">İngilizce</span></label>
          <label class="filter-option"><input type="checkbox" value="Türkçe" class="lang-filter"> <span data-i18n="teachersPage.langTurkish">Türkçe</span></label>
          <label class="filter-option"><input type="checkbox" value="Almanca" class="lang-filter"> <span data-i18n="teachersPage.langGerman">Almanca</span></label>
          <label class="filter-option"><input type="checkbox" value="Fransızca" class="lang-filter"> <span data-i18n="teachersPage.langFrench">Fransızca</span></label>
          <label class="filter-option"><input type="checkbox" value="İspanyolca" class="lang-filter"> <span data-i18n="teachersPage.langSpanish">İspanyolca</span></label>
        </div>
      </div>

    </div>

    <div class="filter-bar">

      <div class="filter-dropdown" data-dropdown="type">
        <button type="button" class="filter-trigger filter-pill"><span data-i18n="teachersPage.lessonType">Ders Türü</span> <span class="chev">▾</span></button>
        <div class="filter-panel">
          <label class="filter-option"><input type="checkbox" value="Konuşma" class="filter"> <span data-i18n="teachersPage.typeSpeaking">Konuşma</span></label>
          <label class="filter-option"><input type="checkbox" value="IELTS" class="filter"> IELTS</label>
          <label class="filter-option"><input type="checkbox" value="TOEFL" class="filter"> TOEFL</label>
          <label class="filter-option"><input type="checkbox" value="YDS" class="filter"> YDS</label>
          <label class="filter-option"><input type="checkbox" value="İş İngilizcesi" class="filter"> <span data-i18n="teachersPage.typeBusinessEnglish">İş İngilizcesi</span></label>
        </div>
      </div>

      <label class="fav-toggle">
        <input type="checkbox" id="favoritesOnlyFilter">
        ★ <span data-i18n="teachersPage.myFavorites">Favorilerim</span>
      </label>

      <div class="sort-wrap">
        <select id="sortSelect">
          <option value="default" data-i18n="teachersPage.sortRecommended">Önerilen</option>
          <option value="priceLow" data-i18n="teachersPage.sortPriceLow">En düşük fiyat</option>
          <option value="priceHigh" data-i18n="teachersPage.sortPriceHigh">En yüksek fiyat</option>
          <option value="rating" data-i18n="teachersPage.sortRating">En yüksek puan</option>
        </select>
      </div>

      <div class="filter-search">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="İsim, uzmanlık veya konu ara..."
          data-i18n-placeholder="teachersPage.searchPlaceholder"
        >
      </div>

    </div>


    <div class="teachers" id="teachersGrid"></div>

    <div class="pagination" id="pagination"></div>

    <div class="empty" id="emptyState" data-i18n="teachersPage.noResults">
      Aramana uygun öğretmen bulunamadı.
    </div>

  </main>


  <script src="i18n.js?v=6"></script>
  <script src="teachers-data.js?v=4"></script>
  <script src="favorites.js?v=4"></script>
  <script src="auth.js?v=5"></script>
  <script>

    // Everything in this block only needs teachers-data.js and favorites.js
    // (both local, no network), so it renders the demo teachers and makes
    // the whole grid (filters, sort, favorites) usable immediately - it
    // does not wait on the Supabase SDK below, which is a slow external
    // script fetch on a bad connection.

    const grid = document.getElementById("teachersGrid");

    // ---- dropdown filter pills open/close ----

    document.querySelectorAll(".filter-dropdown").forEach(dropdown => {
      const trigger = dropdown.querySelector(".filter-trigger");
      trigger.addEventListener("click", event => {
        event.stopPropagation();
        const wasOpen = dropdown.classList.contains("open");
        document.querySelectorAll(".filter-dropdown.open").forEach(d => d.classList.remove("open"));
        if (!wasOpen) dropdown.classList.add("open");
      });
    });

    document.addEventListener("click", () => {
      document.querySelectorAll(".filter-dropdown.open").forEach(d => d.classList.remove("open"));
    });

    document.querySelectorAll(".filter-panel").forEach(panel => {
      panel.addEventListener("click", event => event.stopPropagation());
    });

    function renderTeacherCard(teacher) {

      const teacherLink = `teacher.html?teacher=${encodeURIComponent(teacher.id)}`;
      const bookingLink = `booking.html?teacher=${encodeURIComponent(teacher.id)}&type=trial`;
      const ratingLabel = teacher.rating ? `★ ${teacher.rating}` : armusT("teacherProfile.newTeacher", "Yeni");
      const avatarInner = armusSafeUrl(teacher.photo)
        ? `<img src="${armusSafeUrl(teacher.photo)}" alt="">`
        : armusEscapeHtml(teacher.initials);

      const article = document.createElement("article");
      article.className = "teacher-card";
      article.dataset.teacherId = teacher.id;

      article.innerHTML = `
        <button type="button" class="fav-btn" data-fav="${teacher.id}" aria-label="${armusT("teacherProfile.addToFavorites", "Favorilere ekle")}">♥</button>
        <div class="avatar">${avatarInner}</div>
        <div class="rating">${ratingLabel}</div>

        <div class="card-mid">
          <a href="${teacherLink}" class="teacher-name">${armusEscapeHtml(armusShortDisplayName(teacher.name))}</a>
          <div class="tags">
            <span class="tag">${armusEscapeHtml(teacher.completedLessons)} ${armusT("teacherProfile.lessonsWord", "ders")}</span>
            <span class="tag">${armusT("teacherProfile.studentsCount", "{n} öğrenci").replace("{n}", teacher.students)}</span>
          </div>
          <div class="card-side">
            <span class="price">₺${teacher.price} <span>${armusT("teachersPage.perLesson", "/ ders")}</span></span>
            <a class="trial" href="${bookingLink}">${armusT("teacherProfile.trialLessonBtn", "Deneme Dersi Al")}</a>
          </div>
        </div>
      `;

      const btn = article.querySelector(".fav-btn");
      btn.classList.toggle("active", armusIsFavorite(btn.dataset.fav));
      btn.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        const nowFavorited = armusToggleFavorite(btn.dataset.fav);
        btn.classList.toggle("active", nowFavorited);
        if (favoritesOnlyFilter.checked) updateTeachers();
      });

      // the whole card opens the teacher's profile now (matching the
      // hover-lift feel of "this whole thing is clickable") - except its
      // own interactive bits, which keep their own actions
      article.addEventListener("click", event => {
        if (event.target.closest("a, button")) return;
        window.location.href = teacherLink;
      });

      return article;
    }

    // Demo teachers need no network call, so they're ready immediately -
    // real (self-registered) teachers are fetched in the background below
    // and merged in as soon as they arrive, instead of blocking the whole
    // list on that request. Only teacher DATA lives in this array - the
    // overlapping card stack only ever holds the current page's worth of
    // cards in the DOM, so updateTeachers() rebuilds them from here on
    // every filter/sort/page change instead of showing/hiding persistent
    // nodes the way the old list layout did.
    const allTeachers = [];
    function addTeacherCard(teacher) {
      allTeachers.push(teacher);
    }
    TEACHERS.forEach(addTeacherCard);

    const searchInput = document.getElementById("searchInput");
    const filters = document.querySelectorAll(".filter");
    const levelFilters = document.querySelectorAll(".level-filter");
    const langFilters = document.querySelectorAll(".lang-filter");
    const priceMin = document.getElementById("priceMin");
    const priceMax = document.getElementById("priceMax");
    const priceRangeLabel = document.getElementById("priceRangeLabel");
    const priceRangeValue = document.getElementById("priceRangeValue");
    const levelBoxValue = document.getElementById("levelBoxValue");
    const langBoxValue = document.getElementById("langBoxValue");
    const sortSelect = document.getElementById("sortSelect");
    const count = document.getElementById("resultsCount");
    const empty = document.getElementById("emptyState");
    const favoritesOnlyFilter = document.getElementById("favoritesOnlyFilter");
    const paginationEl = document.getElementById("pagination");

    // Only a handful of overlapping cards fit on screen at once - this is
    // a first pass, tune it once we've actually seen how many looks right.
    const TEACHERS_PER_PAGE = 5;
    let currentPage = 1;

    function renderPagination(totalPages) {
      paginationEl.innerHTML = "";
      if (totalPages <= 1) return;

      const prev = document.createElement("button");
      prev.type = "button";
      prev.className = "page-arrow";
      prev.textContent = "←";
      prev.disabled = currentPage === 1;
      prev.addEventListener("click", () => { currentPage--; updateTeachers(); });
      paginationEl.appendChild(prev);

      // current page, first, last, and one neighbor on each side - the
      // rest collapse into an ellipsis, same shape as Preply's pager
      const pagesToShow = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1]);
      let lastRendered = 0;

      for (let page = 1; page <= totalPages; page++) {
        if (!pagesToShow.has(page)) continue;

        if (page - lastRendered > 1) {
          const ellipsis = document.createElement("span");
          ellipsis.className = "page-ellipsis";
          ellipsis.textContent = "…";
          paginationEl.appendChild(ellipsis);
        }

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "page-num" + (page === currentPage ? " active" : "");
        btn.textContent = page;
        if (page !== currentPage) {
          btn.addEventListener("click", () => { currentPage = page; updateTeachers(); });
        }
        paginationEl.appendChild(btn);
        lastRendered = page;
      }

      const next = document.createElement("button");
      next.type = "button";
      next.className = "page-arrow";
      next.textContent = "→";
      next.disabled = currentPage === totalPages;
      next.addEventListener("click", () => { currentPage++; updateTeachers(); });
      paginationEl.appendChild(next);
    }

    function updateTeachers(options) {
      const resetPage = options && options.resetPage;
      if (resetPage) currentPage = 1;

      // keep the two price handles from crossing over each other
      if (Number(priceMin.value) > Number(priceMax.value)) {
        const swap = priceMin.value;
        priceMin.value = priceMax.value;
        priceMax.value = swap;
      }

      const minPrice = Number(priceMin.value);
      const maxPrice = Number(priceMax.value);
      const priceRangeText = `₺${minPrice}–₺${maxPrice}${maxPrice >= 1000 ? "+" : ""}`;
      priceRangeLabel.textContent = priceRangeText;
      priceRangeValue.textContent = priceRangeText;

      const search = searchInput.value.toLowerCase();

      const selectedTags = Array.from(filters)
        .filter(input => input.checked)
        .map(input => input.value);

      const selectedLevels = Array.from(levelFilters)
        .filter(input => input.checked)
        .map(input => input.value);

      const selectedLangs = Array.from(langFilters)
        .filter(input => input.checked)
        .map(input => input.value);

      let matches = allTeachers.filter(teacher => {

        const name = teacher.name.toLowerCase();
        const tags = teacher.tags.join(" ").toLowerCase();
        const languages = (teacher.languages || "").toLowerCase();
        const price = Number(teacher.price);

        const matchesSearch =
          !search ||
          name.includes(search) ||
          tags.includes(search);

        const matchesTags =
          selectedTags.length === 0 ||
          selectedTags.some(tag =>
            tags.includes(tag.toLowerCase())
          );

        const matchesLevel =
          selectedLevels.length === 0 ||
          selectedLevels.includes(teacher.level);

        const matchesLangs =
          selectedLangs.length === 0 ||
          selectedLangs.some(lang =>
            languages.includes(lang.toLowerCase())
          );

        const matchesPrice =
          price >= minPrice && (maxPrice >= 1000 || price <= maxPrice);

        const matchesFavorites =
          !favoritesOnlyFilter.checked || armusIsFavorite(teacher.id);

        return matchesSearch && matchesTags && matchesLevel && matchesLangs && matchesPrice && matchesFavorites;
      });


      const sort = sortSelect.value;

      matches.sort((a, b) => {

        if (sort === "priceLow") {
          return Number(a.price) - Number(b.price);
        }

        if (sort === "priceHigh") {
          return Number(b.price) - Number(a.price);
        }

        if (sort === "rating") {
          return Number(b.rating || 0) - Number(a.rating || 0);
        }

        return 0;
      });


      const totalPages = Math.max(1, Math.ceil(matches.length / TEACHERS_PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;

      const pageStart = (currentPage - 1) * TEACHERS_PER_PAGE;
      const pageItems = matches.slice(pageStart, pageStart + TEACHERS_PER_PAGE);

      grid.innerHTML = "";
      pageItems.forEach(teacher => grid.appendChild(renderTeacherCard(teacher)));
      renderPagination(totalPages);


      count.textContent =
        armusT("teachersPage.resultsCount", "{n} öğretmen bulundu").replace("{n}", matches.length);

      // reflect the picked values on the row-1 boxes themselves
      levelBoxValue.textContent = selectedLevels.length ? selectedLevels.join(", ") : armusT("teachersPage.all", "Tümü");
      langBoxValue.textContent = selectedLangs.length ? selectedLangs.join(", ") : armusT("teachersPage.all", "Tümü");

      // reflect active state on the filter triggers themselves
      document.querySelector('[data-dropdown="type"] .filter-trigger')
        .classList.toggle("active-filter", selectedTags.length > 0);
      document.querySelector('[data-dropdown="level"] .filter-trigger')
        .classList.toggle("active-filter", selectedLevels.length > 0);
      document.querySelector('[data-dropdown="lang"] .filter-trigger')
        .classList.toggle("active-filter", selectedLangs.length > 0);
      document.querySelector('[data-dropdown="price"] .filter-trigger')
        .classList.toggle("active-filter", minPrice > 0 || maxPrice < 1000);

      empty.style.display =
        matches.length === 0 ? "block" : "none";
    }


    searchInput.addEventListener("input", () => updateTeachers({ resetPage: true }));

    filters.forEach(filter =>
      filter.addEventListener("change", () => updateTeachers({ resetPage: true }))
    );

    levelFilters.forEach(filter =>
      filter.addEventListener("change", () => updateTeachers({ resetPage: true }))
    );

    langFilters.forEach(filter =>
      filter.addEventListener("change", () => updateTeachers({ resetPage: true }))
    );

    priceMin.addEventListener("input", () => updateTeachers({ resetPage: true }));
    priceMax.addEventListener("input", () => updateTeachers({ resetPage: true }));

    sortSelect.addEventListener("change", () => updateTeachers({ resetPage: true }));
    favoritesOnlyFilter.addEventListener("change", () => updateTeachers({ resetPage: true }));

    const initialQuery = new URLSearchParams(window.location.search).get("q");
    if (initialQuery) {
      searchInput.value = initialQuery;
    }

    updateTeachers();

    document.addEventListener("armus:langchange", () => {
      updateTeachers();
    });

    // real (self-registered) teachers still need a Supabase round trip,
    // so let people know more results may still be on the way instead of
    // assuming the list is done
    document.getElementById("loadingNote").classList.add("visible");

  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=4"></script>
  <script src="site-settings.js?v=4"></script>
  <script src="bookings.js?v=5"></script>
  <script src="reviews.js?v=5"></script>
  <script src="marketplace.js?v=5"></script>
  <script>

    // real (self-registered) teachers need a Supabase round trip - merge
    // them into the already-visible grid as soon as they arrive instead
    // of making the whole list wait on the network. Only a signed-in
    // STUDENT's own booking history matters for which hidden teachers
    // still show up for them (migration_41.sql) - a logged-out visitor
    // or a teacher account browsing this page has none.
    armusGetSession().then(session => (session && session.role === "student") ? session.id : null).then(viewerId =>
      armusGetRegisteredTeachers(viewerId).then(registeredTeachers => {
        registeredTeachers.forEach(addTeacherCard);
        updateTeachers();
        document.getElementById("loadingNote").classList.remove("visible");
      })
    );

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
