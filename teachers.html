<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Öğretmenler | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: #f4f4f2;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
    }

    /* NAVBAR */

    .navbar {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      color: #a8a8aa;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: white;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-greeting {
      font-size: 13px;
      color: #c7c7c7;
      margin-right: 4px;
    }

    .nav-greeting small {
      color: #8f8f8f;
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
    }

    /* PAGE HEAD */

    .page-head {
      padding: 34px 0 22px;
    }

    .page-head h1 {
      font-size: clamp(24px, 3vw, 30px);
      letter-spacing: -1px;
    }

    .page-head p {
      margin-top: 8px;
      color: #99999c;
      font-size: 13.5px;
    }

    .loading-note {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 4px !important;
      color: #77777a !important;
      font-size: 12px !important;
    }

    .loading-note.visible {
      display: flex;
    }

    .loading-note::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--armus-gold-text);
      animation: armus-pulse 1s ease-in-out infinite;
    }

    @keyframes armus-pulse {
      0%, 100% { opacity: .3; }
      50% { opacity: 1; }
    }

    /* SEARCH */

    .search-box {
      display: flex;
      gap: 10px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 14px;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-family: inherit;
      font-size: 14.5px;
      padding: 10px 14px;
    }

    .search-box input::placeholder {
      color: #66666a;
    }

    /* TOP FILTER BAR (Preply-style dropdown pills, ARMUS theme) */

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      position: relative;
      z-index: 5;
    }

    .filter-dropdown {
      position: relative;
    }

    .filter-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 999px;
      padding: 9px 15px;
      color: #d8d8da;
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }

    .filter-pill:hover {
      border-color: var(--armus-silver-1);
    }

    .filter-pill.active-filter {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .filter-pill .chev {
      font-size: 9px;
      opacity: 0.7;
    }

    .filter-panel {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 220px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, .45);
    }

    .filter-dropdown.open .filter-panel {
      display: block;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 9px 0;
      font-size: 13px;
      color: #c3c3c5;
      cursor: pointer;
    }

    .filter-option input {
      accent-color: var(--armus-gold-2);
    }

    .filter-price-label {
      font-size: 12px;
      color: #c3c3c5;
      margin-bottom: 8px;
    }

    .price-slider-wrap {
      position: relative;
      height: 26px;
    }

    .price-slider-wrap input[type="range"] {
      position: absolute;
      left: 0;
      top: 10px;
      width: 100%;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
    }

    .price-slider-wrap input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: #303034;
      border-radius: 2px;
    }

    .price-slider-wrap input[type="range"]::-moz-range-track {
      height: 4px;
      background: #303034;
      border-radius: 2px;
    }

    .price-slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      pointer-events: auto;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--armus-gold-gradient);
      cursor: pointer;
      margin-top: -6px;
    }

    .price-slider-wrap input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
      width: 15px;
      height: 15px;
      border: none;
      border-radius: 50%;
      background: var(--armus-gold-2);
      cursor: pointer;
    }

    .fav-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12.5px;
      color: #d8d8da;
      cursor: pointer;
    }

    .fav-toggle input {
      accent-color: var(--armus-gold-2);
    }

    .sort-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: #8e8e91;
    }

    .sort-wrap select {
      background: var(--armus-panel);
      color: white;
      border: 1px solid var(--armus-border);
      border-radius: 999px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
    }

    /* RESULTS */

    .results-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .results-count {
      color: #89898c;
      font-size: 13px;
    }

    .teachers {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }

    /* LIST-STYLE TEACHER ROW */

    .teacher-card {
      display: flex;
      gap: 28px;
      align-items: center;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 22px;
      padding: 28px;
      transition: 0.2s ease;
    }

    .teacher-card:hover {
      border-color: #6b5a34;
    }

    .avatar {
      width: 150px;
      height: 180px;
      border-radius: 18px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 34px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-mid {
      flex: 1;
      min-width: 0;
    }

    .card-mid-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .teacher-name {
      font-size: 23px;
      font-weight: 700;
    }

    .rating {
      font-size: 14px;
      color: var(--armus-gold-text);
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: #6b6b6f;
      font-size: 21px;
      cursor: pointer;
      line-height: 1;
      padding: 2px;
      margin-left: auto;
    }

    .fav-btn.active {
      color: var(--armus-gold-text);
    }

    .teacher-role {
      color: #a5a5a9;
      font-size: 14.5px;
      margin-top: 6px;
    }

    .stats-line {
      color: #8e8e91;
      font-size: 12.5px;
      margin-top: 9px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .tag {
      font-size: 11.5px;
      color: #c8c8ca;
      border: 1px solid var(--armus-border);
      padding: 7px 12px;
      border-radius: 999px;
    }

    .card-desc {
      margin-top: 16px;
      font-size: 13.5px;
      line-height: 1.6;
      color: #a3a3a7;
      max-width: 60ch;
    }

    .card-desc a {
      color: var(--armus-gold-text);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }

    .card-desc a:hover {
      text-decoration: underline;
    }

    .card-side {
      flex-shrink: 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      width: 190px;
    }

    .price {
      font-size: 27px;
      font-weight: 700;
      color: var(--armus-gold-text);
    }

    .price span {
      color: #77777b;
      font-size: 12.5px;
      font-weight: 400;
    }

    .trial {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border: none;
      border-radius: 13px;
      padding: 15px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .msg-link {
      font-size: 12.5px;
      color: #999;
      text-decoration: none;
    }

    .msg-link:hover {
      color: var(--armus-gold-text);
    }

    .empty {
      display: none;
      padding: 50px;
      text-align: center;
      color: #777;
      border: 1px dashed var(--armus-border);
      border-radius: 20px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .nav-links {
        display: none;
      }

      .teacher-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .avatar {
        width: 100%;
        height: 160px;
      }

      .card-mid-top {
        flex-wrap: wrap;
      }

      .card-side {
        width: 100%;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .trial {
        width: auto;
      }

      .sort-wrap {
        margin-left: 0;
        width: 100%;
      }

      .sort-wrap select {
        flex: 1;
      }
    }

    @media (max-width: 560px) {
      .nav-greeting {
        display: none;
      }

      .nav-buttons {
        gap: 6px;
      }

      .nav-buttons .btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .logo {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="nav-inner">

      <a href="index.html" class="logo">ARMUS</a>

      <nav class="nav-links">
        <a href="teachers.html">Öğretmenler</a>
        <a href="index.html#how">Nasıl Çalışır?</a>
        <a href="index.html#about">Hakkımızda</a>
      </nav>

      <div class="nav-buttons" id="navAuthButtons">
        <a class="btn" href="login.html">Giriş Yap</a>
        <a class="btn btn-light" href="register.html">Kayıt Ol</a>
      </div>

    </div>
  </header>


  <main class="container">

    <div class="page-head">
      <h1>Sana uygun İngilizce öğretmenini bul.</h1>
      <p id="resultsCount">6 öğretmen bulundu</p>
      <p id="loadingNote" class="loading-note">Diğer öğretmenler yükleniyor…</p>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="İsim, uzmanlık veya konu ara..."
      >
    </div>

    <div class="filter-bar">

      <div class="filter-dropdown" data-dropdown="type">
        <button type="button" class="filter-pill">Ders Türü <span class="chev">▾</span></button>
        <div class="filter-panel">
          <label class="filter-option"><input type="checkbox" value="Konuşma" class="filter"> Konuşma</label>
          <label class="filter-option"><input type="checkbox" value="IELTS" class="filter"> IELTS</label>
          <label class="filter-option"><input type="checkbox" value="TOEFL" class="filter"> TOEFL</label>
          <label class="filter-option"><input type="checkbox" value="YDS" class="filter"> YDS</label>
          <label class="filter-option"><input type="checkbox" value="İş İngilizcesi" class="filter"> İş İngilizcesi</label>
        </div>
      </div>

      <div class="filter-dropdown" data-dropdown="level">
        <button type="button" class="filter-pill">Seviye <span class="chev">▾</span></button>
        <div class="filter-panel">
          <label class="filter-option"><input type="checkbox" value="Başlangıç" class="level-filter"> Başlangıç</label>
          <label class="filter-option"><input type="checkbox" value="Orta" class="level-filter"> Orta</label>
          <label class="filter-option"><input type="checkbox" value="İleri" class="level-filter"> İleri</label>
        </div>
      </div>

      <div class="filter-dropdown" data-dropdown="lang">
        <button type="button" class="filter-pill">Diller <span class="chev">▾</span></button>
        <div class="filter-panel">
          <label class="filter-option"><input type="checkbox" value="İngilizce" class="lang-filter"> İngilizce</label>
          <label class="filter-option"><input type="checkbox" value="Türkçe" class="lang-filter"> Türkçe</label>
          <label class="filter-option"><input type="checkbox" value="Almanca" class="lang-filter"> Almanca</label>
          <label class="filter-option"><input type="checkbox" value="Fransızca" class="lang-filter"> Fransızca</label>
          <label class="filter-option"><input type="checkbox" value="İspanyolca" class="lang-filter"> İspanyolca</label>
        </div>
      </div>

      <div class="filter-dropdown" data-dropdown="price">
        <button type="button" class="filter-pill">Fiyat <span id="priceRangeLabel"></span> <span class="chev">▾</span></button>
        <div class="filter-panel">
          <div class="filter-price-label">Fiyat aralığı</div>
          <div class="price-slider-wrap">
            <input type="range" id="priceMin" min="0" max="1000" step="50" value="0">
            <input type="range" id="priceMax" min="0" max="1000" step="50" value="1000">
          </div>
        </div>
      </div>

      <label class="fav-toggle">
        <input type="checkbox" id="favoritesOnlyFilter">
        ★ Favorilerim
      </label>

      <div class="sort-wrap">
        <select id="sortSelect">
          <option value="default">Önerilen</option>
          <option value="priceLow">En düşük fiyat</option>
          <option value="priceHigh">En yüksek fiyat</option>
          <option value="rating">En yüksek puan</option>
        </select>
      </div>

    </div>


    <div class="teachers" id="teachersGrid"></div>

    <div class="empty" id="emptyState">
      Aramana uygun öğretmen bulunamadı.
    </div>

  </main>


  <script src="teachers-data.js"></script>
  <script src="favorites.js"></script>
  <script>

    // Everything in this block only needs teachers-data.js and favorites.js
    // (both local, no network), so it renders the demo teachers and makes
    // the whole grid (filters, sort, favorites) usable immediately - it
    // does not wait on the Supabase SDK below, which is a slow external
    // script fetch on a bad connection.

    const grid = document.getElementById("teachersGrid");

    // ---- dropdown filter pills open/close ----

    document.querySelectorAll(".filter-dropdown").forEach(dropdown => {
      const pill = dropdown.querySelector(".filter-pill");
      pill.addEventListener("click", event => {
        event.stopPropagation();
        const wasOpen = dropdown.classList.contains("open");
        document.querySelectorAll(".filter-dropdown.open").forEach(d => d.classList.remove("open"));
        if (!wasOpen) dropdown.classList.add("open");
      });
    });

    document.addEventListener("click", () => {
      document.querySelectorAll(".filter-dropdown.open").forEach(d => d.classList.remove("open"));
    });

    document.querySelectorAll(".filter-panel").forEach(panel => {
      panel.addEventListener("click", event => event.stopPropagation());
    });

    function renderTeacherCard(teacher) {

      const teacherLink = `teacher.html?teacher=${encodeURIComponent(teacher.id)}`;
      const bookingLink = `booking.html?teacher=${encodeURIComponent(teacher.id)}&type=trial`;
      const ratingLabel = teacher.rating ? `★ ${teacher.rating}` : "Yeni";
      const avatarInner = teacher.photo
        ? `<img src="${teacher.photo}" alt="">`
        : teacher.initials;

      const article = document.createElement("article");
      article.className = "teacher-card";
      article.dataset.name = teacher.name;
      article.dataset.tags = teacher.tags.join(" ");
      article.dataset.level = teacher.level;
      article.dataset.price = teacher.price;
      article.dataset.rating = teacher.rating || 0;
      article.dataset.languages = teacher.languages;
      article.dataset.teacherId = teacher.id;

      const studentsLabel = teacher.students !== undefined
        ? `${teacher.students} öğrenci · ${teacher.completedLessons} ders`
        : `${teacher.completedLessons} ders`;

      const aboutText = Array.isArray(teacher.about) ? teacher.about[0] : "";
      const aboutSnippet = aboutText && aboutText.length > 130
        ? aboutText.slice(0, 130).trim() + "…"
        : aboutText;

      const isDemoTeacher = typeof TEACHERS !== "undefined" && TEACHERS.some(t => t.id === teacher.id);
      const messageLink = isDemoTeacher
        ? ""
        : `<a class="msg-link" href="mesajlar.html?teacher=${encodeURIComponent(teacher.id)}">Mesaj Gönder</a>`;

      article.innerHTML = `
        <div class="avatar">${avatarInner}</div>

        <div class="card-mid">
          <div class="card-mid-top">
            <a href="${teacherLink}" class="teacher-name">${teacher.name}</a>
            <div class="rating">${ratingLabel}</div>
            <button type="button" class="fav-btn" data-fav="${teacher.id}" aria-label="Favorilere ekle">♥</button>
          </div>
          <div class="teacher-role">${teacher.role}</div>
          <div class="stats-line">${studentsLabel}</div>
          <div class="tags">
            ${teacher.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
          </div>
          ${aboutSnippet ? `<div class="card-desc">${aboutSnippet} <a href="${teacherLink}">Devamını oku</a></div>` : ""}
        </div>

        <div class="card-side">
          <div class="price">₺${teacher.price} <span>/ ders</span></div>
          <a class="trial" href="${bookingLink}">Deneme Dersi Al</a>
          ${messageLink}
        </div>
      `;

      grid.appendChild(article);

      const btn = article.querySelector(".fav-btn");
      btn.classList.toggle("active", armusIsFavorite(btn.dataset.fav));
      btn.addEventListener("click", event => {
        event.preventDefault();
        const nowFavorited = armusToggleFavorite(btn.dataset.fav);
        btn.classList.toggle("active", nowFavorited);
        if (favoritesOnlyFilter.checked) updateTeachers();
      });
    }

    // Demo teachers need no network call, so they render immediately -
    // real (self-registered) teachers are fetched in the background below
    // and merged in as soon as they arrive, instead of blocking the whole
    // list on that request.
    TEACHERS.forEach(renderTeacherCard);

    const searchInput = document.getElementById("searchInput");
    const filters = document.querySelectorAll(".filter");
    const levelFilters = document.querySelectorAll(".level-filter");
    const langFilters = document.querySelectorAll(".lang-filter");
    const priceMin = document.getElementById("priceMin");
    const priceMax = document.getElementById("priceMax");
    const priceRangeLabel = document.getElementById("priceRangeLabel");
    const sortSelect = document.getElementById("sortSelect");
    const count = document.getElementById("resultsCount");
    const empty = document.getElementById("emptyState");
    const favoritesOnlyFilter = document.getElementById("favoritesOnlyFilter");


    function updateTeachers() {

      // keep the two price handles from crossing over each other
      if (Number(priceMin.value) > Number(priceMax.value)) {
        const swap = priceMin.value;
        priceMin.value = priceMax.value;
        priceMax.value = swap;
      }

      const minPrice = Number(priceMin.value);
      const maxPrice = Number(priceMax.value);
      priceRangeLabel.textContent = `₺${minPrice}–₺${maxPrice}${maxPrice >= 1000 ? "+" : ""}`;

      const search = searchInput.value.toLowerCase();

      const selectedTags = Array.from(filters)
        .filter(input => input.checked)
        .map(input => input.value);

      const selectedLevels = Array.from(levelFilters)
        .filter(input => input.checked)
        .map(input => input.value);

      const selectedLangs = Array.from(langFilters)
        .filter(input => input.checked)
        .map(input => input.value);

      // queried fresh each run, since real teachers can still be merging
      // into the grid asynchronously after the first render
      const cards = Array.from(document.querySelectorAll(".teacher-card"));

      let visibleCards = cards.filter(card => {

        const name = card.dataset.name.toLowerCase();
        const tags = card.dataset.tags.toLowerCase();
        const level = card.dataset.level;
        const languages = (card.dataset.languages || "").toLowerCase();
        const price = Number(card.dataset.price);

        const matchesSearch =
          !search ||
          name.includes(search) ||
          tags.includes(search);

        const matchesTags =
          selectedTags.length === 0 ||
          selectedTags.some(tag =>
            tags.includes(tag.toLowerCase())
          );

        const matchesLevel =
          selectedLevels.length === 0 ||
          selectedLevels.includes(level);

        const matchesLangs =
          selectedLangs.length === 0 ||
          selectedLangs.some(lang =>
            languages.includes(lang.toLowerCase())
          );

        const matchesPrice =
          price >= minPrice && (maxPrice >= 1000 || price <= maxPrice);

        const matchesFavorites =
          !favoritesOnlyFilter.checked || armusIsFavorite(card.dataset.teacherId);

        return matchesSearch && matchesTags && matchesLevel && matchesLangs && matchesPrice && matchesFavorites;
      });


      const sort = sortSelect.value;

      visibleCards.sort((a, b) => {

        if (sort === "priceLow") {
          return Number(a.dataset.price) - Number(b.dataset.price);
        }

        if (sort === "priceHigh") {
          return Number(b.dataset.price) - Number(a.dataset.price);
        }

        if (sort === "rating") {
          return Number(b.dataset.rating) - Number(a.dataset.rating);
        }

        return 0;
      });


      cards.forEach(card => {
        card.style.display = "none";
      });

      visibleCards.forEach(card => {
        card.style.display = "flex";
        grid.appendChild(card);
      });


      count.textContent =
        `${visibleCards.length} öğretmen bulundu`;

      // reflect active state on the filter pills themselves
      document.querySelector('[data-dropdown="type"] .filter-pill')
        .classList.toggle("active-filter", selectedTags.length > 0);
      document.querySelector('[data-dropdown="level"] .filter-pill')
        .classList.toggle("active-filter", selectedLevels.length > 0);
      document.querySelector('[data-dropdown="lang"] .filter-pill')
        .classList.toggle("active-filter", selectedLangs.length > 0);
      document.querySelector('[data-dropdown="price"] .filter-pill')
        .classList.toggle("active-filter", minPrice > 0 || maxPrice < 1000);

      empty.style.display =
        visibleCards.length === 0 ? "block" : "none";
    }


    searchInput.addEventListener("input", updateTeachers);

    filters.forEach(filter =>
      filter.addEventListener("change", updateTeachers)
    );

    levelFilters.forEach(filter =>
      filter.addEventListener("change", updateTeachers)
    );

    langFilters.forEach(filter =>
      filter.addEventListener("change", updateTeachers)
    );

    priceMin.addEventListener("input", updateTeachers);
    priceMax.addEventListener("input", updateTeachers);

    sortSelect.addEventListener("change", updateTeachers);
    favoritesOnlyFilter.addEventListener("change", updateTeachers);

    const initialQuery = new URLSearchParams(window.location.search).get("q");
    if (initialQuery) {
      searchInput.value = initialQuery;
    }

    updateTeachers();

    // real (self-registered) teachers still need a Supabase round trip,
    // so let people know more results may still be on the way instead of
    // assuming the list is done
    document.getElementById("loadingNote").classList.add("visible");

  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="bookings.js"></script>
  <script src="reviews.js"></script>
  <script src="marketplace.js"></script>
  <script>

    // real (self-registered) teachers need a Supabase round trip - merge
    // them into the already-visible grid as soon as they arrive instead
    // of making the whole list wait on the network
    armusGetRegisteredTeachers().then(registeredTeachers => {
      registeredTeachers.forEach(renderTeacherCard);
      updateTeachers();
      document.getElementById("loadingNote").classList.remove("visible");
    });

  </script>

</body>
</html>
