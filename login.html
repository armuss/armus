<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Giriş Yap | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css?v=2">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(440px, calc(100% - 40px));
      margin: auto;
    }

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(440px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .back {
      color: var(--armus-muted);
      font-size: 13px;
    }

    .back:hover {
      color: var(--armus-ink);
    }

    main.container {
      padding: 55px 0 90px;
    }

    .eyebrow {
      color: var(--armus-muted);
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      letter-spacing: -1.2px;
      text-align: center;
      margin-bottom: 30px;
    }

    /* FORM */

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--armus-muted);
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--armus-gold-2);
    }

    .forgot-row {
      text-align: right;
      margin: -6px 0 18px;
    }

    .forgot-row a {
      font-size: 12.5px;
      color: var(--armus-muted);
      text-decoration: underline;
    }

    .forgot-row a:hover {
      color: var(--armus-ink);
    }

    .form-error {
      display: none;
      background: rgba(220, 90, 90, .1);
      border: 1px solid rgba(220, 90, 90, .35);
      color: #b3261e;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .switch-note {
      text-align: center;
      color: var(--armus-muted);
      font-size: 13px;
      margin-top: 22px;
    }

    .switch-note a {
      color: var(--armus-gold-text);
      font-weight: 600;
    }

  
    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-utility {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-toggle {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: var(--armus-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 12.5px Inter, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--armus-border);
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .help-btn:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn svg {
      width: 17px;
      height: 17px;
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
      <div class="nav-right">
        <div class="nav-utility">
          <button type="button" class="lang-toggle" data-lang-toggle title="Dili değiştir / Change language">EN</button>
          <a class="help-btn" href="sss.html" title="Yardım Merkezi" aria-label="Yardım Merkezi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          </a>
        </div>
        <a href="index.html" class="back" data-i18n="nav.backHome">← Ana sayfa</a>
      </div>
    </div>
  </nav>

  <main class="container">

    <div class="eyebrow" data-i18n="login.eyebrow">TEKRAR HOŞ GELDİN</div>
    <h1 data-i18n="login.title">Giriş yap</h1>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>

      <div class="field">
        <label for="email" data-i18n="login.emailLabel">E-posta</label>
        <input type="email" id="email" autocomplete="email" placeholder="ornek@eposta.com" data-i18n-placeholder="login.emailPlaceholder">
      </div>

      <div class="field">
        <label for="password" data-i18n="login.passwordLabel">Şifre</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Şifren" data-i18n-placeholder="login.passwordPlaceholder">
      </div>

      <div class="forgot-row">
        <a href="sifre-sifirla.html" data-i18n="login.forgot">Şifremi unuttum</a>
      </div>

      <button type="submit" class="submit-btn" data-i18n="login.submit">Giriş Yap</button>

    </form>

    <div class="switch-note">
      <span data-i18n="login.switchText">Hesabın yok mu?</span> <a href="register.html" id="switchToRegister" data-i18n="login.switchLink">Kayıt ol</a>
    </div>

  </main>

  <script src="i18n.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>

  <script src="supabase-config.js?v=2"></script>
  <script src="site-settings.js?v=2"></script>

  <script src="auth.js?v=2"></script>
  <script>

    const nextParam = new URLSearchParams(window.location.search).get("next");
    if (nextParam) {
      document.getElementById("switchToRegister").href =
        `register.html?next=${encodeURIComponent(nextParam)}`;
    }

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("formError");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async event => {

      event.preventDefault();
      errorBox.style.display = "none";

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      const { error } = await armusSignIn({ email, password });

      if (error) {
        showError(armusT("login.wrongCredentials", "E-posta veya şifre hatalı."));
        return;
      }

      const session = await armusGetSession();

      if (session && session.is_admin) {
        window.location.href = "admin.html";
        return;
      }

      if (session && session.role === "teacher") {
        window.location.href = "dashboard.html";
        return;
      }

      const next = new URLSearchParams(window.location.search).get("next");
      window.location.href = next || "student-dashboard.html";
    });

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
