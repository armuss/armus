<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Derslerim | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: #f4f4f2;
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(760px, calc(100% - 40px));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(760px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
      font-weight: 700;
    }

    .nav-greeting {
      font-size: 13px;
      color: #c7c7c7;
      margin-right: 4px;
    }

    .nav-greeting small {
      color: #8f8f8f;
    }

    /* GATE */

    .gate {
      display: none;
      padding: 100px 0;
      text-align: center;
    }

    .gate h1 {
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .gate p {
      color: #99999c;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .gate-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* PAGE */

    main.container {
      padding: 45px 0 90px;
      display: none;
    }

    .eyebrow {
      color: #99999c;
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 34px);
      letter-spacing: -1.2px;
      margin-bottom: 30px;
    }

    /* LESSON CARD */

    .lesson-card {
      padding: 18px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .lesson-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .lesson-join {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }

    .join-hint {
      color: #8e8e91;
      font-size: 12.5px;
    }

    .lesson-cancel-wrap {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lesson-cancel-btn {
      border: 1px solid rgba(220, 90, 90, .4);
      background: transparent;
      color: #f0a5a5;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .lesson-cancel-btn:hover {
      background: rgba(220, 90, 90, .08);
    }

    .lesson-cancel-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .lesson-cancel-hint {
      color: #77777b;
      font-size: 11.5px;
    }

    .lesson-cancel-badge {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
      color: #a3a3a6;
      font-size: 12.5px;
      font-weight: 600;
    }

    .lesson-cancelled {
      opacity: .6;
    }

    .review-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .review-prompt-btn {
      border: 1px solid var(--armus-gold-2);
      color: var(--armus-gold-text);
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .review-form {
      display: none;
      margin-top: 14px;
    }

    .star-picker {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 24px;
    }

    .star-picker span {
      cursor: pointer;
      color: #45403a;
    }

    .star-picker span.active {
      color: var(--armus-gold-2);
    }

    .review-form textarea {
      width: 100%;
      min-height: 80px;
      background: var(--armus-bg);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: white;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 10px;
    }

    .review-submit-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .submitted-review {
      color: #c3c3c5;
      font-size: 13px;
    }

    .submitted-review .stars {
      color: var(--armus-gold-text);
      margin-bottom: 6px;
      display: block;
    }

    .dispute-block {
      margin-top: 12px;
    }

    .dispute-prompt-btn {
      border: 1px solid rgba(220, 90, 90, .5);
      color: #f0a5a5;
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .dispute-form {
      display: none;
      margin-top: 14px;
    }

    .dispute-form select,
    .dispute-form textarea {
      width: 100%;
      background: var(--armus-bg);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: white;
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .dispute-form textarea {
      min-height: 70px;
      resize: vertical;
    }

    .dispute-submit-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: rgba(220, 90, 90, .85);
      color: white;
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .submitted-dispute {
      color: #c3c3c5;
      font-size: 13px;
    }

    .submitted-dispute .dispute-status {
      color: #f0a5a5;
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    .avatar {
      width: 54px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-teacher {
      font-weight: 700;
      font-size: 15px;
    }

    .lesson-meta {
      color: #8e8e91;
      font-size: 12px;
      margin-top: 3px;
    }

    .lesson-type {
      display: inline-block;
      border: 1px solid var(--armus-silver-border-strong);
      color: var(--armus-silver-1);
      font-size: 10px;
      border-radius: 999px;
      padding: 3px 9px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .lesson-when {
      text-align: right;
    }

    .lesson-date {
      font-weight: 700;
      font-size: 14px;
    }

    .lesson-time {
      color: var(--armus-gold-text);
      font-size: 13px;
      margin-top: 3px;
    }

    .lesson-past .lesson-row {
      opacity: 0.55;
    }

    /* EMPTY STATE */

    .empty-state {
      display: none;
      padding: 60px 0;
      text-align: center;
      border: 1px dashed var(--armus-border);
      border-radius: 20px;
    }

    .empty-state p {
      color: #99999c;
      font-size: 14px;
      margin-bottom: 22px;
    }

    @media (max-width: 560px) {
      .nav-greeting {
        display: none;
      }

      .nav-buttons {
        gap: 6px;
      }

      .nav-buttons .btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .logo {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">ARMUS</a>
      <div class="nav-buttons" id="navAuthButtons"></div>
    </div>
  </nav>

  <div class="container">
    <div class="gate" id="gate">
      <h1>Derslerini görmek için giriş yap</h1>
      <p>Rezervasyonlarını görebilmek için önce bir hesabın olması gerekiyor.</p>
      <div class="gate-actions">
        <a class="btn" href="login.html?next=my-lessons.html">Giriş Yap</a>
        <a class="btn btn-light" href="register.html?next=my-lessons.html">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <main class="container" id="pageRoot">

    <div class="eyebrow">DERSLERİM</div>
    <h1>Rezervasyonların</h1>

    <div id="lessonsList"></div>

    <div class="empty-state" id="emptyState">
      <p>Henüz bir dersin yok.</p>
      <a class="btn btn-light" href="teachers.html">Öğretmen bul →</a>
    </div>

  </main>

  <script src="teachers-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="site-settings.js"></script>
  <script src="auth.js"></script>
  <script src="bookings.js"></script>
  <script src="reviews.js"></script>
  <script src="marketplace.js"></script>
  <script src="disputes.js"></script>
  <script>

    const gate = document.getElementById("gate");
    const pageRoot = document.getElementById("pageRoot");

    (async function() {

    const session = await armusGetSession();

    if (!session) {

      gate.style.display = "block";

    } else {

      pageRoot.style.display = "block";

      const bookings = await armusGetBookingsForStudent(session.id);
      const list = document.getElementById("lessonsList");
      const empty = document.getElementById("emptyState");

      async function buildReviewBlock(booking) {

        const wrap = document.createElement("div");
        wrap.className = "review-block";

        const existing = await armusGetReviewForBooking(booking.id);

        if (existing) {

          wrap.innerHTML = `
            <div class="submitted-review">
              <span class="stars">${"★".repeat(existing.stars)}${"☆".repeat(5 - existing.stars)} Değerlendirdin</span>
              ${existing.text ? `<p>${existing.text}</p>` : ""}
            </div>
          `;

          return wrap;
        }

        let selectedStars = 0;

        wrap.innerHTML = `
          <button type="button" class="review-prompt-btn">★ Bu dersi değerlendir</button>
          <div class="review-form">
            <div class="star-picker">
              ${[1, 2, 3, 4, 5].map(n => `<span data-star="${n}">★</span>`).join("")}
            </div>
            <textarea placeholder="${booking.teacherName} ile dersin nasıldı?"></textarea>
            <button type="button" class="review-submit-btn">Gönder</button>
          </div>
        `;

        const promptBtn = wrap.querySelector(".review-prompt-btn");
        const form = wrap.querySelector(".review-form");
        const stars = wrap.querySelectorAll(".star-picker span");
        const textarea = wrap.querySelector("textarea");
        const submitBtn = wrap.querySelector(".review-submit-btn");

        promptBtn.addEventListener("click", () => {
          promptBtn.style.display = "none";
          form.style.display = "block";
        });

        stars.forEach(star => {
          star.addEventListener("click", () => {
            selectedStars = Number(star.dataset.star);
            stars.forEach(s => s.classList.toggle("active", Number(s.dataset.star) <= selectedStars));
          });
        });

        submitBtn.addEventListener("click", async () => {

          if (selectedStars === 0) {
            alert("Lütfen bir puan seç.");
            return;
          }

          const result = await armusAddReview({
            bookingId: booking.id,
            teacherId: booking.teacherId,
            studentId: session.id,
            studentName: session.name,
            stars: selectedStars,
            text: textarea.value.trim(),
          });

          if (result === false) {
            alert("Değerlendirme kaydedilemedi.");
            return;
          }

          const replacement = await buildReviewBlock(booking);
          wrap.replaceWith(replacement);
        });

        return wrap;
      }

      const ownDisputes = await armusGetOwnDisputes(session.id);
      const disputeByBooking = new Map(ownDisputes.filter(d => d.booking_id).map(d => [d.booking_id, d]));

      const DISPUTE_SUBJECTS = [
        "Öğretmen derse gelmedi",
        "Ders kalitesiyle ilgili bir sorun",
        "İletişim / uygunsuz davranış",
        "Ödeme ile ilgili bir sorun",
        "Diğer",
      ];
      const DISPUTE_STATUS_LABELS = { open: "Bildirdin, inceleniyor", in_progress: "İnceleniyor", resolved: "Çözüldü" };

      function buildDisputeBlock(booking) {

        const wrap = document.createElement("div");
        wrap.className = "dispute-block";

        const existing = disputeByBooking.get(booking.id);

        if (existing) {
          wrap.innerHTML = `
            <div class="submitted-dispute">
              <span class="dispute-status">⚑ ${DISPUTE_STATUS_LABELS[existing.status] || existing.status}</span>
              <p>${existing.subject}</p>
            </div>
          `;
          return wrap;
        }

        wrap.innerHTML = `
          <button type="button" class="dispute-prompt-btn">⚑ Bir sorun bildir</button>
          <div class="dispute-form">
            <select>
              ${DISPUTE_SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>
            <textarea placeholder="Ne oldu, kısaca anlat..."></textarea>
            <button type="button" class="dispute-submit-btn">Gönder</button>
          </div>
        `;

        const promptBtn = wrap.querySelector(".dispute-prompt-btn");
        const form = wrap.querySelector(".dispute-form");
        const select = wrap.querySelector("select");
        const textarea = wrap.querySelector("textarea");
        const submitBtn = wrap.querySelector(".dispute-submit-btn");

        promptBtn.addEventListener("click", () => {
          promptBtn.style.display = "none";
          form.style.display = "block";
        });

        submitBtn.addEventListener("click", async () => {

          const description = textarea.value.trim();
          if (!description) {
            alert("Lütfen ne olduğunu kısaca yaz.");
            return;
          }

          submitBtn.disabled = true;

          const created = await armusCreateDispute({
            bookingId: booking.id,
            reporterId: session.id,
            reporterName: session.name,
            reporterRole: "student",
            otherPartyName: booking.teacherName,
            subject: select.value,
            description,
          });

          if (!created) {
            alert("Bildirilemedi. Lütfen tekrar dene.");
            submitBtn.disabled = false;
            return;
          }

          disputeByBooking.set(booking.id, created);
          wrap.replaceWith(buildDisputeBlock(booking));
        });

        return wrap;
      }

      if (bookings.length === 0) {

        empty.style.display = "block";

      } else {

        const todayKey = new Date().toISOString().slice(0, 10);

        for (const booking of bookings) {

          const teacher = await armusFindMarketplaceTeacher(booking.teacherId);
          const isPast = booking.date < todayKey;
          const isCancelled = booking.status === "cancelled";
          const avatarInner = teacher
            ? (teacher.photo ? `<img src="${teacher.photo}" alt="">` : teacher.initials)
            : "?";

          const card = document.createElement("div");
          card.className = "lesson-card" + (isPast ? " lesson-past" : "") + (isCancelled ? " lesson-cancelled" : "");

          card.innerHTML = `
            <div class="lesson-row">
              <div class="avatar">${avatarInner}</div>
              <div class="lesson-info">
                <div class="lesson-teacher">
                  ${booking.teacherName}
                  <span class="lesson-type">${booking.type === "trial" ? "Deneme Dersi" : "Ders"}</span>
                </div>
                <div class="lesson-meta">₺${booking.price} / 50 dakika${isPast ? " · geçti" : ""}</div>
              </div>
              <div class="lesson-when">
                <div class="lesson-date">${booking.dateLabel}</div>
                <div class="lesson-time">${armusFormatTimeRange(booking.time)}</div>
              </div>
            </div>
            ${isCancelled ? `
              <div class="lesson-cancel-badge">
                ⊘ İptal edildi${booking.refunded ? " · Tutar cüzdanına eklendi" : (booking.cancelledBy === "student" ? " · Ücret iade edilmedi" : "")}
              </div>
            ` : (!isPast && (armusCanJoinLessonNow(booking) || booking.date === todayKey)) ? `
              <div class="lesson-join">
                ${armusCanJoinLessonNow(booking)
                  ? `<a class="join-btn" href="class.html?booking=${booking.id}">🎥 Derse Katıl</a>`
                  : `<span class="join-hint">Ders saatinde bu kart üzerinden odaya katılabileceksin.</span>`}
              </div>
            ` : ""}
          `;

          let disputeBlock = null;

          if (!isCancelled && !isPast) {

            const lessonStart = new Date(`${booking.date}T${booking.time}:00`);
            const hoursUntil = (lessonStart - new Date()) / 3_600_000;
            const refundHint = hoursUntil >= 4
              ? "Ücretin tamamı cüzdanına eklenir"
              : "Derse 4 saatten az kaldığı için ücret eklenmez";

            const cancelWrap = document.createElement("div");
            cancelWrap.className = "lesson-cancel-wrap";
            cancelWrap.innerHTML = `
              <button type="button" class="lesson-cancel-btn">Dersi İptal Et</button>
              <span class="lesson-cancel-hint">${refundHint}</span>
            `;

            cancelWrap.querySelector(".lesson-cancel-btn").addEventListener("click", async () => {

              if (!confirm(`${booking.teacherName} ile ${booking.dateLabel}, ${armusFormatTimeRange(booking.time)} dersini iptal etmek istediğine emin misin?`)) return;

              const btn = cancelWrap.querySelector(".lesson-cancel-btn");
              btn.disabled = true;
              btn.textContent = "İptal ediliyor...";

              const result = await armusCancelBooking(booking.id);

              if (!result.ok) {
                alert(result.error);
                btn.disabled = false;
                btn.textContent = "Dersi İptal Et";
                return;
              }

              cancelWrap.outerHTML = `
                <div class="lesson-cancel-badge">
                  ⊘ İptal edildi${result.refunded ? " · Tutar cüzdanına eklendi" : " · Ücret iade edilmedi"}
                </div>
              `;
              if (disputeBlock) disputeBlock.remove();
            });

            card.appendChild(cancelWrap);
          }

          if (isPast) {
            card.appendChild(await buildReviewBlock(booking));
          }
          if (!isCancelled) {
            disputeBlock = buildDisputeBlock(booking);
            card.appendChild(disputeBlock);
          }

          list.appendChild(card);
        }
      }
    }

    })();

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
