<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Derslerim | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css?v=4">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(760px, calc(100% - 40px));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(760px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
      font-weight: 700;
    }

    .nav-greeting {
      font-size: 13px;
      color: var(--armus-muted);
      margin-right: 4px;
    }

    .nav-greeting small {
      color: var(--armus-muted);
    }

    .nav-utility {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-toggle {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: var(--armus-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 12.5px Inter, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--armus-border);
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .help-btn:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn svg {
      width: 17px;
      height: 17px;
    }

    /* GATE */

    .gate {
      display: none;
      padding: 100px 0;
      text-align: center;
    }

    .gate h1 {
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .gate p {
      color: var(--armus-muted);
      font-size: 14px;
      margin-bottom: 26px;
    }

    .gate-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* PAGE */

    main.container {
      padding: 45px 0 90px;
      display: none;
    }

    .eyebrow {
      color: var(--armus-muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 34px);
      letter-spacing: -1.2px;
      margin-bottom: 30px;
    }

    /* LESSON CARD */

    .lesson-card {
      padding: 18px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .lesson-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .lesson-join {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }

    .join-hint {
      color: var(--armus-muted);
      font-size: 12.5px;
    }

    .lesson-cancel-wrap {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lesson-cancel-btn {
      border: 1px solid rgba(220, 90, 90, .4);
      background: transparent;
      color: #b3261e;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .lesson-cancel-btn:hover {
      background: rgba(220, 90, 90, .08);
    }

    .lesson-cancel-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .lesson-cancel-hint {
      color: var(--armus-faint);
      font-size: 11.5px;
    }

    .lesson-cancel-badge {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
      color: var(--armus-muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    .lesson-cancelled {
      opacity: .6;
    }

    .review-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .review-prompt-btn {
      border: 1px solid var(--armus-gold-2);
      color: var(--armus-gold-text);
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .review-form {
      display: none;
      margin-top: 14px;
    }

    .star-picker {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 24px;
    }

    .star-picker span {
      cursor: pointer;
      color: var(--armus-border);
    }

    .star-picker span.active {
      color: var(--armus-gold-2);
    }

    .review-form textarea {
      width: 100%;
      min-height: 80px;
      background: var(--armus-bg);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 10px;
    }

    .review-submit-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .submitted-review {
      color: var(--armus-muted);
      font-size: 13px;
    }

    .submitted-review .stars {
      color: var(--armus-gold-text);
      margin-bottom: 6px;
      display: block;
    }

    .dispute-block {
      margin-top: 12px;
    }

    .dispute-prompt-btn {
      border: 1px solid rgba(220, 90, 90, .5);
      color: #b3261e;
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .dispute-form {
      display: none;
      margin-top: 14px;
    }

    .dispute-form select,
    .dispute-form textarea {
      width: 100%;
      background: var(--armus-bg);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .dispute-form textarea {
      min-height: 70px;
      resize: vertical;
    }

    .dispute-submit-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: rgba(220, 90, 90, .85);
      color: var(--armus-ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .submitted-dispute {
      color: var(--armus-muted);
      font-size: 13px;
    }

    .submitted-dispute .dispute-status {
      color: #b3261e;
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    .avatar {
      width: 54px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-teacher {
      font-weight: 700;
      font-size: 15px;
    }

    .lesson-meta {
      color: var(--armus-muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .lesson-type {
      display: inline-block;
      border: 1px solid var(--armus-silver-border-strong);
      color: var(--armus-silver-1);
      font-size: 10px;
      border-radius: 999px;
      padding: 3px 9px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .lesson-when {
      text-align: right;
    }

    .lesson-date {
      font-weight: 700;
      font-size: 14px;
    }

    .lesson-time {
      color: var(--armus-gold-text);
      font-size: 13px;
      margin-top: 3px;
    }

    .lesson-past .lesson-row {
      opacity: 0.55;
    }

    /* EMPTY STATE */

    .empty-state {
      display: none;
      padding: 60px 0;
      text-align: center;
      border: 1px dashed var(--armus-border);
      border-radius: 20px;
    }

    .empty-state p {
      color: var(--armus-muted);
      font-size: 14px;
      margin-bottom: 22px;
    }

    @media (max-width: 560px) {
      .nav-greeting {
        display: none;
      }

      .nav-buttons {
        gap: 6px;
      }

      .nav-buttons .btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .logo {
        font-size: 24px;
      }

      .nav-utility {
        gap: 6px;
      }

      .help-btn {
        display: none;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
      <div class="nav-utility">
        <button type="button" class="lang-toggle" data-lang-toggle title="Dili değiştir / Change language">EN</button>
        <a class="help-btn" href="sss.html" title="Yardım Merkezi" aria-label="Yardım Merkezi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </a>
      </div>
      <div class="nav-buttons" id="navAuthButtons"></div>
    </div>
  </nav>

  <div class="container">
    <div class="gate" id="gate">
      <h1 data-i18n="myLessons.gateTitle">Derslerini görmek için giriş yap</h1>
      <p data-i18n="myLessons.gateText">Rezervasyonlarını görebilmek için önce bir hesabın olması gerekiyor.</p>
      <div class="gate-actions">
        <a class="btn" href="login.html?next=my-lessons.html" data-i18n="nav.login">Giriş Yap</a>
        <a class="btn btn-light" href="register.html?next=my-lessons.html" data-i18n="nav.register">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <main class="container" id="pageRoot">

    <div class="eyebrow" data-i18n="myLessons.eyebrow">DERSLERİM</div>
    <h1 data-i18n="myLessons.title">Rezervasyonların</h1>

    <div id="lessonsList"></div>

    <div class="empty-state" id="emptyState">
      <p data-i18n="myLessons.emptyText">Henüz bir dersin yok.</p>
      <a class="btn btn-light" href="teachers.html" data-i18n="myLessons.emptyCta">Öğretmen bul →</a>
    </div>

  </main>

  <script src="i18n.js?v=4"></script>
  <script src="teachers-data.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=4"></script>
  <script src="site-settings.js?v=4"></script>
  <script src="auth.js?v=5"></script>
  <script src="bookings.js?v=5"></script>
  <script src="reviews.js?v=5"></script>
  <script src="marketplace.js?v=5"></script>
  <script src="disputes.js?v=4"></script>
  <script>

    const gate = document.getElementById("gate");
    const pageRoot = document.getElementById("pageRoot");

    (async function() {

    const session = await armusGetSession();

    if (!session) {

      gate.style.display = "block";

    } else {

      pageRoot.style.display = "block";

      const bookings = await armusGetBookingsForStudent(session.id);
      const list = document.getElementById("lessonsList");
      const empty = document.getElementById("emptyState");

      async function buildReviewBlock(booking) {

        const wrap = document.createElement("div");
        wrap.className = "review-block";

        const existing = await armusGetReviewForBooking(booking.id).catch(() => null);

        if (existing) {

          wrap.innerHTML = `
            <div class="submitted-review">
              <span class="stars">${"★".repeat(existing.stars)}${"☆".repeat(5 - existing.stars)} ${armusT("myLessons.reviewed", "Değerlendirdin")}</span>
              ${existing.text ? `<p>${armusEscapeHtml(existing.text)}</p>` : ""}
            </div>
          `;

          return wrap;
        }

        let selectedStars = 0;

        wrap.innerHTML = `
          <button type="button" class="review-prompt-btn">${armusT("myLessons.reviewPromptBtn", "★ Bu dersi değerlendir")}</button>
          <div class="review-form">
            <div class="star-picker">
              ${[1, 2, 3, 4, 5].map(n => `<span data-star="${n}">★</span>`).join("")}
            </div>
            <textarea placeholder="${armusEscapeHtml(armusT("myLessons.reviewPlaceholder", "{name} ile dersin nasıldı?").replace("{name}", armusShortDisplayName(booking.teacherName)))}"></textarea>
            <button type="button" class="review-submit-btn">${armusT("contact.submit", "Gönder")}</button>
          </div>
        `;

        const promptBtn = wrap.querySelector(".review-prompt-btn");
        const form = wrap.querySelector(".review-form");
        const stars = wrap.querySelectorAll(".star-picker span");
        const textarea = wrap.querySelector("textarea");
        const submitBtn = wrap.querySelector(".review-submit-btn");

        promptBtn.addEventListener("click", () => {
          promptBtn.style.display = "none";
          form.style.display = "block";
        });

        stars.forEach(star => {
          star.addEventListener("click", () => {
            selectedStars = Number(star.dataset.star);
            stars.forEach(s => s.classList.toggle("active", Number(s.dataset.star) <= selectedStars));
          });
        });

        submitBtn.addEventListener("click", async () => {

          if (selectedStars === 0) {
            alert(armusT("myLessons.starAlert", "Lütfen bir puan seç."));
            return;
          }

          const result = await armusAddReview({
            bookingId: booking.id,
            teacherId: booking.teacherId,
            studentId: session.id,
            studentName: session.name,
            stars: selectedStars,
            text: textarea.value.trim(),
          });

          if (result === false) {
            alert(armusT("myLessons.reviewFailedAlert", "Değerlendirme kaydedilemedi."));
            return;
          }

          const replacement = await buildReviewBlock(booking);
          wrap.replaceWith(replacement);
        });

        return wrap;
      }

      const ownDisputes = await armusGetOwnDisputes(session.id).catch(() => []);
      const disputeByBooking = new Map(ownDisputes.filter(d => d.booking_id).map(d => [d.booking_id, d]));

      function disputeSubjects() {
        return [
          armusT("myLessons.disputeSubject1", "Öğretmen derse gelmedi"),
          armusT("myLessons.disputeSubject2", "Ders kalitesiyle ilgili bir sorun"),
          armusT("myLessons.disputeSubject3", "İletişim / uygunsuz davranış"),
          armusT("myLessons.disputeSubject4", "Ödeme ile ilgili bir sorun"),
          armusT("myLessons.disputeSubject5", "Diğer"),
        ];
      }
      function disputeStatusLabels() {
        return {
          open: armusT("myLessons.disputeStatusOpen", "Bildirdin, inceleniyor"),
          in_progress: armusT("myLessons.disputeStatusInProgress", "İnceleniyor"),
          resolved: armusT("myLessons.disputeStatusResolved", "Çözüldü"),
        };
      }

      function buildDisputeBlock(booking) {

        const wrap = document.createElement("div");
        wrap.className = "dispute-block";

        const existing = disputeByBooking.get(booking.id);

        if (existing) {
          wrap.innerHTML = `
            <div class="submitted-dispute">
              <span class="dispute-status">⚑ ${disputeStatusLabels()[existing.status] || existing.status}</span>
              <p>${armusEscapeHtml(existing.subject)}</p>
            </div>
          `;
          return wrap;
        }

        wrap.innerHTML = `
          <button type="button" class="dispute-prompt-btn">${armusT("myLessons.reportPromptBtn", "⚑ Bir sorun bildir")}</button>
          <div class="dispute-form">
            <select>
              ${disputeSubjects().map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>
            <textarea placeholder="${armusT("myLessons.disputePlaceholder", "Ne oldu, kısaca anlat...")}"></textarea>
            <button type="button" class="dispute-submit-btn">${armusT("contact.submit", "Gönder")}</button>
          </div>
        `;

        const promptBtn = wrap.querySelector(".dispute-prompt-btn");
        const form = wrap.querySelector(".dispute-form");
        const select = wrap.querySelector("select");
        const textarea = wrap.querySelector("textarea");
        const submitBtn = wrap.querySelector(".dispute-submit-btn");

        promptBtn.addEventListener("click", () => {
          promptBtn.style.display = "none";
          form.style.display = "block";
        });

        submitBtn.addEventListener("click", async () => {

          const description = textarea.value.trim();
          if (!description) {
            alert(armusT("myLessons.disputeAlert", "Lütfen ne olduğunu kısaca yaz."));
            return;
          }

          submitBtn.disabled = true;

          const created = await armusCreateDispute({
            bookingId: booking.id,
            reporterId: session.id,
            reporterName: session.name,
            reporterRole: "student",
            otherPartyName: booking.teacherName,
            subject: select.value,
            description,
          });

          if (!created) {
            alert(armusT("myLessons.disputeFailedAlert", "Bildirilemedi. Lütfen tekrar dene."));
            submitBtn.disabled = false;
            return;
          }

          disputeByBooking.set(booking.id, created);
          wrap.replaceWith(buildDisputeBlock(booking));
        });

        return wrap;
      }

      async function renderLessons() {

        list.innerHTML = "";

        if (bookings.length === 0) {

          empty.style.display = "block";

        } else {

          empty.style.display = "none";

          const todayKey = new Date().toISOString().slice(0, 10);

          for (const booking of bookings) {

            const teacher = await armusFindMarketplaceTeacher(booking.teacherId, session.id).catch(() => null);
            // armusIsBookingPast compares the lesson's real, timezone-aware
            // end time against now - not booking.date (wall-clock in the
            // TEACHER's own zone) against todayKey (a date in UTC), which
            // could disagree by a day depending on the teacher/viewer's
            // actual locations and time of day.
            const isPast = armusIsBookingPast(booking);
            const isCancelled = booking.status === "cancelled";
            const avatarInner = teacher
              ? (armusSafeUrl(teacher.photo) ? `<img src="${armusSafeUrl(teacher.photo)}" alt="">` : armusEscapeHtml(teacher.initials))
              : "?";
            // shown in the viewer's own current local time, not the
            // teacher's - see armusFormatLessonWhen (migration_37.sql)
            const when = armusFormatLessonWhen(booking);

            const card = document.createElement("div");
            card.className = "lesson-card" + (isPast ? " lesson-past" : "") + (isCancelled ? " lesson-cancelled" : "");

            card.innerHTML = `
              <div class="lesson-row">
                <div class="avatar">${avatarInner}</div>
                <div class="lesson-info">
                  <div class="lesson-teacher">
                    ${armusEscapeHtml(armusShortDisplayName(booking.teacherName))}
                    <span class="lesson-type">${booking.type === "trial" ? armusT("myLessons.trial", "Deneme Dersi") : armusT("myLessons.lesson", "Ders")}</span>
                  </div>
                  <div class="lesson-meta">₺${booking.price} ${armusT("booking.perLesson", "/ 50 dakika")}${isPast ? armusT("myLessons.pastSuffix", " · geçti") : ""}</div>
                </div>
                <div class="lesson-when">
                  <div class="lesson-date">${when.dateLabel}</div>
                  <div class="lesson-time">${when.timeRange}</div>
                </div>
              </div>
              ${isCancelled ? `
                <div class="lesson-cancel-badge">
                  ${armusT("myLessons.cancelled", "⊘ İptal edildi")}${booking.refunded ? armusT("myLessons.creditAdded", " · Ders hakkın eklendi") : (booking.cancelledBy === "student" ? armusT("myLessons.creditNotAdded", " · Ders hakkı eklenmedi") : "")}
                </div>
              ` : (!isPast && (armusCanJoinLessonNow(booking) || booking.date === todayKey)) ? `
                <div class="lesson-join">
                  ${armusCanJoinLessonNow(booking)
                    ? `<a class="join-btn" href="class.html?booking=${booking.id}">${armusT("myLessons.joinBtn", "🎥 Derse Katıl")}</a>`
                    : `<span class="join-hint">${armusT("myLessons.joinHint", "Ders saatinde bu kart üzerinden odaya katılabileceksin.")}</span>`}
                </div>
              ` : ""}
            `;

            let disputeBlock = null;

            if (!isCancelled && !isPast) {

              const hoursUntil = (armusLessonWindow(booking).start - new Date()) / 3_600_000;
              const refundHint = hoursUntil >= 4
                ? armusT("myLessons.refundHintYes", "İptal edersen bu öğretmenle (veya bir deneme dersi için başka biriyle) kullanabileceğin bir ders hakkı kazanırsın")
                : armusT("myLessons.refundHintNo", "Derse 4 saatten az kaldığı için ders hakkı kazanılmaz");

              const cancelWrap = document.createElement("div");
              cancelWrap.className = "lesson-cancel-wrap";
              cancelWrap.innerHTML = `
                <button type="button" class="lesson-cancel-btn">${armusT("myLessons.cancelBtn", "Dersi İptal Et")}</button>
                <span class="lesson-cancel-hint">${refundHint}</span>
              `;

              cancelWrap.querySelector(".lesson-cancel-btn").addEventListener("click", async () => {

                const confirmMsg = armusT("myLessons.cancelConfirm", "{name} ile {date}, {time} dersini iptal etmek istediğine emin misin?")
                  .replace("{name}", armusShortDisplayName(booking.teacherName))
                  .replace("{date}", when.dateLabel)
                  .replace("{time}", when.timeRange);
                if (!confirm(confirmMsg)) return;

                const btn = cancelWrap.querySelector(".lesson-cancel-btn");
                btn.disabled = true;
                btn.textContent = armusT("myLessons.cancelling", "İptal ediliyor...");

                const result = await armusCancelBooking(booking.id);

                if (!result.ok) {
                  alert(result.error);
                  btn.disabled = false;
                  btn.textContent = armusT("myLessons.cancelBtn", "Dersi İptal Et");
                  return;
                }

                cancelWrap.outerHTML = `
                  <div class="lesson-cancel-badge">
                    ${armusT("myLessons.cancelled", "⊘ İptal edildi")}${result.refunded ? armusT("myLessons.creditAdded", " · Ders hakkın eklendi") : armusT("myLessons.creditNotAdded", " · Ders hakkı eklenmedi")}
                  </div>
                `;
                if (disputeBlock) disputeBlock.remove();
              });

              card.appendChild(cancelWrap);
            }

            if (isPast) {
              card.appendChild(await buildReviewBlock(booking));
            }
            if (!isCancelled) {
              disputeBlock = buildDisputeBlock(booking);
              card.appendChild(disputeBlock);
            }

            list.appendChild(card);
          }
        }
      }

      await renderLessons();
      document.addEventListener("armus:langchange", renderLessons);
    }

    })();

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
