<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Derslerim | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: #f4f4f2;
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(760px, calc(100% - 40px));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(760px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
      font-weight: 700;
    }

    .nav-greeting {
      font-size: 13px;
      color: #c7c7c7;
      margin-right: 4px;
    }

    .nav-greeting small {
      color: #8f8f8f;
    }

    /* GATE */

    .gate {
      display: none;
      padding: 100px 0;
      text-align: center;
    }

    .gate h1 {
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .gate p {
      color: #99999c;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .gate-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* PAGE */

    main.container {
      padding: 45px 0 90px;
      display: none;
    }

    .eyebrow {
      color: #99999c;
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 34px);
      letter-spacing: -1.2px;
      margin-bottom: 30px;
    }

    /* LESSON CARD */

    .lesson-card {
      padding: 18px;
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .lesson-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .review-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .review-prompt-btn {
      border: 1px solid var(--armus-gold-2);
      color: var(--armus-gold-text);
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .review-form {
      display: none;
      margin-top: 14px;
    }

    .star-picker {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 24px;
    }

    .star-picker span {
      cursor: pointer;
      color: #45403a;
    }

    .star-picker span.active {
      color: var(--armus-gold-2);
    }

    .review-form textarea {
      width: 100%;
      min-height: 80px;
      background: var(--armus-bg);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: white;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 10px;
    }

    .review-submit-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .submitted-review {
      color: #c3c3c5;
      font-size: 13px;
    }

    .submitted-review .stars {
      color: var(--armus-gold-text);
      margin-bottom: 6px;
      display: block;
    }

    .avatar {
      width: 54px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-teacher {
      font-weight: 700;
      font-size: 15px;
    }

    .lesson-meta {
      color: #8e8e91;
      font-size: 12px;
      margin-top: 3px;
    }

    .lesson-type {
      display: inline-block;
      border: 1px solid var(--armus-silver-border-strong);
      color: var(--armus-silver-1);
      font-size: 10px;
      border-radius: 999px;
      padding: 3px 9px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .lesson-when {
      text-align: right;
    }

    .lesson-date {
      font-weight: 700;
      font-size: 14px;
    }

    .lesson-time {
      color: var(--armus-gold-text);
      font-size: 13px;
      margin-top: 3px;
    }

    .lesson-past .lesson-row {
      opacity: 0.55;
    }

    /* EMPTY STATE */

    .empty-state {
      display: none;
      padding: 60px 0;
      text-align: center;
      border: 1px dashed var(--armus-border);
      border-radius: 20px;
    }

    .empty-state p {
      color: #99999c;
      font-size: 14px;
      margin-bottom: 22px;
    }

    @media (max-width: 560px) {
      .nav-greeting {
        display: none;
      }

      .nav-buttons {
        gap: 6px;
      }

      .nav-buttons .btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .logo {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">ARMUS</a>
      <div class="nav-buttons" id="navAuthButtons"></div>
    </div>
  </nav>

  <div class="container">
    <div class="gate" id="gate">
      <h1>Derslerini görmek için giriş yap</h1>
      <p>Rezervasyonlarını görebilmek için önce bir hesabın olması gerekiyor.</p>
      <div class="gate-actions">
        <a class="btn" href="login.html?next=my-lessons.html">Giriş Yap</a>
        <a class="btn btn-light" href="register.html?next=my-lessons.html">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <main class="container" id="pageRoot">

    <div class="eyebrow">DERSLERİM</div>
    <h1>Rezervasyonların</h1>

    <div id="lessonsList"></div>

    <div class="empty-state" id="emptyState">
      <p>Henüz bir dersin yok.</p>
      <a class="btn btn-light" href="teachers.html">Öğretmen bul →</a>
    </div>

  </main>

  <script src="teachers-data.js"></script>
  <script src="auth.js"></script>
  <script src="bookings.js"></script>
  <script src="reviews.js"></script>
  <script src="marketplace.js"></script>
  <script>

    const session = armusGetSession();
    const gate = document.getElementById("gate");
    const pageRoot = document.getElementById("pageRoot");

    if (!session) {

      gate.style.display = "block";

    } else {

      pageRoot.style.display = "block";

      const bookings = armusGetBookingsForStudent(session.email);
      const list = document.getElementById("lessonsList");
      const empty = document.getElementById("emptyState");

      function buildReviewBlock(booking) {

        const wrap = document.createElement("div");
        wrap.className = "review-block";

        const existing = armusGetReviews().find(r => r.bookingId === booking.id);

        if (existing) {

          wrap.innerHTML = `
            <div class="submitted-review">
              <span class="stars">${"★".repeat(existing.stars)}${"☆".repeat(5 - existing.stars)} Değerlendirdin</span>
              ${existing.text ? `<p>${existing.text}</p>` : ""}
            </div>
          `;

          return wrap;
        }

        let selectedStars = 0;

        wrap.innerHTML = `
          <button type="button" class="review-prompt-btn">★ Bu dersi değerlendir</button>
          <div class="review-form">
            <div class="star-picker">
              ${[1, 2, 3, 4, 5].map(n => `<span data-star="${n}">★</span>`).join("")}
            </div>
            <textarea placeholder="${booking.teacherName} ile dersin nasıldı?"></textarea>
            <button type="button" class="review-submit-btn">Gönder</button>
          </div>
        `;

        const promptBtn = wrap.querySelector(".review-prompt-btn");
        const form = wrap.querySelector(".review-form");
        const stars = wrap.querySelectorAll(".star-picker span");
        const textarea = wrap.querySelector("textarea");
        const submitBtn = wrap.querySelector(".review-submit-btn");

        promptBtn.addEventListener("click", () => {
          promptBtn.style.display = "none";
          form.style.display = "block";
        });

        stars.forEach(star => {
          star.addEventListener("click", () => {
            selectedStars = Number(star.dataset.star);
            stars.forEach(s => s.classList.toggle("active", Number(s.dataset.star) <= selectedStars));
          });
        });

        submitBtn.addEventListener("click", () => {

          if (selectedStars === 0) {
            alert("Lütfen bir puan seç.");
            return;
          }

          const result = armusAddReview({
            bookingId: booking.id,
            teacherId: booking.teacherId,
            studentName: session.name,
            studentEmail: session.email,
            stars: selectedStars,
            text: textarea.value.trim(),
          });

          if (result === false) {
            alert("Değerlendirme kaydedilemedi (tarayıcı hafızası dolu).");
            return;
          }

          const replacement = buildReviewBlock(booking);
          wrap.replaceWith(replacement);
        });

        return wrap;
      }

      if (bookings.length === 0) {

        empty.style.display = "block";

      } else {

        const todayKey = new Date().toISOString().slice(0, 10);

        bookings.forEach(booking => {

          const teacher = armusFindMarketplaceTeacher(booking.teacherId);
          const isPast = booking.date < todayKey;
          const avatarInner = teacher
            ? (teacher.photo ? `<img src="${teacher.photo}" alt="">` : teacher.initials)
            : "?";

          const card = document.createElement("div");
          card.className = "lesson-card" + (isPast ? " lesson-past" : "");

          card.innerHTML = `
            <div class="lesson-row">
              <div class="avatar">${avatarInner}</div>
              <div class="lesson-info">
                <div class="lesson-teacher">
                  ${booking.teacherName}
                  <span class="lesson-type">${booking.type === "trial" ? "Deneme Dersi" : "Ders"}</span>
                </div>
                <div class="lesson-meta">₺${booking.price} / 50 dakika${isPast ? " · geçti" : ""}</div>
              </div>
              <div class="lesson-when">
                <div class="lesson-date">${booking.dateLabel}</div>
                <div class="lesson-time">${armusFormatTimeRange(booking.time)}</div>
              </div>
            </div>
          `;

          if (isPast) {
            card.appendChild(buildReviewBlock(booking));
          }

          list.appendChild(card);
        });
      }
    }

  </script>

</body>
</html>
