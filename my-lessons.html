<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <script>if("scrollRestoration" in history){history.scrollRestoration="manual";}</script>
  <script>(function(){try{if(sessionStorage.getItem("armusLogoPlayed")){document.documentElement.classList.add("armus-logo-static");}else{sessionStorage.setItem("armusLogoPlayed","1");}}catch(e){}})();</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Derslerim | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css?v=10">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(760px, calc(100% - 40px));
      margin: auto;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(940px, calc(100% - 40px));
      margin: auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-find-tutor {
      font-size: 14px;
      font-weight: 600;
      color: var(--armus-muted);
      text-decoration: none;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
      flex-shrink: 0;
      transition: 0.2s;
    }

    .nav-find-tutor:hover {
      color: var(--armus-ink);
      border-bottom-color: var(--armus-gold-2);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* .btn/.btn-light/.nav-greeting: canonical shared definition now
       lives in theme.css (every page loads it) instead of being
       redefined here. */

    .nav-utility {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .lang-toggle {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: var(--armus-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: 700 12.5px Inter, sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-toggle:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--armus-border);
      color: var(--armus-muted);
      flex-shrink: 0;
    }

    .help-btn:hover {
      border-color: var(--armus-gold-2);
      color: var(--armus-gold-text);
    }

    .help-btn svg {
      width: 17px;
      height: 17px;
    }

    /* GATE */

    .gate {
      display: none;
      padding: 100px 0;
      text-align: center;
    }

    .gate h1 {
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }

    .gate p {
      color: var(--armus-muted);
      font-size: 14px;
      margin-bottom: 26px;
    }

    .gate-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* PAGE */

    main.container {
      padding: 45px 0 90px;
      display: none;
    }

    .eyebrow {
      color: var(--armus-muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 34px);
      letter-spacing: -0.3px;
      margin-bottom: 30px;
    }

    .lessons-section-title {
      color: var(--armus-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin: 26px 0 12px;
    }

    .lessons-section-title:first-child {
      margin-top: 0;
    }

    /* PACKAGE LESSONS WHOSE TEACHER CAN'T TEACH THIS STUDENT ANYMORE
       (migration_110.sql) - refund or move them */

    .package-notice {
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 18px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-gold-2);
    }

    .package-notice h3 {
      font-size: 14px;
      margin: 0 0 6px;
      text-wrap: balance;
    }

    .package-notice p {
      color: var(--armus-muted);
      font-size: 12.5px;
      line-height: 1.6;
      margin: 0;
    }

    .package-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .package-transfer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .package-transfer select {
      font-family: inherit;
      font-size: 13px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--armus-border);
      background: var(--armus-panel);
      color: var(--armus-ink);
      max-width: 100%;
    }

    .package-status {
      margin-top: 10px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--armus-gold-text);
    }

    .package-status.error {
      color: #b3261e;
    }

    /* ACCOUNT NOTICE, CREDITS, PACKAGE WITHDRAWAL, STUCK CREDITS
       (migration_112.sql) */

    .account-notice {
      padding: 14px 16px;
      margin-bottom: 14px;
      border-radius: 14px;
      border: 1px solid rgba(220, 90, 90, .35);
      background: rgba(220, 90, 90, .06);
      color: #8f1f19;
      font-size: 13px;
      line-height: 1.55;
    }

    .credits-panel {
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 18px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border);
    }

    .credits-panel h3 {
      font-size: 14px;
      margin: 0 0 10px;
    }

    .credits-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .credits-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .credits-list .credit-expiry {
      color: var(--armus-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .credits-list .credit-expiry.soon {
      color: #b3261e;
      font-weight: 600;
    }

    .credits-hint {
      margin: 10px 0 0;
      color: var(--armus-faint);
      font-size: 11.5px;
      line-height: 1.5;
    }

    /* "DID THIS LESSON HAPPEN?" - attendance.js's shared flow */

    .checkin-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--armus-gold-2);
      background: var(--armus-panel);
    }

    .checkin-box h4 {
      margin: 0 0 4px;
      font-size: 13.5px;
    }

    .checkin-box p {
      margin: 0 0 10px;
      color: var(--armus-muted);
      font-size: 12.5px;
      line-height: 1.55;
    }

    .checkin-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .checkin-choice {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      border: 1px solid var(--armus-border);
      background: var(--armus-panel-2);
      color: inherit;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .checkin-choice:hover:not(:disabled) {
      border-color: var(--armus-gold-2);
    }

    .checkin-choice:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .checkin-choice svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #d9822b;
    }

    .checkin-input {
      width: 100%;
      max-width: 160px;
      box-sizing: border-box;
      border: 1px solid var(--armus-border);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      background: var(--armus-panel-2);
      color: inherit;
      margin-bottom: 10px;
    }

    .lesson-report-status {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--armus-border-soft);
      color: var(--armus-muted);
      font-size: 12.5px;
    }

    .lesson-report-status strong {
      color: var(--armus-ink);
    }

    .lesson-extra-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .text-link-btn {
      border: none;
      background: none;
      padding: 0;
      color: var(--armus-faint);
      font-family: inherit;
      font-size: 11.5px;
      text-decoration: underline;
      cursor: pointer;
    }

    .text-link-btn:hover {
      color: var(--armus-muted);
    }

    .lesson-card.is-target {
      border-color: var(--armus-gold-2);
      box-shadow: 0 0 0 3px rgba(224, 169, 22, .18);
    }

    /* LESSON CARD */

    .lesson-card {
      padding: 18px;
      background: var(--armus-panel-2);
      border: 1px solid var(--armus-border);
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .lesson-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Only a.lesson-row (teacher confirmed still visible in the
       marketplace - see the comment above the renderLessons loop) is
       ever a link; a plain div.lesson-row (teacher hidden/banned, or
       the lookup failed) stays inert, so this never promises a profile
       that isn't actually there. Kept visually identical at rest -
       the affordance only shows up on hover (gold ring on the avatar,
       a small arrow next to the name) rather than changing the card's
       resting appearance. */
    a.lesson-row {
      text-decoration: none;
      color: inherit;
      border-radius: 12px;
      padding: 6px;
      margin: -6px -6px 0;
      transition: background 0.15s ease;
    }

    a.lesson-row:hover {
      background: var(--armus-panel);
    }

    a.lesson-row:hover .avatar {
      box-shadow: 0 0 0 3px var(--armus-gold-2);
    }

    a.lesson-row:hover .lesson-teacher-name {
      color: var(--armus-gold-text);
    }

    .go-arrow {
      opacity: 0;
      transform: translateX(-4px);
      transition: 0.15s ease;
      color: var(--armus-gold-text);
      font-size: 16px;
      margin-left: 2px;
      display: inline-block;
    }

    a.lesson-row:hover .go-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .lesson-join {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }

    .join-hint {
      color: var(--armus-muted);
      font-size: 12.5px;
    }

    .lesson-reschedule-btn {
      border: 1px solid var(--armus-border);
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .lesson-reschedule-btn.primary {
      border-color: transparent;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
    }

    .lesson-reschedule-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .lesson-reschedule {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--armus-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .lesson-reschedule-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lesson-cancel-wrap {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lesson-cancel-btn {
      border: 1px solid rgba(220, 90, 90, .4);
      background: transparent;
      color: #b3261e;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .lesson-cancel-btn:hover {
      background: rgba(220, 90, 90, .08);
    }

    .lesson-cancel-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .lesson-cancel-hint {
      color: var(--armus-faint);
      font-size: 11.5px;
    }

    .lesson-cancel-badge {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--armus-border-soft);
      color: var(--armus-muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    .lesson-cancelled {
      opacity: .6;
    }

    .review-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--armus-border-soft);
    }

    .review-prompt-btn {
      border: 1px solid var(--armus-gold-2);
      color: var(--armus-gold-text);
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .review-form {
      display: none;
      margin-top: 14px;
    }

    .star-picker {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 24px;
    }

    .star-picker span {
      cursor: pointer;
      color: var(--armus-border);
    }

    .star-picker span.active {
      color: var(--armus-gold-2);
    }

    .review-form textarea {
      width: 100%;
      min-height: 80px;
      background: var(--armus-bg);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 10px;
    }

    .review-submit-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .submitted-review {
      color: var(--armus-muted);
      font-size: 13px;
    }

    .submitted-review .stars {
      color: var(--armus-gold-text);
      margin-bottom: 6px;
      display: block;
    }

    .dispute-block {
      margin-top: 12px;
    }

    .dispute-prompt-btn {
      border: 1px solid rgba(220, 90, 90, .5);
      color: #b3261e;
      background: transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .dispute-form {
      display: none;
      margin-top: 14px;
    }

    .dispute-form select,
    .dispute-form textarea {
      width: 100%;
      background: var(--armus-bg);
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .dispute-form textarea {
      min-height: 70px;
      resize: vertical;
    }

    .dispute-submit-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      background: rgba(220, 90, 90, .85);
      color: var(--armus-ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .submitted-dispute {
      color: var(--armus-muted);
      font-size: 13px;
    }

    .submitted-dispute .dispute-status {
      color: #b3261e;
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    .avatar {
      width: 54px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--armus-silver-gradient);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      overflow: hidden;
      transition: box-shadow 0.15s ease;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-teacher {
      font-weight: 700;
      font-size: 15px;
    }

    .lesson-teacher-name {
      transition: color 0.15s ease;
    }

    .lesson-meta {
      color: var(--armus-muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .lesson-type {
      display: inline-block;
      background: var(--armus-ink);
      color: var(--armus-silver-1);
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 9px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .lesson-when {
      text-align: right;
    }

    .lesson-date {
      font-weight: 700;
      font-size: 14px;
    }

    .lesson-time {
      color: var(--armus-gold-text);
      font-size: 13px;
      margin-top: 3px;
    }

    .lesson-past .lesson-row {
      opacity: 0.55;
    }

    /* EMPTY STATE */

    .empty-state {
      display: none;
      padding: 60px 0;
      text-align: center;
      border: 1px dashed var(--armus-border);
      border-radius: 20px;
    }

    .empty-state p {
      color: var(--armus-muted);
      font-size: 14px;
      margin-bottom: 22px;
    }

    @media (max-width: 560px) {
      .nav-greeting {
        display: none;
      }

      .nav-buttons {
        gap: 6px;
      }

      .nav-buttons .btn {
        padding: 9px 12px;
        font-size: 12px;
      }

      .logo {
        font-size: 24px;
      }

      .nav-utility {
        gap: 6px;
      }

      .help-btn {
        display: none;
      }

    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
      <a href="teachers" class="nav-find-tutor" data-i18n="nav.findTutor">Öğretmen Bul</a>
      <div class="nav-utility">
        <button type="button" class="lang-toggle" data-lang-toggle title="Dili değiştir / Change language">EN</button>
        <a class="help-btn" href="sss" title="Yardım Merkezi" aria-label="Yardım Merkezi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </a>
      </div>
      <div class="nav-buttons" id="navAuthButtons"></div>
    </div>
  </nav>

  <div class="container">
    <div class="gate" id="gate">
      <h1 data-i18n="myLessons.gateTitle">Derslerini görmek için giriş yap</h1>
      <p data-i18n="myLessons.gateText">Rezervasyonlarını görebilmek için önce bir hesabın olması gerekiyor.</p>
      <div class="gate-actions">
        <a class="btn" href="login?next=my-lessons" data-i18n="nav.login">Giriş Yap</a>
        <a class="btn btn-light" href="register?next=my-lessons" data-i18n="nav.register">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <main class="container" id="pageRoot">

    <div class="eyebrow" data-i18n="myLessons.eyebrow">DERSLERİM</div>
    <h1 data-i18n="myLessons.title">Rezervasyonların</h1>

    <div id="accountNotice"></div>

    <div id="packageNotices"></div>

    <div id="creditsPanel"></div>

    <div id="lessonsList"></div>

    <div class="empty-state" id="emptyState">
      <p data-i18n="myLessons.emptyText">Henüz bir dersin yok.</p>
      <a class="btn btn-light" href="teachers" data-i18n="myLessons.emptyCta">Öğretmen bul →</a>
    </div>

  </main>

  <script src="i18n.js?v=35"></script>
  <script src="teachers-data.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=4"></script>
  <script src="site-settings.js?v=4"></script>
  <script src="auth.js?v=15"></script>
  <script src="bookings.js?v=12"></script>
  <script src="reschedule.js?v=1"></script>
  <script src="reviews.js?v=5"></script>
  <script src="marketplace.js?v=6"></script>
  <script src="disputes.js?v=4"></script>
  <script src="attendance.js?v=6"></script>
  <script>

    const gate = document.getElementById("gate");
    const pageRoot = document.getElementById("pageRoot");

    // Preply's "Cancelled and Paid" (migration_105.sql): the student
    // cancelled inside the 12-hour window, so nothing came back to them
    function lateCancelBadgeOr(isLateCancel, otherwiseHtml) {
      if (!isLateCancel) return otherwiseHtml;
      return `${armusT("myLessons.cancelledPaid", "⊘ İptal edildi ve ücretlendirildi")}${armusT("myLessons.cancelledPaidSuffix", " · derse 12 saatten az kala iptal edildiği için ders hakkı iade edilmedi")}`;
    }

    // migration_106.sql: an admin confirmed the teacher never showed up,
    // so the lesson was cancelled and given back to the student
    function teacherNoShowBadge(booking) {
      return `${armusT("myLessons.teacherNoShow", "⊘ Öğretmen derse gelmedi")}${booking.refunded ? armusT("myLessons.teacherNoShowRefunded", " · Ders hakkın iade edildi") : ""}`;
    }

    // migration_112.sql: an admin confirmed a technical problem on the
    // teacher's side cut the lesson short
    function technicalIssueBadge(booking) {
      return `${armusT("myLessons.technicalIssue", "⊘ Teknik sorun nedeniyle iptal edildi")}${booking.refunded ? armusT("myLessons.teacherNoShowRefunded", " · Ders hakkın iade edildi") : ""}`;
    }

    // migration_110.sql: package lessons whose teacher can't teach this
    // student anymore (banned, blocking them, account closed) - refund
    // them to the card or move them to another teacher (package-credits)
    const formatMoney = (amount) => `₺${Number(amount).toLocaleString(armusGetLang() === "en" ? "en-US" : "tr-TR", { maximumFractionDigits: 2 })}`;

    async function renderStrandedPackages(viewerId) {
      const wrap = document.getElementById("packageNotices");
      let groups = [];
      try {
        const { data } = await armusSupabase.rpc("my_stranded_package_credits");
        groups = data || [];
      } catch (err) {}
      wrap.innerHTML = "";
      if (!groups.length) return;

      let teachers = null;
      const loadTeachers = async () => {
        if (!teachers) teachers = await armusGetRegisteredTeachers(viewerId).catch(() => []);
        return teachers;
      };

      groups.forEach(group => {
        const card = document.createElement("div");
        card.className = "package-notice";
        const teacherShort = armusShortDisplayName(group.teacher_name);
        const perLesson = group.lessons ? Number(group.total_value) / group.lessons : 0;

        function render() {
          card.innerHTML = `
            <h3>${armusEscapeHtml(armusT("myLessons.packageStrandedTitle", "{teacher} artık sana ders veremiyor").replace("{teacher}", teacherShort))}</h3>
            <p>${armusEscapeHtml(armusT("myLessons.packageStrandedText", "Paketinden {n} ders kaldı ({total}). Bu dersleri kartına iade ettirebilir ya da başka bir öğretmene aktarabilirsin.")
              .replace("{n}", group.lessons).replace("{total}", formatMoney(group.total_value)))}</p>
            <div class="package-actions">
              ${group.refundable
                ? `<button type="button" class="lesson-reschedule-btn primary" data-action="refund">${armusEscapeHtml(armusT("myLessons.packageRefundBtn", "Paramı İade Et ({total})").replace("{total}", formatMoney(group.total_value)))}</button>`
                : ""}
              <button type="button" class="lesson-reschedule-btn" data-action="transfer">${armusEscapeHtml(armusT("myLessons.packageTransferBtn", "Başka Öğretmene Aktar"))}</button>
            </div>
            ${group.refundable ? "" : `<p style="margin-top:10px;">${armusT("myLessons.packageRefundSupport", "Bu paketin iadesi otomatik yapılamıyor - iade istersen <a href=\"iletisim\">destek ekibimize yaz</a>.")}</p>`}
            <div class="package-status" style="display:none;"></div>
          `;
          const status = card.querySelector(".package-status");
          const showStatus = (text, isError) => {
            status.textContent = text;
            status.classList.toggle("error", !!isError);
            status.style.display = "block";
          };

          const refundBtn = card.querySelector('[data-action="refund"]');
          if (refundBtn) refundBtn.addEventListener("click", async () => {
            const ask = armusT("myLessons.packageRefundConfirm", "{total} ödeme yaptığın karta iade edilecek ve bu {n} ders bakiyenden silinecek. Onaylıyor musun?")
              .replace("{total}", formatMoney(group.total_value)).replace("{n}", group.lessons);
            if (!window.confirm(ask)) return;
            refundBtn.disabled = true;
            let data, error;
            try {
              ({ data, error } = await armusSupabase.functions.invoke("package-credits", { body: { action: "refund", teacher_id: group.teacher_id } }));
            } catch (err) { error = err; }
            if (error || !data || !data.ok) {
              refundBtn.disabled = false;
              showStatus((await armusEdgeErrorMessage(error)) || (data && data.error) || armusT("myLessons.packageActionFailed", "İşlem yapılamadı. Lütfen tekrar dene."), true);
              return;
            }
            card.innerHTML = `<p class="package-status">${armusEscapeHtml(armusT("myLessons.packageRefunded", "{n} dersin ücreti ({total}) kartına iade edildi. Tutarın hesabına geçmesi bankana göre birkaç iş günü sürebilir.")
              .replace("{n}", data.refundedLessons).replace("{total}", formatMoney(data.refundedAmount)))}</p>`;
          });

          card.querySelector('[data-action="transfer"]').addEventListener("click", async (event) => {
            const button = event.currentTarget;
            if (card.querySelector(".package-transfer")) return;
            button.disabled = true;
            const list = (await loadTeachers()).filter(t => t.id !== group.teacher_id && Number(t.price) > 0);
            button.disabled = false;
            const box = document.createElement("div");
            box.className = "package-transfer";
            box.innerHTML = `
              <label style="font-size:12.5px;font-weight:600;">${armusEscapeHtml(armusT("myLessons.packageTransferPick", "Paketini hangi öğretmenle kullanmak istersin?"))}</label>
              <select>
                <option value="">${armusEscapeHtml(armusT("myLessons.packageTransferChoose", "Öğretmen seç"))}</option>
                ${list.map(t => `<option value="${armusEscapeHtml(t.id)}">${armusEscapeHtml(armusShortDisplayName(t.name))} - ${formatMoney(t.price)}</option>`).join("")}
              </select>
              <p class="package-transfer-hint"></p>
              <div class="package-actions" style="margin-top:0;">
                <button type="button" class="lesson-reschedule-btn primary" disabled>${armusEscapeHtml(armusT("myLessons.packageTransferConfirm", "Paketi Aktar"))}</button>
              </div>
            `;
            card.insertBefore(box, status);
            const select = box.querySelector("select");
            const hint = box.querySelector(".package-transfer-hint");
            const confirmTransfer = box.querySelector("button");
            select.addEventListener("change", () => {
              const t = list.find(x => x.id === select.value);
              confirmTransfer.disabled = !t;
              if (!t) { hint.textContent = ""; return; }
              const price = Number(t.price);
              const diff = Math.round((price - perLesson) * 100) / 100;
              hint.textContent = diff >= 1
                ? armusT("myLessons.packageTransferDearer", "Her dersin {value} değerinde, bu öğretmenin ders ücreti {price}. Her derste aradaki {diff} farkı kartla ödersin.")
                    .replaceAll("{value}", formatMoney(perLesson)).replace("{price}", formatMoney(price)).replace("{diff}", formatMoney(diff))
                : (diff <= -1
                  ? armusT("myLessons.packageTransferCheaper", "Her dersin {value} değerinde, bu öğretmenin ders ücreti {price}. Her ders tamamen karşılanır; aradaki {diff} iade edilmez.")
                      .replace("{value}", formatMoney(perLesson)).replace("{price}", formatMoney(price)).replace("{diff}", formatMoney(-diff))
                  : armusT("myLessons.packageTransferSame", "Her dersin bu öğretmenle tamamen karşılanır."));
            });
            confirmTransfer.addEventListener("click", async () => {
              confirmTransfer.disabled = true;
              let data, error;
              try {
                ({ data, error } = await armusSupabase.functions.invoke("package-credits", { body: { action: "transfer", teacher_id: group.teacher_id, new_teacher_id: select.value } }));
              } catch (err) { error = err; }
              if (error || !data || !data.ok) {
                confirmTransfer.disabled = false;
                showStatus((await armusEdgeErrorMessage(error)) || (data && data.error) || armusT("myLessons.packageActionFailed", "İşlem yapılamadı. Lütfen tekrar dene."), true);
                return;
              }
              card.innerHTML = `<p class="package-status">${armusEscapeHtml(armusT("myLessons.packageTransferred", "{n} dersin {teacher} ile kullanılabilir. Rezervasyonu öğretmenin profilinden yapabilirsin.")
                .replace("{n}", data.transferred).replace("{teacher}", data.teacherName))}</p>
                <div class="package-actions"><a class="lesson-reschedule-btn primary" style="text-decoration:none;" href="teacher?teacher=${encodeURIComponent(select.value)}">${armusEscapeHtml(armusT("myLessons.packageGoToTeacher", "Öğretmenin Profiline Git →"))}</a></div>`;
            });
          });
        }

        render();
        wrap.appendChild(card);
      });
    }

    // migration_112.sql: a closed or locked account says so up top
    async function renderAccountNotice(viewerId) {
      const wrap = document.getElementById("accountNotice");
      let profile = null;
      try {
        const { data } = await armusSupabase.from("profiles").select("is_banned, account_locked").eq("id", viewerId).maybeSingle();
        profile = data;
      } catch (err) {}
      wrap.innerHTML = "";
      if (!profile || (!profile.is_banned && !profile.account_locked)) return;
      const box = document.createElement("div");
      box.className = "account-notice";
      box.innerHTML = profile.is_banned
        ? armusT("myLessons.accountBanned", "Hesabın kapatıldı. Planlanmış derslerin iptal edildi ve ders hakların geçersiz hale geldi. Bir yanlışlık olduğunu düşünüyorsan <a href=\"iletisim\">destek ekibimize yaz</a>.")
        : armusT("myLessons.accountLocked", "Hesabın inceleme nedeniyle geçici olarak kilitli: şu anda ders alamaz ve mesaj gönderemezsin. Bilgi için <a href=\"iletisim\">destek ekibimize yaz</a>.");
      wrap.appendChild(box);
    }

    const formatDay = (iso) => new Date(iso).toLocaleDateString(armusGetLang() === "en" ? "en-US" : "tr-TR", { day: "numeric", month: "long", year: "numeric" });

    async function invokePackageCredits(body) {
      let data, error;
      try {
        ({ data, error } = await armusSupabase.functions.invoke("package-credits", { body }));
      } catch (err) { error = err; }
      if (error || !data || !data.ok) {
        return { ok: false, error: (await armusEdgeErrorMessage(error)) || (data && data.error) || armusT("myLessons.packageActionFailed", "İşlem yapılamadı. Lütfen tekrar dene.") };
      }
      return data;
    }

    // migration_112.sql: lesson credits with their expiry, packages that can
    // still be withdrawn (14 days, nothing used), credits stuck with a
    // teacher who can't teach this student anymore (refund after 30 days)
    async function renderCreditsPanel(viewerId) {
      const wrap = document.getElementById("creditsPanel");
      let credits = [], withdrawable = [], stuck = [];
      try {
        const [creditsRes, withdrawRes, stuckRes] = await Promise.all([
          armusSupabase.from("lesson_credits").select("id, teacher_id, teacher_name, value, expires_at, source").eq("student_id", viewerId).eq("status", "available").order("expires_at", { ascending: true }),
          armusSupabase.rpc("my_withdrawable_packages"),
          armusSupabase.rpc("my_stranded_lesson_credits"),
        ]);
        credits = creditsRes.data || [];
        withdrawable = withdrawRes.data || [];
        stuck = stuckRes.data || [];
      } catch (err) {}
      wrap.innerHTML = "";

      withdrawable.forEach(pkg => {
        const card = document.createElement("div");
        card.className = "package-notice";
        card.innerHTML = `
          <h3>${armusEscapeHtml(armusT("myLessons.withdrawTitle", "Paketini iptal edebilirsin"))}</h3>
          <p>${armusEscapeHtml(armusT("myLessons.withdrawText", "{teacher} ile aldığın {n} derslik paketten henüz ders kullanmadın. {date} tarihine kadar paketi iptal edip ödediğin {price} tutarın tamamını geri alabilirsin. Paketteki ilk ders başladığında bu hak sona erer.")
            .replace("{teacher}", armusShortDisplayName(pkg.teacher_name)).replace("{n}", pkg.lessons).replace("{date}", formatDay(pkg.withdraw_until)).replace("{price}", formatMoney(pkg.price)))}</p>
          <div class="package-actions"><button type="button" class="lesson-reschedule-btn">${armusEscapeHtml(armusT("myLessons.withdrawBtn", "Paketi İptal Et"))}</button></div>
          <div class="package-status" style="display:none;"></div>
        `;
        const btn = card.querySelector("button");
        const status = card.querySelector(".package-status");
        btn.addEventListener("click", async () => {
          const ask = armusT("myLessons.withdrawConfirm", "{n} derslik paketin iptal edilecek ve {price} ödeme yaptığın karta iade edilecek. Onaylıyor musun?")
            .replace("{n}", pkg.lessons).replace("{price}", formatMoney(pkg.price));
          if (!window.confirm(ask)) return;
          btn.disabled = true;
          const result = await invokePackageCredits({ action: "withdraw", payment_id: pkg.payment_id });
          if (!result.ok) {
            btn.disabled = false;
            status.textContent = result.error;
            status.classList.add("error");
            status.style.display = "block";
            return;
          }
          card.innerHTML = `<p class="package-status">${armusEscapeHtml(armusT("myLessons.withdrawDone", "Paketin iptal edildi, {price} kartına iade edildi. Tutarın hesabına geçmesi bankana göre birkaç iş günü sürebilir.").replace("{price}", formatMoney(result.refundedAmount)))}</p>`;
          renderCreditsPanel(viewerId);
        });
        wrap.appendChild(card);
      });

      stuck.forEach(group => {
        const refundableNow = group.refundable && new Date(group.refundable_from) <= new Date();
        const card = document.createElement("div");
        card.className = "package-notice";
        card.innerHTML = `
          <h3>${armusEscapeHtml(armusT("myLessons.packageStrandedTitle", "{teacher} artık sana ders veremiyor").replace("{teacher}", armusShortDisplayName(group.teacher_name)))}</h3>
          <p>${armusEscapeHtml(armusT("myLessons.stuckCreditsText", "Bu öğretmenle {n} ders hakkın var ({total}). Bu haklar başka bir öğretmenle deneme dersi için kullanılabilir.")
            .replace("{n}", group.lessons).replace("{total}", formatMoney(group.total_value)))}
            ${group.refundable
              ? armusEscapeHtml(refundableNow
                ? armusT("myLessons.stuckCreditsRefundNow", "İstersen ödediğin tutarı kartına iade ettirebilirsin.")
                : armusT("myLessons.stuckCreditsRefundLater", "{date} tarihinden itibaren istersen ödediğin tutarı kartına iade ettirebilirsin.").replace("{date}", formatDay(group.refundable_from)))
              : armusT("myLessons.packageRefundSupport", "Bu paketin iadesi otomatik yapılamıyor - iade istersen <a href=\"iletisim\">destek ekibimize yaz</a>.")}</p>
          ${refundableNow ? `<div class="package-actions"><button type="button" class="lesson-reschedule-btn">${armusEscapeHtml(armusT("myLessons.packageRefundBtn", "Paramı İade Et ({total})").replace("{total}", formatMoney(group.total_value)))}</button></div>` : ""}
          <div class="package-status" style="display:none;"></div>
        `;
        const btn = card.querySelector("button");
        const status = card.querySelector(".package-status");
        if (btn) btn.addEventListener("click", async () => {
          const ask = armusT("myLessons.stuckCreditsConfirm", "{n} ders hakkının ücreti ödeme yaptığın karta iade edilecek ve bu haklar bakiyenden silinecek. Onaylıyor musun?").replace("{n}", group.lessons);
          if (!window.confirm(ask)) return;
          btn.disabled = true;
          const result = await invokePackageCredits({ action: "refund_credits", teacher_id: group.teacher_id });
          if (!result.ok) {
            btn.disabled = false;
            status.textContent = result.error;
            status.classList.add("error");
            status.style.display = "block";
            return;
          }
          card.innerHTML = `<p class="package-status">${armusEscapeHtml(armusT("myLessons.packageRefunded", "{n} dersin ücreti ({total}) kartına iade edildi. Tutarın hesabına geçmesi bankana göre birkaç iş günü sürebilir.")
            .replace("{n}", result.refundedLessons).replace("{total}", formatMoney(result.refundedAmount)))}</p>`;
          renderCreditsPanel(viewerId);
        });
        wrap.appendChild(card);
      });

      if (!credits.length) return;
      // one line per teacher: how many, and when the first one runs out
      const byTeacher = new Map();
      credits.forEach(c => {
        const g = byTeacher.get(c.teacher_id) || { name: c.teacher_name, count: 0, firstExpiry: c.expires_at };
        g.count++;
        if (c.expires_at && (!g.firstExpiry || c.expires_at < g.firstExpiry)) g.firstExpiry = c.expires_at;
        byTeacher.set(c.teacher_id, g);
      });
      const soonLimit = Date.now() + 14 * 86_400_000;
      const panel = document.createElement("div");
      panel.className = "credits-panel";
      panel.innerHTML = `
        <h3>${armusEscapeHtml(armusT("myLessons.creditsTitle", "Ders hakların"))}</h3>
        <ul class="credits-list">
          ${[...byTeacher.values()].map(g => `
            <li>
              <span>${armusEscapeHtml(armusShortDisplayName(g.name))} · ${armusEscapeHtml(armusT("myLessons.creditsCount", "{n} ders hakkı").replace("{n}", g.count))}</span>
              ${g.firstExpiry ? `<span class="credit-expiry${new Date(g.firstExpiry).getTime() < soonLimit ? " soon" : ""}">${armusEscapeHtml(armusT("myLessons.creditsExpiry", "son gün {date}").replace("{date}", formatDay(g.firstExpiry)))}</span>` : ""}
            </li>
          `).join("")}
        </ul>
        <p class="credits-hint">${armusEscapeHtml(armusT("myLessons.creditsHint", "Ders hakları alındıktan 6 ay sonra geçersiz olur. Aynı öğretmenle her ders için, başka bir öğretmenle sadece deneme dersi için kullanılabilir; rezervasyonda otomatik uygulanır."))}</p>
      `;
      wrap.appendChild(panel);
    }

    (async function() {

    // caught so a slow/blocked Supabase SDK still reaches the static
    // login gate below instead of leaving pageRoot's default state on screen
    const session = await armusGetSession().catch(() => null);

    if (!session) {

      gate.style.display = "block";

    } else {

      pageRoot.style.display = "block";

      renderStrandedPackages(session.id);
      renderAccountNotice(session.id);
      renderCreditsPanel(session.id);

      const bookings = await armusGetBookingsForStudent(session.id);
      // armusGetBookingsForStudent sorts strictly ascending by date/time
      // (oldest first) with no regard for past vs. upcoming - fine for a
      // brand-new account, but after a few months of lessons the one thing
      // a student actually needs (today's/next lesson, still-joinable via
      // the grace window) ends up buried under every already-completed
      // lesson. Re-sort here: not-yet-past lessons first (soonest first),
      // then past ones (most recent first).
      // A cancelled lesson goes to the past/history side too, even while its
      // date is still ahead (Preply: an in-time cancel leaves the upcoming
      // list, a late one shows under Past as "Cancelled and Paid").
      const inHistory = b => b.status === "cancelled" || (armusIsBookingPast(b) && !armusCanJoinLessonNow(b));
      bookings.sort((a, b) => {
        const aPast = inHistory(a);
        const bPast = inHistory(b);
        if (aPast !== bPast) return aPast ? 1 : -1;
        const aStart = armusZonedTimeToUtc(a.date, a.time, a.teacherTimezone || "Europe/Istanbul").getTime();
        const bStart = armusZonedTimeToUtc(b.date, b.time, b.teacherTimezone || "Europe/Istanbul").getTime();
        return aPast ? bStart - aStart : aStart - bStart;
      });
      const list = document.getElementById("lessonsList");
      const empty = document.getElementById("emptyState");

      async function buildReviewBlock(booking, prefetchedReview) {

        const wrap = document.createElement("div");
        wrap.className = "review-block";

        // the render loop below already fetched every past booking's
        // review up front, in parallel - only re-fetch here when called
        // without that (right after a review is submitted, where it has
        // to be fresh)
        const existing = prefetchedReview !== undefined
          ? prefetchedReview
          : await armusGetReviewForBooking(booking.id).catch(() => null);

        if (existing) {

          wrap.innerHTML = `
            <div class="submitted-review">
              <span class="stars">${"★".repeat(existing.stars)}${"☆".repeat(5 - existing.stars)} ${armusT("myLessons.reviewed", "Değerlendirdin")}</span>
              ${existing.text ? `<p>${armusEscapeHtml(existing.text)}</p>` : ""}
            </div>
          `;

          return wrap;
        }

        let selectedStars = 0;

        wrap.innerHTML = `
          <button type="button" class="review-prompt-btn">${armusT("myLessons.reviewPromptBtn", "★ Bu dersi değerlendir")}</button>
          <div class="review-form">
            <div class="star-picker" role="radiogroup" aria-label="${armusT("reviews.starRatingLabel", "Puan ver")}">
              ${[1, 2, 3, 4, 5].map(n => `<span data-star="${n}" role="radio" aria-checked="false" aria-label="${armusT("reviews.starCount", "{n} yıldız").replace("{n}", n)}" tabindex="${n === 1 ? "0" : "-1"}">★</span>`).join("")}
            </div>
            <textarea placeholder="${armusEscapeHtml(armusT("myLessons.reviewPlaceholder", "{name} ile dersin nasıldı?").replace("{name}", armusShortDisplayName(booking.teacherName)))}"></textarea>
            <button type="button" class="review-submit-btn">${armusT("contact.submit", "Gönder")}</button>
          </div>
        `;

        const promptBtn = wrap.querySelector(".review-prompt-btn");
        const form = wrap.querySelector(".review-form");
        const stars = Array.from(wrap.querySelectorAll(".star-picker span"));
        const textarea = wrap.querySelector("textarea");
        const submitBtn = wrap.querySelector(".review-submit-btn");

        promptBtn.addEventListener("click", () => {
          promptBtn.style.display = "none";
          form.style.display = "block";
        });

        // the star picker used to be plain <span>s with only a click
        // listener - no keyboard support, no accessible name beyond a
        // "★" glyph, nothing announcing which rating was selected. Now
        // a proper radiogroup: Enter/Space/click pick the focused star,
        // arrow keys move (and pick) up/down the scale, and only the
        // current value sits in the tab order (roving tabindex), same
        // as any native radio group.
        function selectStars(n, { focus } = {}) {
          selectedStars = n;
          stars.forEach(s => {
            const starN = Number(s.dataset.star);
            s.classList.toggle("active", starN <= n);
            s.setAttribute("aria-checked", starN === n ? "true" : "false");
            s.tabIndex = starN === n ? 0 : -1;
          });
          if (focus) stars[n - 1].focus();
        }

        stars.forEach(star => {
          star.addEventListener("click", () => selectStars(Number(star.dataset.star)));
          star.addEventListener("keydown", (e) => {
            const current = Number(star.dataset.star);
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectStars(current);
            } else if (e.key === "ArrowRight" || e.key === "ArrowUp") {
              e.preventDefault();
              selectStars(Math.min(5, (selectedStars || current) + 1), { focus: true });
            } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
              e.preventDefault();
              selectStars(Math.max(1, (selectedStars || current) - 1), { focus: true });
            }
          });
        });

        submitBtn.addEventListener("click", async () => {

          if (selectedStars === 0) {
            alert(armusT("myLessons.starAlert", "Lütfen bir puan seç."));
            return;
          }

          // reviews.booking_id is unique - without this, a double-click
          // fires two submits before either resolves: the first really
          // saves the review, the second hits that unique constraint and
          // returns false, showing "couldn't save" even though the
          // review was in fact saved. Disabling synchronously (before
          // the await) stops the browser from ever delivering a second
          // click to this button in the first place.
          submitBtn.disabled = true;

          const result = await armusAddReview({
            bookingId: booking.id,
            teacherId: booking.teacherId,
            studentId: session.id,
            studentName: session.name,
            stars: selectedStars,
            text: textarea.value.trim(),
          });

          if (result === false) {
            alert(armusT("myLessons.reviewFailedAlert", "Değerlendirme kaydedilemedi."));
            submitBtn.disabled = false;
            return;
          }

          const replacement = await buildReviewBlock(booking);
          wrap.replaceWith(replacement);
        });

        return wrap;
      }

      const ownDisputes = await armusGetOwnDisputes(session.id).catch(() => []);
      const disputeByBooking = new Map(ownDisputes.filter(d => d.booking_id).map(d => [d.booking_id, d]));

      function disputeSubjects() {
        return [
          armusT("myLessons.disputeSubject1", "Öğretmen derse gelmedi"),
          armusT("myLessons.disputeSubject2", "Ders kalitesiyle ilgili bir sorun"),
          armusT("myLessons.disputeSubject3", "İletişim / uygunsuz davranış"),
          armusT("myLessons.disputeSubject4", "Ödeme ile ilgili bir sorun"),
          armusT("myLessons.disputeSubject5", "Diğer"),
        ];
      }
      function disputeStatusLabels() {
        return {
          open: armusT("myLessons.disputeStatusOpen", "Bildirdin, inceleniyor"),
          in_progress: armusT("myLessons.disputeStatusInProgress", "İnceleniyor"),
          resolved: armusT("myLessons.disputeStatusResolved", "Çözüldü"),
        };
      }

      function buildDisputeBlock(booking) {

        const wrap = document.createElement("div");
        wrap.className = "dispute-block";

        const existing = disputeByBooking.get(booking.id);

        if (existing) {
          wrap.innerHTML = `
            <div class="submitted-dispute">
              <span class="dispute-status">⚑ ${disputeStatusLabels()[existing.status] || existing.status}</span>
              <p>${armusEscapeHtml(existing.subject)}</p>
            </div>
          `;
          return wrap;
        }

        wrap.innerHTML = `
          <button type="button" class="dispute-prompt-btn">${armusT("myLessons.reportPromptBtn", "⚑ Bir sorun bildir")}</button>
          <div class="dispute-form">
            <select>
              ${disputeSubjects().map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>
            <textarea placeholder="${armusT("myLessons.disputePlaceholder", "Ne oldu, kısaca anlat...")}"></textarea>
            <button type="button" class="dispute-submit-btn">${armusT("contact.submit", "Gönder")}</button>
          </div>
        `;

        const promptBtn = wrap.querySelector(".dispute-prompt-btn");
        const form = wrap.querySelector(".dispute-form");
        const select = wrap.querySelector("select");
        const textarea = wrap.querySelector("textarea");
        const submitBtn = wrap.querySelector(".dispute-submit-btn");

        promptBtn.addEventListener("click", () => {
          promptBtn.style.display = "none";
          form.style.display = "block";
        });

        submitBtn.addEventListener("click", async () => {

          const description = textarea.value.trim();
          if (!description) {
            alert(armusT("myLessons.disputeAlert", "Lütfen ne olduğunu kısaca yaz."));
            return;
          }

          submitBtn.disabled = true;

          const created = await armusCreateDispute({
            bookingId: booking.id,
            reporterId: session.id,
            reporterName: session.name,
            reporterRole: "student",
            otherPartyName: booking.teacherName,
            subject: select.value,
            description,
          });

          if (!created) {
            alert(armusT("myLessons.disputeFailedAlert", "Bildirilemedi. Lütfen tekrar dene."));
            submitBtn.disabled = false;
            return;
          }

          disputeByBooking.set(booking.id, created);
          wrap.replaceWith(buildDisputeBlock(booking));
        });

        return wrap;
      }

      // ---- "did this lesson happen?" (migration_112.sql) - from the end
      // of the lesson until 24 hours after, unless a report is already in
      // or the student already said yes ----

      const CHECKIN_OK_KEY = id => "armus_checkin_ok_" + id;

      function checkinOpen(booking) {
        const end = armusLessonWindow(booking).end.getTime();
        const now = Date.now();
        if (now < end || now > end + ARMUS_REPORT_WINDOW_HOURS * 3_600_000) return false;
        try { if (localStorage.getItem(CHECKIN_OK_KEY(booking.id)) === "1") return false; } catch (err) {}
        return true;
      }

      function buildReportStatus(report) {
        const el = document.createElement("div");
        el.className = "lesson-report-status";
        const typeLabel = {
          no_show: armusT("myLessons.reportTypeNoShow", "Öğretmen gelmedi"),
          late: armusT("myLessons.reportTypeLate", "Öğretmen geç geldi") + (report.lateMinutes ? ` (${report.lateMinutes} ${armusT("myLessons.minutesShort", "dk")})` : ""),
          technical: armusT("myLessons.reportTypeTechnical", "Teknik sorun"),
        }[report.type] || report.type;
        const statusLabel = report.status === "upheld"
          ? armusT("myLessons.reportUpheld", "Doğrulandı")
          : report.status === "dismissed"
            ? armusT("myLessons.reportDismissed", "Reddedildi")
            : armusT("myLessons.reportPending", "İnceleniyor");
        el.innerHTML = `${armusT("myLessons.reportStatus", "Bildirimin:")} <strong>${armusEscapeHtml(typeLabel)}</strong> · ${armusEscapeHtml(statusLabel)}`;
        return el;
      }

      function buildCheckinBox(booking) {
        const box = document.createElement("div");
        box.className = "checkin-box";
        box.innerHTML = `
          <h4>${armusT("myLessons.checkinTitle", "Bu ders gerçekleşti mi?")}</h4>
          <p>${armusT("myLessons.checkinText", "Bir sorun olduysa dersten sonraki 24 saat içinde bildirebilirsin. Bildirim gelmezse ders yapılmış sayılır ve ücreti öğretmene ödenir.")}</p>
          <div data-flow></div>
        `;
        armusRenderAttendanceFlow(box.querySelector("[data-flow]"), {
          booking,
          studentId: session.id,
          askHappened: true,
          ui: {
            options: "checkin-options",
            actions: "package-actions",
            choice: "checkin-choice",
            primary: "lesson-reschedule-btn primary",
            secondary: "lesson-reschedule-btn",
            input: "checkin-input",
          },
          onHappened: () => {
            try { localStorage.setItem(CHECKIN_OK_KEY(booking.id), "1"); } catch (err) {}
            box.remove();
          },
          onFiled: (report, message) => {
            const status = buildReportStatus(report);
            const note = document.createElement("div");
            note.className = "package-status";
            note.textContent = message;
            status.appendChild(note);
            box.replaceWith(status);
          },
        });
        return box;
      }

      const isRealTeacherId = id => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(id || ""));

      async function renderLessons() {

        list.innerHTML = "";

        if (bookings.length === 0) {

          empty.style.display = "block";

        } else {

          empty.style.display = "none";

          // yyyy-mm-dd from a Date's own local year/month/day - never goes
          // through toISOString(), which converts to UTC first and shifts
          // the date by a day in any positive-UTC-offset viewer timezone
          // (Istanbul included).
          const localDateKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
          const todayKey = localDateKey(new Date());

          // Batched, parallel prefetch instead of the old per-booking
          // `await armusFindMarketplaceTeacher(...)`/`await armusGetReviewForBooking(...)`
          // inside this loop - that fired once per booking, sequentially
          // (awaited one at a time), so a student with N bookings paid
          // for up to N sequential multi-query round trips just to open
          // their own lesson list. Teachers are also deduped: a repeat
          // booking with the same teacher reuses one fetch instead of
          // refetching their whole profile+reviews+stats again.
          const uniqueTeacherIds = [...new Set(bookings.map(b => b.teacherId))];
          const teacherEntries = await Promise.all(
            uniqueTeacherIds.map(id => armusFindMarketplaceTeacher(id, session.id).catch(() => null).then(t => [id, t]))
          );
          const teacherById = new Map(teacherEntries);

          const pastBookingIds = bookings.filter(b => b.status !== "cancelled" && armusIsBookingPast(b)).map(b => b.id);
          const reviewEntries = await Promise.all(
            pastBookingIds.map(id => armusGetReviewForBooking(id).catch(() => null).then(r => [id, r]))
          );
          const reviewByBooking = new Map(reviewEntries);

          // open "move this lesson" requests (reschedule-booking,
          // migration_107.sql) on lessons that can still move
          const pendingRescheduleByBooking = await armusGetPendingRescheduleRequests(
            bookings.filter(armusBookingCancellable).map(b => b.id)
          ).catch(() => ({}));
          // migration_112.sql: how many times each lesson already moved
          const rescheduleCounts = await armusGetRescheduleCounts(
            bookings.filter(armusBookingCancellable).map(b => b.id)
          ).catch(() => ({}));

          // reports already filed on past lessons (one per lesson)
          const reportByBooking = new Map();
          if (pastBookingIds.length) {
            try {
              const { data: reportRows } = await armusSupabase.from("attendance_reports").select("*").in("booking_id", pastBookingIds);
              (reportRows || []).forEach(r => reportByBooking.set(r.booking_id, armusMapAttendanceReportRow(r)));
            } catch (err) {}
          }

          // "Yaklaşan" / "Geçmiş" headings, same split as the sort above
          const upcomingHeading = document.createElement("div");
          upcomingHeading.className = "lessons-section-title";
          upcomingHeading.textContent = armusT("myLessons.sectionUpcoming", "Yaklaşan dersler");
          const historyHeading = document.createElement("div");
          historyHeading.className = "lessons-section-title";
          historyHeading.textContent = armusT("myLessons.sectionHistory", "Geçmiş");
          if (bookings.some(b => !inHistory(b))) list.appendChild(upcomingHeading);
          let historyHeadingShown = false;

          for (const booking of bookings) {

            if (!historyHeadingShown && inHistory(booking)) {
              list.appendChild(historyHeading);
              historyHeadingShown = true;
            }

            const teacher = teacherById.get(booking.teacherId) || null;
            // armusIsBookingPast compares the lesson's real, timezone-aware
            // end time against now - not booking.date (wall-clock in the
            // TEACHER's own zone) against todayKey (a date in UTC), which
            // could disagree by a day depending on the teacher/viewer's
            // actual locations and time of day.
            const isPast = armusIsBookingPast(booking);
            // Same reasoning for the join-hint's own "is this lesson today"
            // check below: booking.date is teacher-local, so it's compared
            // against the VIEWER's local today by first converting to the
            // lesson's real start instant and reading the viewer's own
            // local calendar day off that - not compared as raw strings.
            const bookingLocalDateKey = localDateKey(armusZonedTimeToUtc(booking.date, booking.time, booking.teacherTimezone || "Europe/Istanbul"));
            // armusIsBookingPast flips true right at the lesson's scheduled
            // end, but class (and armusCanJoinLessonNow) still admits
            // the student for ARMUS_JOIN_LATE_GRACE_MINUTES after that - so
            // isPast alone is NOT enough to decide whether to still show
            // the join button, or a running-late lesson's join button would
            // vanish here while the room is still actually open.
            const canJoinNow = armusCanJoinLessonNow(booking);
            const isCancelled = booking.status === "cancelled";
            const avatarInner = teacher
              ? (armusSafeUrl(teacher.photo) ? `<img src="${armusSafeUrl(teacher.photo)}" alt="">` : armusEscapeHtml(teacher.initials))
              : "?";
            // shown in the viewer's own current local time, not the
            // teacher's - see armusFormatLessonWhen (migration_37.sql)
            const when = armusFormatLessonWhen(booking);

            const card = document.createElement("div");
            card.className = "lesson-card" + (isPast && !canJoinNow ? " lesson-past" : "") + (isCancelled ? " lesson-cancelled" : "");
            card.dataset.bookingId = booking.id;

            // Only link the row through to the teacher's profile once
            // armusFindMarketplaceTeacher (above) has actually confirmed
            // they're still visible there - never promise a profile page
            // for a teacher who's since been hidden/banned.
            const rowTag = teacher ? "a" : "div";
            const rowHrefAttr = teacher ? ` href="teacher?teacher=${encodeURIComponent(booking.teacherId)}"` : "";

            card.innerHTML = `
              <${rowTag} class="lesson-row"${rowHrefAttr}>
                <div class="avatar">${avatarInner}</div>
                <div class="lesson-info">
                  <div class="lesson-teacher">
                    <span class="lesson-teacher-name">${armusEscapeHtml(armusShortDisplayName(booking.teacherName))}</span>
                    <span class="lesson-type">${booking.type === "trial" ? armusT("myLessons.trial", "Deneme Dersi") : armusT("myLessons.lesson", "Ders")}</span>
                    ${teacher ? `<span class="go-arrow">→</span>` : ""}
                  </div>
                  <div class="lesson-meta">₺${booking.price} ${armusT("booking.perLesson", "/ 50 dakika")}${(isPast && !canJoinNow) ? armusT("myLessons.pastSuffix", " · geçti") : ""}</div>
                </div>
                <div class="lesson-when">
                  <div class="lesson-date">${when.dateLabel}</div>
                  <div class="lesson-time">${when.timeRange}</div>
                </div>
              </${rowTag}>
              ${isCancelled ? `
                <div class="lesson-cancel-badge">
                  ${booking.teacherNoShow ? teacherNoShowBadge(booking) : booking.technicalIssue ? technicalIssueBadge(booking) : lateCancelBadgeOr(booking.lateCancel, `${armusT("myLessons.cancelled", "⊘ İptal edildi")}${booking.refunded ? armusT("myLessons.creditAdded", " · Ders hakkın eklendi") : (booking.cancelledBy === "student" ? armusT("myLessons.creditNotAdded", " · Ders hakkı eklenmedi") : "")}`)}
                </div>
              ` : (canJoinNow || (!isPast && bookingLocalDateKey === todayKey)) ? `
                <div class="lesson-join">
                  ${canJoinNow
                    ? `<a class="join-btn" href="class?booking=${booking.id}">${armusT("myLessons.joinBtn", "🎥 Derse Katıl")}</a>`
                    : `<span class="join-hint">${armusT("myLessons.joinHint", "Ders saatinde bu kart üzerinden odaya katılabileceksin.")}</span>`}
                </div>
              ` : ""}
            `;

            let disputeBlock = null;

            if (armusBookingCancellable(booking)) {

              // Preply's 12-hour rule (cancel-booking's FREE_CANCEL_HOURS):
              // in time, the lesson goes back to the student's balance;
              // inside the window nothing comes back, and a regular
              // lesson is paid to the teacher since their time was reserved
              const lateCancelMessage = () => booking.type === "trial"
                ? armusT("myLessons.refundHintNoTrial", "Derse 12 saatten az kaldı: iptal edersen deneme dersi bakiyene geri eklenmez")
                : armusT("myLessons.refundHintNo", "Derse 12 saatten az kaldı: iptal edersen ders hakkı iade edilmez ve ücret öğretmene ödenir (saati senin için ayrılmıştı)");
              const refundHint = armusHoursUntilLesson(booking) >= ARMUS_FREE_CANCEL_HOURS
                ? armusT("myLessons.refundHintYes", "Derse 12 saatten fazla var: iptal edersen ders bakiyene geri eklenir - bu öğretmenle ya da başka bir öğretmenle deneme dersi için kullanabilirsin")
                : lateCancelMessage();

              // ---- moving the lesson (Preply-style rescheduling) ----
              const pendingReschedule = pendingRescheduleByBooking[booking.id];
              let rescheduleBlock = null;
              if (pendingReschedule) {
                const newSlotLabel = armusEscapeHtml(armusFormatRescheduleSlot(pendingReschedule.newDate, pendingReschedule.newTime, booking.teacherTimezone));
                rescheduleBlock = document.createElement("div");
                rescheduleBlock.className = "lesson-reschedule";
                rescheduleBlock.innerHTML = pendingReschedule.requestedBy === "teacher"
                  ? `<span>${armusT("myLessons.teacherProposedTime", "Öğretmenin bu ders için yeni bir saat önerdi:")} <strong>${newSlotLabel}</strong></span>
                     <span class="lesson-reschedule-actions">
                       <button type="button" class="lesson-reschedule-btn primary" data-rs-accept>${armusT("myLessons.rescheduleAccept", "Kabul Et")}</button>
                       <button type="button" class="lesson-reschedule-btn" data-rs-decline>${armusT("myLessons.rescheduleDecline", "Reddet")}</button>
                     </span>`
                  : `<span>${armusT("myLessons.rescheduleRequested", "Saat değişikliği isteğin öğretmen onayı bekliyor:")} <strong>${newSlotLabel}</strong></span>
                     <span class="lesson-reschedule-actions">
                       <button type="button" class="lesson-reschedule-btn" data-rs-withdraw>${armusT("myLessons.rescheduleWithdraw", "İsteği Geri Çek")}</button>
                     </span>`;
                const act = async (button, call) => {
                  rescheduleBlock.querySelectorAll("button").forEach(b => { b.disabled = true; });
                  const result = await call();
                  if (!result.ok) {
                    alert(result.error);
                    rescheduleBlock.querySelectorAll("button").forEach(b => { b.disabled = false; });
                    return;
                  }
                  location.reload();
                };
                rescheduleBlock.querySelector("[data-rs-accept]")?.addEventListener("click", e => act(e.currentTarget, () => armusRespondReschedule(pendingReschedule.id, true)));
                rescheduleBlock.querySelector("[data-rs-decline]")?.addEventListener("click", e => act(e.currentTarget, () => armusRespondReschedule(pendingReschedule.id, false)));
                rescheduleBlock.querySelector("[data-rs-withdraw]")?.addEventListener("click", e => act(e.currentTarget, () => armusWithdrawReschedule(pendingReschedule.id)));
                card.appendChild(rescheduleBlock);
              }

              // the teacher's open hours are needed to offer new times - not
              // available when the teacher is no longer listed; a teacher's
              // own pending proposal gets answered first
              // migration_112.sql: a lesson can be moved at most 2 times
              const moveLimitReached = (rescheduleCounts[booking.id]?.studentMoves || 0) >= ARMUS_MAX_STUDENT_MOVES;
              const canReschedule = !!teacher && !moveLimitReached && !(pendingReschedule && pendingReschedule.requestedBy === "teacher");

              const cancelWrap = document.createElement("div");
              cancelWrap.className = "lesson-cancel-wrap";
              cancelWrap.innerHTML = `
                ${canReschedule ? `<button type="button" class="lesson-reschedule-btn" data-reschedule>${armusT("myLessons.rescheduleBtn", "Saati Değiştir")}</button>` : ""}
                <button type="button" class="lesson-cancel-btn">${armusT("myLessons.cancelBtn", "Dersi İptal Et")}</button>
                <span class="lesson-cancel-hint">${refundHint}</span>
                ${moveLimitReached ? `<span class="lesson-cancel-hint">${armusT("myLessons.moveLimitReached", "Bu ders 2 kez taşındı - bir ders en fazla 2 kez taşınabilir.")}</span>` : ""}
              `;

              cancelWrap.querySelector("[data-reschedule]")?.addEventListener("click", async (e) => {
                const btn = e.currentTarget;
                btn.disabled = true;
                const busy = await armusGetTeacherBusyTimes(booking.teacherId).catch(() => []);
                btn.disabled = false;
                // re-checked now, not when the page loaded
                const late = armusHoursUntilLesson(booking) < ARMUS_FREE_CANCEL_HOURS;
                const pick = await armusOpenReschedulePicker({
                  teacher,
                  timeZone: booking.teacherTimezone || teacher.timezone,
                  busyTimes: busy,
                  current: { date: booking.date, time: booking.time },
                  title: armusT("myLessons.rescheduleTitle", "Dersin için yeni bir saat seç"),
                  note: late
                    ? armusT("myLessons.rescheduleLateNote", "Derse 12 saatten az kaldı: seçtiğin saat öğretmenin onayına gönderilir. Ders başlayana kadar onaylamazsa ders eski saatinde kalır.")
                    : armusT("myLessons.rescheduleNote", "Dersin hemen yeni saate taşınır - ücret değişmez, öğretmenine e-posta ile haber verilir."),
                  confirmLabel: late
                    ? armusT("myLessons.rescheduleSendRequest", "Öğretmene İstek Gönder")
                    : armusT("myLessons.rescheduleConfirm", "Dersi Bu Saate Taşı"),
                });
                if (!pick) return;
                btn.disabled = true;
                btn.textContent = armusT("myLessons.rescheduling", "Gönderiliyor...");
                const result = await armusRescheduleBooking(booking.id, pick.date, pick.time);
                if (!result.ok) {
                  alert(result.error);
                  btn.disabled = false;
                  btn.textContent = armusT("myLessons.rescheduleBtn", "Saati Değiştir");
                  return;
                }
                location.reload();
              });

              cancelWrap.querySelector(".lesson-cancel-btn").addEventListener("click", async () => {

                let confirmMsg = armusT("myLessons.cancelConfirm", "{name} ile {date}, {time} dersini iptal etmek istediğine emin misin?")
                  .replace("{name}", armusShortDisplayName(booking.teacherName))
                  .replace("{date}", when.dateLabel)
                  .replace("{time}", when.timeRange);
                // re-checked at click time, not taken from the hint rendered
                // when the page loaded - the page may have stayed open
                // across the 12-hour line since then
                if (armusHoursUntilLesson(booking) < ARMUS_FREE_CANCEL_HOURS) {
                  confirmMsg += "\n\n" + armusT("myLessons.cancelConfirmLateWarning", "Dikkat:") + " " + lateCancelMessage() + ".";
                }
                if (!confirm(confirmMsg)) return;

                const btn = cancelWrap.querySelector(".lesson-cancel-btn");
                btn.disabled = true;
                btn.textContent = armusT("myLessons.cancelling", "İptal ediliyor...");

                const result = await armusCancelBooking(booking.id);

                if (!result.ok) {
                  alert(result.error);
                  btn.disabled = false;
                  btn.textContent = armusT("myLessons.cancelBtn", "Dersi İptal Et");
                  return;
                }

                cancelWrap.outerHTML = `
                  <div class="lesson-cancel-badge">
                    ${lateCancelBadgeOr(result.lateCancel, `${armusT("myLessons.cancelled", "⊘ İptal edildi")}${result.refunded ? armusT("myLessons.creditAdded", " · Ders hakkın eklendi") : armusT("myLessons.creditNotAdded", " · Ders hakkı eklenmedi")}`)}
                  </div>
                `;
                if (disputeBlock) disputeBlock.remove();
                if (rescheduleBlock) rescheduleBlock.remove();

                // the lesson leaves the upcoming list right away - newest
                // entry at the top of history, as a reload would order it
                card.classList.add("lesson-cancelled");
                if (!historyHeading.isConnected) list.appendChild(historyHeading);
                historyHeading.after(card);
                // that was the last upcoming lesson - drop the empty heading
                if (historyHeading.previousElementSibling === upcomingHeading) upcomingHeading.remove();
              });

              card.appendChild(cancelWrap);
            }

            if (isPast && !isCancelled) {
              const report = reportByBooking.get(booking.id);
              if (report) card.appendChild(buildReportStatus(report));
              else if (checkinOpen(booking)) card.appendChild(buildCheckinBox(booking));
              card.appendChild(await buildReviewBlock(booking));
            }
            if (!isCancelled) {
              disputeBlock = buildDisputeBlock(booking);
              card.appendChild(disputeBlock);
            }

            // migration_112.sql: a student can report a teacher to the
            // admin (teacher_reports) - real teachers only
            if (isRealTeacherId(booking.teacherId)) {
              const extra = document.createElement("div");
              extra.className = "lesson-extra-actions";
              extra.innerHTML = `<button type="button" class="text-link-btn">${armusT("myLessons.reportTeacher", "Öğretmeni şikayet et")}</button>`;
              extra.querySelector("button").addEventListener("click", () => armusOpenTeacherReportModal({
                teacherId: booking.teacherId,
                teacherName: armusShortDisplayName(booking.teacherName),
                reporterId: session.id,
                bookingId: booking.id,
              }));
              card.appendChild(extra);
            }

            list.appendChild(card);
          }
        }
      }

      await renderLessons();
      document.addEventListener("armus:langchange", renderLessons);

      // from the after-lesson email: ?checkin=<id> / ?review=<id>
      const params = new URLSearchParams(location.search);
      const targetId = params.get("checkin") || params.get("review");
      if (targetId) {
        const targetCard = [...list.querySelectorAll(".lesson-card")].find(c => c.dataset.bookingId === targetId);
        if (targetCard) {
          targetCard.classList.add("is-target");
          targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
          if (params.get("review")) targetCard.querySelector(".review-prompt-btn")?.click();
        }
      }
    }

    })();

  </script>

  <script>armusRenderAnnouncementBanner();</script>
</body>
</html>
