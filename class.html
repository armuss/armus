<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ders Odası | ARMUS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="theme.css?v=4">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--armus-bg);
      background-image: var(--armus-bg-glow);
      color: var(--armus-ink);
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 1px solid var(--armus-border);
      border-radius: 12px;
      padding: 11px 18px;
      background: transparent;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-light {
      background: var(--armus-gold-gradient);
      color: var(--armus-on-gold);
      border-color: transparent;
      font-weight: 700;
    }

    /* ---- states shown before the call mounts ---- */

    .state-screen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
    }

    .state-screen .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      margin-bottom: 30px;
    }

    .state-screen h1 {
      font-size: 24px;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
    }

    .state-screen p {
      color: var(--armus-muted);
      font-size: 14px;
      max-width: 420px;
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .state-screen .lesson-meta {
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 13.5px;
      color: var(--armus-ink);
      margin-bottom: 24px;
    }

    .state-screen .lesson-meta strong {
      color: var(--armus-gold-text);
    }

    /* ---- active room ---- */

    .room {
      display: none;
      height: 100vh;
      flex-direction: column;
      background: #14100c;
      color: var(--armus-silver-1);
    }

    .room-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--armus-border-soft);
      background: rgba(0, 0, 0, .2);
      flex-shrink: 0;
    }

    .room-bar .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--armus-gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }

    .room-bar .lesson-with {
      font-size: 12.5px;
      color: #b8b8bb;
    }

    .room-bar .btn {
      color: var(--armus-silver-1);
      border-color: var(--armus-silver-border-strong);
    }

    .room-bar .btn.report-issue-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #f2a154;
      border-color: rgba(242, 161, 84, .4);
    }

    .room-bar .btn.report-issue-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ---- lesson progress timer ---- */

    .lesson-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      flex-shrink: 0;
    }

    .lesson-progress-track {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }

    .lesson-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--armus-gold-gradient);
      transition: width 1s linear, background .4s ease;
    }

    .lesson-progress-fill.overtime {
      background: linear-gradient(90deg, #e2574c, #f2a154);
    }

    .lesson-progress-label {
      font-size: 12px;
      color: #b8b8bb;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ---- video area + vocab pin widget ---- */

    .room-body {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
    }

    #jitsiContainer {
      flex: 1;
      min-height: 0;
    }

    .vocab-pin {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 5;
    }

    .vocab-pin-btn {
      border: 1px solid var(--armus-border);
      background: rgba(20, 18, 14, .85);
      backdrop-filter: blur(6px);
      color: var(--armus-silver-1);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .vocab-pin-btn:hover {
      border-color: var(--armus-gold-text);
      color: var(--armus-gold-text);
    }

    .vocab-pin-form {
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 220px;
    }

    .vocab-pin-form input {
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--armus-border-soft);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13px;
    }

    .vocab-pin-actions {
      display: flex;
      gap: 8px;
    }

    .vocab-pin-actions .btn {
      padding: 7px 12px;
      font-size: 12px;
      flex: 1;
    }

    .vocab-pin-toast {
      background: rgba(20, 18, 14, .9);
      border: 1px solid var(--armus-gold-text);
      color: var(--armus-gold-text);
      font-size: 12.5px;
      padding: 8px 14px;
      border-radius: 999px;
    }

    /* ---- post-class quick review / note popup ---- */

    .post-class-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .post-class-modal {
      background: var(--armus-panel);
      border: 1px solid var(--armus-border);
      border-radius: 18px;
      padding: 26px;
      width: min(400px, 100%);
    }

    .post-class-modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
      letter-spacing: -.4px;
    }

    .post-class-stars {
      display: flex;
      gap: 6px;
      font-size: 28px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .post-class-stars span {
      color: var(--armus-border);
      transition: color .15s;
    }

    .post-class-stars span.active {
      color: var(--armus-gold-text);
    }

    .post-class-modal textarea {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--armus-border-soft);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13.5px;
      min-height: 80px;
      resize: vertical;
    }

    .post-class-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .post-class-actions .btn {
      flex: 1;
    }

    .post-class-modal p {
      font-size: 13.5px;
      color: var(--armus-silver-1);
      margin-bottom: 14px;
    }

    .attendance-report-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .attendance-report-options button {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      justify-content: flex-start;
      padding: 12px 14px;
    }

    .attendance-report-options button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: #f2a154;
    }

    .post-class-modal input[type="number"] {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--armus-border-soft);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--armus-ink);
      font-family: inherit;
      font-size: 13.5px;
      margin-bottom: 14px;
    }

    /* the [hidden] attribute is how these get toggled in JS - these
       overrides beat the unconditional display:flex/inline-block above them.
       !important on the two button ones since .room-bar .btn.report-issue-btn
       and .post-class-actions .btn are themselves more specific than a
       plain [hidden] attribute selector would otherwise win against */
    .post-class-overlay[hidden],
    .vocab-pin-form[hidden] {
      display: none;
    }

    .report-issue-btn[hidden],
    .post-class-actions .btn[hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="state-screen" id="gate">
    <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
    <h1 id="gateTitle"></h1>
    <p id="gateText"></p>
    <div id="gateActions"></div>
  </div>

  <div class="state-screen" id="tooEarly">
    <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
    <h1 data-i18n="class.tooEarlyTitle">Ders zamanı henüz gelmedi</h1>
    <p data-i18n="class.tooEarlyText">Bu odaya dersin başlamasına <strong id="minutesUntil"></strong> dakika kala girebilirsin.</p>
    <div class="lesson-meta" id="tooEarlyMeta"></div>
    <a class="btn" id="tooEarlyBack" href="my-lessons.html" data-i18n="class.backToLessons">← Derslerime dön</a>
  </div>

  <div class="state-screen" id="tooLate">
    <a href="index.html" class="logo"><img src="logo-black.png" alt="ARMUS" class="logo-img"></a>
    <h1 data-i18n="class.tooLateTitle">Bu ders sona erdi</h1>
    <p data-i18n="class.tooLateText">Bu dersin oda süresi doldu. Yeni bir ders için tekrar rezervasyon yapabilirsin.</p>
    <a class="btn btn-light" id="tooLateBack" href="my-lessons.html" data-i18n="class.backToLessons">← Derslerime dön</a>
  </div>

  <div class="room" id="room">
    <div class="room-bar">
      <a href="index.html" class="logo"><img src="logo-cream.png" alt="ARMUS" class="logo-img"></a>
      <span class="lesson-with" id="lessonWith"></span>
      <button type="button" class="btn report-issue-btn" id="reportIssueBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span data-i18n="class.reportIssueBtn">Bildir</span>
      </button>
      <button type="button" class="btn" id="leaveBtn" data-i18n="class.leave">Ayrıl</button>
    </div>
    <div class="lesson-progress" id="lessonProgress">
      <div class="lesson-progress-track">
        <div class="lesson-progress-fill" id="progressFill"></div>
      </div>
      <div class="lesson-progress-label" id="progressLabel"></div>
    </div>
    <div class="room-body">
      <div id="jitsiContainer"></div>
      <div class="vocab-pin" id="vocabPin">
        <button type="button" class="vocab-pin-btn" id="vocabPinBtn" data-i18n="class.addWord">+ Kelime Ekle</button>
        <form class="vocab-pin-form" id="vocabPinForm" hidden>
          <input type="text" id="vocabTermInput" placeholder="Kelime" required data-i18n-placeholder="class.wordPlaceholder">
          <input type="text" id="vocabMeaningInput" placeholder="Anlamı" required data-i18n-placeholder="class.meaningPlaceholder">
          <div class="vocab-pin-actions">
            <button type="submit" class="btn btn-light" data-i18n="class.add">Ekle</button>
            <button type="button" class="btn" id="vocabPinCancel" data-i18n="class.cancel">İptal</button>
          </div>
        </form>
        <div class="vocab-pin-toast" id="vocabPinToast" hidden data-i18n="class.wordSaved">✓ Kelime kaydedildi</div>
      </div>
    </div>
  </div>

  <div class="post-class-overlay" id="postClassOverlay" hidden>
    <div class="post-class-modal">
      <h2 id="postClassTitle"></h2>
      <div id="postClassBody"></div>
      <div class="post-class-actions">
        <button type="button" class="btn" id="postClassSkip" data-i18n="class.skip">Atla</button>
        <button type="button" class="btn btn-light" id="postClassSave" data-i18n="class.saveAndExit">Kaydet ve Çık</button>
      </div>
    </div>
  </div>

  <div class="post-class-overlay" id="attendanceReportOverlay" hidden>
    <div class="post-class-modal">
      <h2 id="attendanceReportTitle" data-i18n="class.reportModalTitle">Öğretmenle ilgili bir şey mi bildireceksin?</h2>
      <div id="attendanceReportBody"></div>
    </div>
  </div>

  <script src="i18n.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=4"></script>
  <script src="auth.js?v=5"></script>
  <script src="bookings.js?v=5"></script>
  <script src="reviews.js?v=5"></script>
  <script src="attendance.js?v=4"></script>
  <script src="teacher-notes.js?v=4"></script>
  <script src="student-extras.js?v=4"></script>
  <script src="https://meet.jit.si/external_api.js"></script>
  <script>

    const gate = document.getElementById("gate");
    const tooEarly = document.getElementById("tooEarly");
    const tooLate = document.getElementById("tooLate");
    const room = document.getElementById("room");

    function showGate(title, text, actionsHtml) {
      document.getElementById("gateTitle").textContent = title;
      document.getElementById("gateText").textContent = text;
      document.getElementById("gateActions").innerHTML = actionsHtml || "";
      gate.style.display = "flex";
    }

    (async function () {

      const bookingId = new URLSearchParams(window.location.search).get("booking");

      if (!bookingId) {
        showGate(
          armusT("class.gateNoBookingTitle", "Ders odası bulunamadı"),
          armusT("class.gateNoBookingText", "Geçerli bir ders bağlantısıyla buraya gelmelisin."),
          `<a class="btn btn-light" href="my-lessons.html">${armusT("class.backToLessonsPlain", "Derslerime dön")}</a>`
        );
        return;
      }

      const session = await armusGetSession();

      if (!session) {
        showGate(
          armusT("class.gateLoginTitle", "Giriş yapmalısın"),
          armusT("class.gateLoginText", "Bu ders odasına girmek için hesabınla giriş yapmalısın."),
          `<a class="btn btn-light" href="login.html?next=${encodeURIComponent(window.location.href)}">${armusT("nav.login", "Giriş Yap")}</a>`
        );
        return;
      }

      const booking = await armusGetBookingById(bookingId);

      // RLS already restricts this to participants (or admin) - a null
      // result covers both "doesn't exist" and "not your booking"
      // without telling a snooper which one it is.
      if (!booking) {
        showGate(
          armusT("class.gateNoAccessTitle", "Bu derse erişimin yok"),
          armusT("class.gateNoAccessText", "Bu ders bağlantısı geçersiz ya da bu dersin katılımcılarından biri değilsin."),
          `<a class="btn btn-light" href="my-lessons.html">${armusT("class.backToLessonsPlain", "Derslerime dön")}</a>`
        );
        return;
      }

      const isStudent = session.id === booking.studentId;
      const isTeacher = session.id === booking.teacherId;

      // bookings_select_admin_all (RLS) lets an admin fetch ANY booking
      // row, for dispute review - armusGetBookingById succeeding above
      // does NOT mean session is a participant. Without this check, an
      // admin (or any other id that policy might ever cover) would fall
      // through everything below and actually mount the Jitsi room as a
      // live participant in someone else's private lesson - reading the
      // booking's metadata for moderation is one thing, silently joining
      // the call itself is a different, much bigger privacy problem.
      if (!isStudent && !isTeacher) {
        showGate(
          armusT("class.gateNotParticipantTitle", "Bu canlı derse katılamazsın"),
          armusT("class.gateNotParticipantText", "Bu dersin öğrencisi ya da öğretmeni değilsin, bu yüzden canlı görüşmeye katılamazsın."),
          `<a class="btn btn-light" href="admin.html">${armusT("class.backToAdmin", "← Yönetim paneline dön")}</a>`
        );
        return;
      }

      const backHref = isTeacher ? "dashboard.html" : "my-lessons.html";
      document.getElementById("tooEarlyBack").href = backHref;
      document.getElementById("tooLateBack").href = backHref;

      if (booking.status === "cancelled") {
        showGate(
          armusT("class.gateCancelledTitle", "Bu ders iptal edildi"),
          armusT("class.gateCancelledText", "Bu ders artık gerçekleşmeyecek."),
          `<a class="btn btn-light" href="${backHref}">${armusT("class.goBack", "← Geri dön")}</a>`
        );
        return;
      }

      const { start, end, joinsFrom, joinsUntil } = armusLessonWindow(booking);
      const now = new Date();
      // shown in the viewer's own current local time, not the teacher's
      // - see armusFormatLessonWhen (migration_37.sql)
      const when = armusFormatLessonWhen(booking);

      if (now < joinsFrom) {
        const minutesUntil = Math.ceil((joinsFrom - now) / 60000);
        document.getElementById("minutesUntil").textContent = minutesUntil;
        const tooEarlyName = armusEscapeHtml(isStudent ? armusShortDisplayName(booking.teacherName) : booking.studentName);
        document.getElementById("tooEarlyMeta").innerHTML = (typeof armusGetLang === "function" && armusGetLang() === "en")
          ? `${armusT("class.tooEarlyMetaWith", "with")} <strong>${tooEarlyName}</strong> · ${when.dateLabel}, ${when.timeRange}`
          : `<strong>${tooEarlyName}</strong> ile ${when.dateLabel}, ${when.timeRange}`;
        tooEarly.style.display = "flex";

        // the countdown above was only ever computed once, off the
        // "now" at page load - a student who opens the room link a
        // little early (e.g. straight from a reminder email) and just
        // waits on this screen would be stuck here forever, even long
        // after the join window actually opened, with no indication
        // anything had changed. Poll until it opens, then reload so the
        // whole gate/booking check runs fresh (also re-picks-up a
        // cancellation made while they were waiting).
        const earlyCheckInterval = setInterval(() => {
          const currentNow = new Date();
          if (currentNow >= joinsFrom) {
            clearInterval(earlyCheckInterval);
            window.location.reload();
            return;
          }
          document.getElementById("minutesUntil").textContent = Math.ceil((joinsFrom - currentNow) / 60000);
        }, 15000);

        return;
      }

      if (now > joinsUntil) {
        tooLate.style.display = "flex";
        return;
      }

      const lessonWithName = isStudent ? armusShortDisplayName(booking.teacherName) : booking.studentName;
      document.getElementById("lessonWith").textContent = (typeof armusGetLang === "function" && armusGetLang() === "en")
        ? `${armusT("class.lessonWith", "Lesson with")} ${lessonWithName} · ${when.timeRange}`
        : `${lessonWithName} ile ders · ${when.timeRange}`;

      room.style.display = "flex";

      const jitsiApi = new JitsiMeetExternalAPI("meet.jit.si", {
        roomName: armusRoomNameForBooking(booking.id),
        parentNode: document.getElementById("jitsiContainer"),
        userInfo: { displayName: session.name },
        configOverwrite: { prejoinPageEnabled: false, disableDeepLinking: true },
        interfaceConfigOverwrite: { MOBILE_APP_PROMO: false },
      });

      // ---- report a no-show / late teacher, right from inside the
      // room - a student shouldn't have to sit through the whole lesson
      // (or even wait for the "leave" flow) to flag that the teacher
      // never joined ----

      const WARNING_TRIANGLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
      const CLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';

      const attendanceReportOverlay = document.getElementById("attendanceReportOverlay");
      const attendanceReportBody = document.getElementById("attendanceReportBody");

      // a "the teacher never showed up" report hides them immediately,
      // with no admin pre-check - give it a short grace period after the
      // scheduled start so a student who reports within seconds of
      // joining (the teacher might just be a minute behind) can't
      // instantly hide someone over nothing. "late" has no such gate -
      // any time after the lesson was due to start, it already is late.
      const ARMUS_NO_SHOW_GRACE_MINUTES = 10;
      function noShowReportReady() {
        return new Date() >= new Date(start.getTime() + ARMUS_NO_SHOW_GRACE_MINUTES * 60000);
      }

      function closeAttendanceReportModal() {
        attendanceReportOverlay.hidden = true;
      }

      async function submitAttendanceReport(type, lateMinutes) {
        attendanceReportBody.innerHTML = `<p>${armusT("class.reportSending", "Gönderiliyor...")}</p>`;
        const result = await armusReportAttendanceIssue({
          bookingId: booking.id,
          teacherId: booking.teacherId,
          studentId: session.id,
          type,
          lateMinutes,
        });
        if (!result) {
          attendanceReportBody.innerHTML = `
            <p>${armusT("class.reportFailed", "Bildirim gönderilemedi. Lütfen tekrar dene.")}</p>
            <div class="post-class-actions"><button type="button" class="btn btn-light" data-close>${armusT("class.close", "Kapat")}</button></div>
          `;
          attendanceReportBody.querySelector("[data-close]").addEventListener("click", closeAttendanceReportModal);
          return;
        }
        attendanceReportBody.innerHTML = `
          <p>${armusT("class.reportSent", "Bildirimin alındı. Öğretmenin profili yeni öğrencilerden geçici olarak gizlendi ve ekibimiz inceleyecek.")}</p>
          <div class="post-class-actions"><button type="button" class="btn btn-light" data-close>${armusT("class.close", "Kapat")}</button></div>
        `;
        attendanceReportBody.querySelector("[data-close]").addEventListener("click", closeAttendanceReportModal);
      }

      async function openAttendanceReportModal() {

        const existing = await armusGetAttendanceReportForBooking(booking.id);

        if (existing) {
          attendanceReportBody.innerHTML = `
            <p>${armusT("class.alreadyReported", "Bu ders için zaten bir bildirim göndermiştin.")}</p>
            <div class="post-class-actions"><button type="button" class="btn btn-light" data-close>${armusT("class.close", "Kapat")}</button></div>
          `;
          attendanceReportBody.querySelector("[data-close]").addEventListener("click", closeAttendanceReportModal);
          attendanceReportOverlay.hidden = false;
          return;
        }

        const noShowReady = noShowReportReady();

        attendanceReportBody.innerHTML = `
          <p>${armusT("class.reportModalText", "Öğretmenle ilgili ne bildirmek istiyorsun?")}</p>
          <div class="attendance-report-options">
            <button type="button" class="btn btn-light" data-report="no_show" ${noShowReady ? "" : "disabled"}>${WARNING_TRIANGLE_SVG}<span>${armusT("class.reportNoShow", "Öğretmen derse hiç gelmedi")}</span></button>
            <button type="button" class="btn btn-light" data-report="late">${CLOCK_SVG}<span>${armusT("class.reportLate", "Öğretmen geç geldi")}</span></button>
          </div>
          ${noShowReady ? "" : `<p>${armusT("class.reportNoShowTooSoon", "Öğretmen hâlâ gelmediyse birkaç dakika sonra tekrar dene.")}</p>`}
          <button type="button" class="btn" data-close style="width:100%;">${armusT("class.cancel", "İptal")}</button>
        `;

        attendanceReportBody.querySelector("[data-close]").addEventListener("click", closeAttendanceReportModal);

        if (noShowReady) {
          attendanceReportBody.querySelector('[data-report="no_show"]').addEventListener("click", () => {
            submitAttendanceReport("no_show");
          });
        }

        attendanceReportBody.querySelector('[data-report="late"]').addEventListener("click", () => {
          attendanceReportBody.innerHTML = `
            <p>${armusT("class.reportLateMinutesText", "Kaç dakika geç kaldı? (opsiyonel)")}</p>
            <input type="number" min="1" max="180" id="lateMinutesInput" placeholder="${armusT("class.reportLateMinutesPlaceholder", "Örn. 10")}">
            <div class="post-class-actions">
              <button type="button" class="btn" data-close>${armusT("class.cancel", "İptal")}</button>
              <button type="button" class="btn btn-light" data-submit-late>${armusT("class.reportSend", "Gönder")}</button>
            </div>
          `;
          attendanceReportBody.querySelector("[data-close]").addEventListener("click", closeAttendanceReportModal);
          attendanceReportBody.querySelector("[data-submit-late]").addEventListener("click", () => {
            const minutes = Number(document.getElementById("lateMinutesInput").value) || null;
            submitAttendanceReport("late", minutes);
          });
        });

        attendanceReportOverlay.hidden = false;
      }

      if (isStudent) {
        const reportIssueBtn = document.getElementById("reportIssueBtn");
        reportIssueBtn.hidden = false;
        reportIssueBtn.addEventListener("click", openAttendanceReportModal);
      }

      // ---- lesson progress timer: fills as the lesson runs, flips to
      // an "overtime" color and counts up past the scheduled end ----

      const progressFill = document.getElementById("progressFill");
      const progressLabel = document.getElementById("progressLabel");

      function formatClock(ms) {
        const totalSeconds = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function updateLessonProgress() {
        const nowTick = new Date();
        const pct = Math.min(100, Math.max(0, ((nowTick - start) / (end - start)) * 100));
        progressFill.style.width = pct + "%";

        const isEn = typeof armusGetLang === "function" && armusGetLang() === "en";
        if (nowTick > end) {
          progressFill.classList.add("overtime");
          progressLabel.textContent = isEn
            ? `${armusT("class.lessonEnded", "Ders bitti")} · +${formatClock(nowTick - end)} ${armusT("class.overtime", "ek süre")}`
            : `Ders bitti · +${formatClock(nowTick - end)} ek süre`;
        } else {
          progressFill.classList.remove("overtime");
          progressLabel.textContent = isEn
            ? `${formatClock(nowTick - start)} ${armusT("class.elapsed", "geçti")} · ${formatClock(end - nowTick)} ${armusT("class.remaining", "kaldı")}`
            : `${formatClock(nowTick - start)} geçti · ${formatClock(end - nowTick)} kaldı`;
        }
      }

      updateLessonProgress();
      const progressInterval = setInterval(updateLessonProgress, 1000);

      // ---- pin a word to the student's vocab vault mid-lesson ----
      // (works for either side - always saved onto the student's own
      // vault, see migration_21.sql for the RLS letting the teacher
      // write into it too)

      const vocabPinBtn = document.getElementById("vocabPinBtn");
      const vocabPinForm = document.getElementById("vocabPinForm");
      const vocabPinToast = document.getElementById("vocabPinToast");

      vocabPinBtn.addEventListener("click", () => {
        vocabPinBtn.hidden = true;
        vocabPinForm.hidden = false;
        document.getElementById("vocabTermInput").focus();
      });

      document.getElementById("vocabPinCancel").addEventListener("click", () => {
        vocabPinForm.reset();
        vocabPinForm.hidden = true;
        vocabPinBtn.hidden = false;
      });

      vocabPinForm.addEventListener("submit", async event => {
        event.preventDefault();

        const term = document.getElementById("vocabTermInput").value.trim();
        const meaning = document.getElementById("vocabMeaningInput").value.trim();
        if (!term || !meaning) return;

        const saved = await armusAddVocabEntry(booking.studentId, term, meaning);

        vocabPinForm.reset();
        vocabPinForm.hidden = true;
        vocabPinBtn.hidden = false;

        if (saved) {
          vocabPinToast.hidden = false;
          setTimeout(() => { vocabPinToast.hidden = true; }, 2200);
        }
      });

      // ---- leaving: a quick review (student) or private note (teacher)
      // before heading back, whether "Ayrıl" or Jitsi's own hangup
      // button was used ----

      const postClassOverlay = document.getElementById("postClassOverlay");
      const postClassTitle = document.getElementById("postClassTitle");
      const postClassBody = document.getElementById("postClassBody");
      const postClassSkip = document.getElementById("postClassSkip");
      const postClassSave = document.getElementById("postClassSave");

      function finishAndLeave() {
        window.location.href = backHref;
      }

      let postClassOpened = false;

      async function openPostClassModal() {

        if (postClassOpened) return;
        postClassOpened = true;

        clearInterval(progressInterval);
        try { jitsiApi.dispose(); } catch (err) {}

        if (isStudent) {

          const existingReview = await armusGetReviewForBooking(booking.id);
          if (existingReview) { finishAndLeave(); return; }

          function renderReviewStep() {

            postClassTitle.textContent = armusT("class.postClassReviewTitle", "Bu ders nasıldı?");
            let stars = 0;
            postClassBody.innerHTML = `
              <div class="post-class-stars" id="postClassStars">
                ${[1, 2, 3, 4, 5].map(n => `<span data-star="${n}">★</span>`).join("")}
              </div>
              <textarea id="postClassComment" placeholder="${armusT("class.postClassCommentPlaceholder", "İstersen kısa bir not bırak (opsiyonel)")}"></textarea>
            `;
            postClassSkip.hidden = false;
            postClassSave.hidden = false;

            const starEls = postClassBody.querySelectorAll("[data-star]");
            starEls.forEach(el => {
              el.addEventListener("click", () => {
                stars = Number(el.dataset.star);
                starEls.forEach(s => s.classList.toggle("active", Number(s.dataset.star) <= stars));
              });
            });

            postClassSave.onclick = async () => {
              if (stars > 0) {
                await armusAddReview({
                  bookingId: booking.id,
                  teacherId: booking.teacherId,
                  studentId: session.id,
                  studentName: session.name,
                  stars,
                  text: postClassBody.querySelector("#postClassComment").value.trim(),
                });
              }
              finishAndLeave();
            };
          }

          // asked first, every time (unless already reported from inside
          // the room) - a student confirming the lesson happened is what
          // moves on to the star rating; "it didn't" or "it was late"
          // files the same report the in-room button does, then skips
          // straight to leaving (nothing to rate for a lesson that never
          // properly happened)
          const existingAttendanceReport = await armusGetAttendanceReportForBooking(booking.id);

          if (existingAttendanceReport) {
            renderReviewStep();
          } else {

            const noShowReady = noShowReportReady();

            postClassTitle.textContent = armusT("class.checkinTitle", "Bu ders gerçekleşti mi?");
            postClassBody.innerHTML = `
              <p>${armusT("class.checkinText", "{date}, {time} için planlanan ders.").replace("{date}", when.dateLabel).replace("{time}", when.timeRange)}</p>
              <div class="attendance-report-options">
                <button type="button" class="btn btn-light" data-checkin="yes">${armusT("class.checkinYes", "Evet, zamanında oldu")}</button>
                <button type="button" class="btn btn-light" data-checkin="late">${CLOCK_SVG}<span>${armusT("class.checkinLate", "Evet ama öğretmen geç geldi")}</span></button>
                <button type="button" class="btn btn-light" data-checkin="no_show" ${noShowReady ? "" : "disabled"}>${WARNING_TRIANGLE_SVG}<span>${armusT("class.checkinNoShow", "Hayır, öğretmen gelmedi")}</span></button>
              </div>
              ${noShowReady ? "" : `<p>${armusT("class.reportNoShowTooSoon", "Öğretmen hâlâ gelmediyse birkaç dakika sonra tekrar dene.")}</p>`}
            `;
            postClassSkip.hidden = true;
            postClassSave.hidden = true;

            postClassBody.querySelector('[data-checkin="yes"]').addEventListener("click", renderReviewStep);

            // armusReportAttendanceIssue can fail (a dropped connection, a
            // report that snuck in for this booking from another tab,
            // etc) - silently moving on regardless, as this used to,
            // meant the student walked away thinking a "the teacher
            // didn't show up" report was filed when nothing was actually
            // saved. Both branches below now check the result and let
            // the student retry instead.
            function renderCheckinReportFailed(retry) {
              postClassBody.innerHTML = `
                <p>${armusT("class.reportFailed", "Bildirim gönderilemedi. Lütfen tekrar dene.")}</p>
                <div class="post-class-actions">
                  <button type="button" class="btn" data-skip>${armusT("class.skip", "Atla")}</button>
                  <button type="button" class="btn btn-light" data-retry>${armusT("class.reportRetry", "Tekrar dene")}</button>
                </div>
              `;
              postClassBody.querySelector("[data-retry]").addEventListener("click", retry);
              postClassBody.querySelector("[data-skip]").addEventListener("click", finishAndLeave);
            }

            if (noShowReady) {
              async function submitCheckinNoShow() {
                postClassBody.innerHTML = `<p>${armusT("class.reportSending", "Gönderiliyor...")}</p>`;
                const result = await armusReportAttendanceIssue({
                  bookingId: booking.id, teacherId: booking.teacherId, studentId: session.id, type: "no_show",
                });
                if (!result) {
                  renderCheckinReportFailed(submitCheckinNoShow);
                  return;
                }
                finishAndLeave();
              }
              postClassBody.querySelector('[data-checkin="no_show"]').addEventListener("click", submitCheckinNoShow);
            }

            postClassBody.querySelector('[data-checkin="late"]').addEventListener("click", () => {
              postClassBody.innerHTML = `
                <p>${armusT("class.reportLateMinutesText", "Kaç dakika geç kaldı? (opsiyonel)")}</p>
                <input type="number" min="1" max="180" id="checkinLateMinutes" placeholder="${armusT("class.reportLateMinutesPlaceholder", "Örn. 10")}">
                <div class="post-class-actions">
                  <button type="button" class="btn btn-light" data-continue>${armusT("class.continueBtn", "Devam Et")}</button>
                </div>
              `;
              postClassBody.querySelector("[data-continue]").addEventListener("click", () => {
                const minutes = Number(document.getElementById("checkinLateMinutes").value) || null;
                async function submitCheckinLate() {
                  postClassBody.innerHTML = `<p>${armusT("class.reportSending", "Gönderiliyor...")}</p>`;
                  const result = await armusReportAttendanceIssue({
                    bookingId: booking.id, teacherId: booking.teacherId, studentId: session.id, type: "late", lateMinutes: minutes,
                  });
                  if (!result) {
                    renderCheckinReportFailed(submitCheckinLate);
                    return;
                  }
                  renderReviewStep();
                }
                submitCheckinLate();
              });
            });
          }

        } else {

          const notes = await armusGetTeacherNotes(session.id);
          const existing = notes[booking.studentId];

          postClassTitle.textContent = (typeof armusGetLang === "function" && armusGetLang() === "en")
            ? `${armusT("class.postClassNoteFor", "Note for")} ${booking.studentName}`
            : `${booking.studentName} için not`;
          postClassBody.innerHTML = `
            <textarea id="postClassNote" placeholder="${armusT("class.postClassNotePlaceholder", "Bu öğrenci hakkında kısa bir not (sadece sen görürsün)")}">${existing ? armusEscapeHtml(existing.note) : ""}</textarea>
          `;

          postClassSave.onclick = async () => {
            const note = postClassBody.querySelector("#postClassNote").value.trim();
            if (note) await armusSaveTeacherNote(session.id, booking.studentId, note);
            finishAndLeave();
          };
        }

        postClassSkip.onclick = finishAndLeave;
        postClassOverlay.hidden = false;
      }

      document.getElementById("leaveBtn").addEventListener("click", openPostClassModal);
      jitsiApi.addEventListener("readyToClose", openPostClassModal);

    })();

  </script>

</body>
</html>
